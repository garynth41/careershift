<style>
:root{
  color-scheme:light;
  --ground:#f3f5f8; --surface:#ffffff; --surface-2:#f8fafc; --line:#dde3ea; --line-2:#eef1f5;
  --ink:#14213d; --ink-2:#4c5a6e; --ink-3:#7d8899;
  --accent:#2a78d6; --accent-deep:#1c5cab; --accent-soft:#e3eefc;
  --good:#1a8c4e; --good-soft:#dff3e7; --warn:#d99000; --warn-soft:#fff2cc; --crit:#d9403f; --crit-soft:#fde3e3;
  --soon:#e26a2c; --soon-soft:#fde8dc; --idle:#8b95a1; --idle-soft:#e9edf1; --wait:#6b5bd6; --wait-soft:#e9e6fb;
  --rail:#14213d; --rail-ink:#c9d3e3; --rail-active:#2a78d6;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 4px 14px rgba(20,33,61,.05);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#12161c; --surface:#1a2029; --surface-2:#1f2733; --line:#2b3440; --line-2:#242d39;
    --ink:#eef1f5; --ink-2:#b4bdc9; --ink-3:#7f8a99;
    --accent:#3987e5; --accent-deep:#6da7ec; --accent-soft:#1c2f4a;
    --good:#3fbf76; --good-soft:#153826; --warn:#f0b429; --warn-soft:#3d2f0a; --crit:#f06a69; --crit-soft:#3f1a1a;
    --soon:#f0834e; --soon-soft:#3f2416; --idle:#8b95a1; --idle-soft:#2a323d; --wait:#a99cf2; --wait-soft:#2a2547;
    --rail:#0d1117; --rail-ink:#aab4c3; --rail-active:#3987e5;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#12161c; --surface:#1a2029; --surface-2:#1f2733; --line:#2b3440; --line-2:#242d39;
  --ink:#eef1f5; --ink-2:#b4bdc9; --ink-3:#7f8a99;
  --accent:#3987e5; --accent-deep:#6da7ec; --accent-soft:#1c2f4a;
  --good:#3fbf76; --good-soft:#153826; --warn:#f0b429; --warn-soft:#3d2f0a; --crit:#f06a69; --crit-soft:#3f1a1a;
  --soon:#f0834e; --soon-soft:#3f2416; --idle:#8b95a1; --idle-soft:#2a323d; --wait:#a99cf2; --wait-soft:#2a2547;
  --rail:#0d1117; --rail-ink:#aab4c3; --rail-active:#3987e5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;transition:grid-template-columns .22s ease}
body.rail-collapsed .app{grid-template-columns:56px 1fr}
.railtoggle{position:absolute;top:14px;right:8px;width:26px;height:26px;border-radius:7px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--rail-ink);cursor:pointer;font-size:16px;line-height:1;display:grid;place-items:center;z-index:2}
.railtoggle:hover{background:rgba(255,255,255,.14);color:#fff}
body.rail-collapsed .rail{padding-inline:8px}
body.rail-collapsed .railtoggle{position:static;margin:0 auto 10px}
body.rail-collapsed .brand{padding:4px 0 10px;justify-content:center}
body.rail-collapsed .brand .mark{cursor:pointer}

/* rail */
.rail{background:var(--rail);color:var(--rail-ink);padding-block:18px 10px;padding-inline:14px;position:sticky;top:0;height:100vh;overflow:hidden}

.nav .zone-btn.has-active{opacity:.9;color:#fff}
.zone-btn .chev{font-family:var(--mono);width:10px;display:inline-block;opacity:.8}
.zone-btn .badge{margin-left:auto}
.zonegrp{display:flex;flex-direction:column;gap:2px}
.zonegrp.collapsed .zone-btn{opacity:.55}
.navtools{display:flex;gap:6px;padding:10px 8px 4px;margin-top:4px}
.navtools button{background:none;border:1px solid rgba(255,255,255,.14);color:var(--rail-ink);border-radius:5px;padding:2px 8px;font-size:10.5px;cursor:pointer;opacity:.7}
.navtools button:hover{opacity:1;border-color:rgba(255,255,255,.4)}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;color:var(--rail-ink);cursor:pointer;font-size:13px}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}

.nav button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.nav .badge{margin-left:auto;font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.12);padding:1px 6px;border-radius:9px}
.nav button.active .badge{background:rgba(255,255,255,.25)}
/* main */
.main{padding-block:20px 48px;padding-inline:28px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.topbar h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
.topbar .sub{color:var(--ink-3);font-size:13px;margin-top:2px}
.asof{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.asof .chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink-2)}
.asof .chip b{font-family:var(--mono);color:var(--ink);font-weight:500}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-deep);color:#fff}
.btn.danger{color:var(--crit)}
.btn:focus-visible,.slicer button:focus-visible,.tbl input:focus-visible,.tbl select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* sections */
.grid{display:grid;gap:16px}
.g12{grid-template-columns:repeat(12,minmax(0,1fr))}
.span3{grid-column:span 3}.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:16px 18px;min-width:0}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px 16px;position:relative;box-shadow:var(--shadow);min-width:0}

.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--idle)}
.dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--crit)}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap;background:var(--idle-soft);color:var(--ink-2)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.soon{background:var(--soon-soft);color:var(--soon)}.pill.info{background:var(--accent-soft);color:var(--accent)}.pill.wait{background:var(--wait-soft);color:var(--wait)}
/* slicers */
.slicers{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px;align-items:flex-start}
.slicer{display:flex;flex-direction:column;gap:5px}
.slicer .sl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.slicer .opts{display:flex;flex-wrap:wrap;gap:4px}
.slicer button{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.slicer button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.slicer button:hover:not(.on){border-color:var(--accent)}
/* tables */
.tblwrap{overflow-x:auto}
.bm-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bm-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.bm-nav select{font-weight:600;min-width:170px}
.bm-tabs{display:flex;gap:6px;flex-wrap:wrap}.bm-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.usebar{display:inline-block;width:48px;height:6px;border-radius:3px;background:var(--line-2);margin-right:6px;vertical-align:middle;overflow:hidden}.usebar i{display:block;height:100%}
.tx-add{display:grid;grid-template-columns:150px minmax(160px,1.2fr) 150px 1.5fr auto;gap:8px;margin:4px 0 10px}
.tx-add input,.tx-add select{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;min-width:0}
@media (max-width:900px){.tx-add{grid-template-columns:1fr 1fr}.tx-add select,.tx-add input[type=text]:last-of-type{grid-column:1/-1}.tx-add .btn{grid-column:1/-1}.bm-nav select{min-width:0;flex:1}}
.tp-add{display:grid;grid-template-columns:1fr auto auto auto auto;gap:8px;margin:4px 0 10px}
.tp-add input,.tp-add select{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px}
.tp-add .tp-new{min-width:0}
.tp-summary{display:flex;gap:14px;font-size:12px;color:var(--ink-3);margin-bottom:6px;flex-wrap:wrap} .tp-summary a{color:var(--accent)}
.tp-list{list-style:none;margin:0;padding:0}
.tp-row{display:grid;grid-template-columns:auto 1fr 140px 110px 130px auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-2)}
.tp-row:last-child{border-bottom:0} .tp-row.done .tp-text{text-decoration:line-through;color:var(--ink-3)}
.tp-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--good);margin:0 4px}
.tp-main{min-width:0} .tp-text{width:100%;border:1px solid transparent;background:transparent;border-radius:4px;padding:3px 6px;font:inherit;font-size:13.5px;color:var(--ink)} .tp-text:hover{border-color:var(--line)} .tp-text:focus{background:var(--surface-2);border-color:var(--accent);outline:none}
.tp-meta{display:flex;gap:8px;align-items:center;padding-left:6px;font-size:11.5px;color:var(--ink-3);flex-wrap:wrap} .tp-cat{text-transform:uppercase;letter-spacing:.05em;font-size:10.5px;font-weight:600} .tp-note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.tp-due,.tp-sel{border:1px solid transparent;background:transparent;border-radius:4px;padding:4px 6px;font:inherit;font-size:12.5px;color:var(--ink)} .tp-due{font-family:var(--mono)} .tp-due:hover,.tp-sel:hover{border-color:var(--line)}
.tp-list .empty{padding:14px 6px}
@media (max-width:900px){.tp-row{grid-template-columns:auto 1fr auto;grid-auto-rows:auto}.tp-row .tp-due,.tp-row .tp-sel{grid-column:2}.tp-add{grid-template-columns:1fr 1fr}.tp-add .tp-new{grid-column:1/-1}}
.tbl .mv{background:none;border:0;color:var(--ink-3);cursor:pointer;padding:0 3px;font-size:9px;line-height:1.1}
.tbl .mv:hover{color:var(--accent)} .ro .mv{display:none}
.tbl tr.ex-off td{opacity:.55} .tbl tr.ex-off input[data-k=category]{text-decoration:line-through}
.mix{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line-2);margin:6px 0 8px}
.mix span{display:block;height:100%}
.mixleg{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap} .mixleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.scen{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px} .scen .box{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.scen .box .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)} .scen .box .v{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:2px} .scen .box .s{font-size:12px;color:var(--ink-2);margin-top:2px}
.rng{width:100%;accent-color:var(--accent);margin-top:4px} .ro .rng{pointer-events:auto;opacity:1}
.plist{list-style:none;margin:0;padding:0} .plist li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line-2)} .plist li:last-child{border-bottom:0} .plist input{margin-top:3px;accent-color:var(--accent)} .plist .t{font-weight:500} .plist .m{font-size:12px;color:var(--ink-3)} .plist li.done .t{text-decoration:line-through;color:var(--ink-3)}
@media (max-width:700px){.scen{grid-template-columns:1fr}}

.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:8px 8px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap;font-weight:600}

.tbl tr.st-crit td:first-child{box-shadow:inset 4px 0 0 var(--crit)}
.tbl tr.st-soon td:first-child{box-shadow:inset 4px 0 0 var(--soon)}
.tbl tr.st-idle td:first-child{box-shadow:inset 4px 0 0 var(--idle)}
.tbl tr.st-wait td:first-child{box-shadow:inset 4px 0 0 var(--wait)}

.tbl input:hover,.tbl select:hover{border-color:var(--line)}
.tbl input:focus,.tbl select:focus{background:var(--surface-2);border-color:var(--accent)}

.tblhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}

.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}

.chart{width:100%;min-height:220px}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:6px}

  /* layout */
  .grid{gap:12px}
  .span3,.span4,.span5,.span6,.span7,.span8{grid-column:span 12}
  .card{padding:14px 14px;border-radius:12px}

  .slicer button{white-space:nowrap;min-height:36px;padding:6px 12px;font-size:13px}
  .tblhead{gap:8px}
  .tblhead .btn{flex:none}
  .tbl input,.tbl select{min-height:40px;padding:6px 8px}
  .tbl td{white-space:normal}
  /* generic editable tables become cards — every column is visible without sideways scrolling */
  .tbl[data-tbl].cards{display:block;border:0}
  .tbl[data-tbl].cards thead{display:none}
  .tbl[data-tbl].cards tbody,.tbl[data-tbl].cards tfoot{display:block}
  .tbl[data-tbl].cards tbody tr{display:block;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px 6px;margin-bottom:10px;box-shadow:none;position:relative}
  .tbl[data-tbl].cards tbody tr.st-good{border-left:4px solid var(--good)} .tbl[data-tbl].cards tbody tr.st-warn{border-left:4px solid var(--warn)} .tbl[data-tbl].cards tbody tr.st-crit{border-left:4px solid var(--crit)} .tbl[data-tbl].cards tbody tr.st-soon{border-left:4px solid var(--soon)} .tbl[data-tbl].cards tbody tr.st-idle{border-left:4px solid var(--idle)} .tbl[data-tbl].cards tbody tr.st-wait{border-left:4px solid var(--wait)} .tbl[data-tbl].cards tbody tr.st-info{border-left:4px solid var(--accent)}
  .tbl[data-tbl].cards tbody tr td:first-child{box-shadow:none}
  .tbl[data-tbl].cards td{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px;align-items:center;border:0;padding:4px 0;min-height:36px}
  .tbl[data-tbl].cards td::before{content:attr(data-label);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .tbl[data-tbl].cards td:not([data-label]),.tbl[data-tbl].cards td[data-label=""]{grid-template-columns:1fr;justify-items:end}
  .tbl[data-tbl].cards td:not([data-label])::before,.tbl[data-tbl].cards td[data-label=""]::before{content:none}
  .tbl[data-tbl].cards td.num{text-align:left}
  .tbl[data-tbl].cards td.empty{grid-template-columns:1fr;text-align:center}
  .tbl[data-tbl].cards td.empty::before{content:none}
  .tbl[data-tbl].cards .del{position:absolute;top:6px;right:6px;font-size:16px;padding:6px 10px}
  .tbl[data-tbl].cards .mv{font-size:13px;padding:4px 8px}
  .tbl[data-tbl].cards tfoot tr{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;padding:8px 10px;background:var(--surface);border:1px dashed var(--line);border-radius:10px}
  .tbl[data-tbl].cards tfoot td{border:0;padding:2px 0}
  .tbl[data-tbl].cards tfoot td:empty{display:none}
  /* modals become bottom sheets */
  .modal-back{place-items:end center;padding:0}
  .modal{max-width:none;max-height:calc(100dvh - env(safe-area-inset-top) - 24px);border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom)}
  .modal .btn{min-height:44px}
  .theme-fixed{top:calc(10px + env(safe-area-inset-top));right:12px}
  .auth{min-height:100dvh;padding:calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom))}
  .auth-card{padding:22px 18px 18px}
  .toast{left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));transform:none;max-width:none}
  .banner{font-size:13px}
  .scen{grid-template-columns:1fr}

  .tp-add .tp-new,.tp-add .btn{grid-column:1/-1}
  .kit-grid,.grid2{grid-template-columns:1fr}
  .legend{gap:8px 12px}
}

const DAY = 86400000;
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const T = () => iso(today());
const addDays = (s,n) => { const d = s instanceof Date ? new Date(s) : parse(s); d.setDate(d.getDate()+n); return iso(d); };
const parse = s => { if(!s) return null; const [y,m,d]=String(s).slice(0,10).split('-').map(Number); return new Date(y,m-1,d); };
const diffDays = (a,b) => Math.round((parse(a)-parse(b))/DAY);
const fmtD = s => { if(!s) return '—'; return parse(s).toLocaleDateString(undefined,{month:'short',day:'numeric'}); };
const fmtDY = s => { if(!s) return '—'; return parse(s).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); };
// "$5,000.50", "28.99 %", "1 200" → 5000.5 / 28.99 / 1200; blank or junk → null
const parseNum = str => { let s=String(str??'').trim().replace(/\u2212|\u2013/g,'-'); if(!s) return null; let neg=false; const p=s.match(/^\((.*)\)$/); if(p){ s=p[1]; neg=true; }
  s=s.replace(/[\s$€£,%]|US\$|USD/gi,''); if(/^-/.test(s)){ neg=!neg; s=s.slice(1); } if(!/^\d*\.?\d+$|^\d+\.$/.test(s)) return null; const n=Number(s); return isNaN(n)?null:(neg?-n:n); };
const fmtMoney = n => (n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString();
const monthKey = s => s ? String(s).slice(0,7) : '';
const monthLabel = k => { const [y,m]=k.split('-'); return new Date(y,m-1,1).toLocaleDateString(undefined,{month:'short',year:'numeric'}); };
const quarterKey = s => { if(!s) return ''; const d=parse(s); return `${d.getFullYear()} Q${Math.floor(d.getMonth()/3)+1}`; };
const weekEnding = s => { const d=parse(s); const dow=d.getDay(); d.setDate(d.getDate()+((6-dow+7)%7)); return iso(d); };
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum = a => a.reduce((x,y)=>x+(+y||0),0);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'x'+Math.random().toString(36).slice(2));
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const toast = (m,err) => { const t=document.getElementById('toast'); if(!t) return; const now=Date.now(); if(!err&&t._err&&now-t._err<4500&&t.classList.contains('show')){ t.textContent=t.textContent+' · '+m; return; }
  if(err&&t._err&&now-t._err<4500&&t.classList.contains('show')&&t.textContent!==m) t.textContent=t.textContent+' · '+m; else t.textContent=m; t._err=err?now:0; t.classList.toggle('err',!!err); t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),err?6500:1800); };
const ago = ts => { const s=(Date.now()-new Date(ts))/1000; if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; };

/* ===================== Derived logic ===================== */
function taskState(r){
  const t=T();
  if(r.status==='Complete') return {cls:'good',label:'Complete'};
  if(r.due && r.due<t) return {cls:'crit',label:'Overdue'};
  if(r.due && r.due===t) return {cls:'soon',label:'Due Today'};
  if(r.due && diffDays(r.due,t)<=CFG.dueSoonDays) return {cls:'soon',label:'Due Soon'};
  if(r.status==='In Progress') return {cls:'warn',label:'In Progress'};
  if(r.status==='Blocked') return {cls:'crit',label:'Blocked'};
  if(r.status==='Waiting') return {cls:'wait',label:'Waiting'};
  return {cls:'idle',label:'Not Started'};
}
function ganttColor(r){ const t=T(); if(r.status==='Complete') return 'good'; if(r.due && r.due<t) return 'crit'; if(r.status==='In Progress') return 'warn'; return 'idle'; }
function followState(next,closed){
  const t=T();
  if(closed) return {cls:'idle',label:'Closed'};
  if(!next) return {cls:'idle',label:'No date'};
  if(next<t) return {cls:'crit',label:'Overdue'};
  if(next===t) return {cls:'soon',label:'Due today'};
  if(diffDays(next,t)<=CFG.followWindowDays) return {cls:'warn',label:'This week'};
  return {cls:'good',label:'Scheduled'};
}
function readiness(i){ return Math.round((i.research+i.star+i.technical+i.leadership+i.questions)/5); }
function readyCls(s){ return s>=CFG.readyGreen?'good':s>=CFG.readyYellow?'warn':'crit'; }
const loggedIn=we=>(S.activities||[]).filter(a=>a.date&&weekEnding(String(a.date).slice(0,10))===we).length;
function compliance(r){
  const summary = (+r.apps||0)+(+r.networking||0)+(+r.recruiters||0)+(+r.training||0)+(+r.other||0);
  const total = Math.max(summary, r.week?loggedIn(String(r.week).slice(0,10)):0);
  const req = S.settings.weeklyRequirement;
  if(total>=req) return {cls:'good',label:'Compliant',total};
  if(total>=Math.max(1,req-1)) return {cls:'warn',label:'At Risk',total};

function intApp(i){ if(!i) return null; if(i.app_id){ const a=S.apps.find(x=>x.id===i.app_id); if(a) return a; }
  const k=normCo(i.company); if(!k) return null; const m=S.apps.filter(a=>normCo(a.company)===k); return m.length===1?m[0]:null; }
const appInts=a=>S.interviews.filter(i=>intApp(i)===a).sort((x,y)=>String(x.date||'9999').localeCompare(String(y.date||'9999')));
const nextInt=a=>appInts(a).find(i=>i.date&&i.date>=T()&&(i.outcome||'Pending')==='Pending');
const REC_PLACEHOLDER=/^(n ?a|none|self|me|job board|company job site|linkedin|indeed|unknown|tbd|na|)$/;
function nameHit(full,name){ const A=nm(full).replace(/[@.]/g,' ').split(' ').filter(w=>w.length>1), B=nm(name).replace(/[@.]/g,' ').split(' ').filter(w=>w.length>1); if(!A.length||!B.length||REC_PLACEHOLDER.test(nm(name))||REC_PLACEHOLDER.test(nm(full))) return false; const [s,l]=B.length<=A.length?[B,A]:[A,B]; return s.length>=1&&s.every(w=>l.includes(w))&&(s.length>1||s[0].length>=4); }
function recLinked(rc,a){ const em=String(rc.email||'').toLowerCase().trim(); const ar=String(a.recruiter||'').toLowerCase()+' '+String(a.contact_email||'').toLowerCase(); if(em&&ar.includes(em)) return true; return nameHit(a.recruiter,rc.name); }
function recApps(rc){ const ag=normCo(rc.agency); return S.apps.filter(a=>recLinked(rc,a)||(ag&&normCo(a.company)===ag)); }
function recInts(rc){ const n=nm(rc.name), ap=new Set(recApps(rc)); return S.interviews.filter(i=>(n&&nm(i.interviewer).includes(n))||ap.has(intApp(i))); }
const coApps=co=>{ const k=normCo(co); return k?S.apps.filter(a=>normCo(a.company)===k):[]; };
const coContacts=co=>{ const k=normCo(co); return k?S.contacts.filter(c=>normCo(c.company)===k):[]; };
const appRecs=a=>{ const k=normCo(a.company); return S.recruiters.filter(r=>recLinked(r,a)||(k&&normCo(r.agency)===k)); };
/* recruiters named on applications who are not in the Recruiter CRM yet */
function missingRecruiters(){ const out={}; S.apps.forEach(a=>{ const raw=String(a.recruiter||'').trim(); if(!raw||raw==='—'||/^n\/?a$/i.test(raw)) return; if(appRecs(a).some(r=>{ const n=nm(r.name),ar=nm(raw); return n&&(ar.includes(n)||n.includes(ar)); })) return;
  const key=nm(raw); (out[key]=out[key]||{name:raw,apps:[]}).apps.push(a); }); return Object.values(out); }

/* an interview's stage / outcome moves its application forward (never backward) */
async function syncAppFromInterview(i){
  const a=intApp(i); if(!a||!canEdit()) return; const p={};
  // "Interview Oct 25 …" in Next action only while an interview is still coming up
  const up=appInts(a).filter(x=>x.date&&String(x.date).slice(0,10)>=T()&&(x.outcome||'Pending')==='Pending').sort((x,y)=>String(x.date).localeCompare(String(y.date)))[0];
  if(a.next&&/^interview /i.test(a.next)&&!up){ const last=appInts(a).filter(x=>x.date&&(x.outcome||'Pending')!=='Cancelled').sort((x,y)=>String(y.date).localeCompare(String(x.date)))[0]; p.next=last&&String(last.date).slice(0,10)<T()?`Follow up on ${last.stage} interview (${fmtD(String(last.date).slice(0,10))})`:''; }
  if(i.outcome==='Withdrew'){ if(a.status!=='Closed') p.status='Closed'; if(!['Offer','Rejected','Withdrawn'].includes(a.stage)) p.stage='Withdrawn'; p.next=`Withdrew ${fmtD(T())}`; }
  else if(i.outcome==='Cancelled'){ /* nothing moves; the next action above is cleared */ }
  else if(i.outcome==='Offer'||i.stage==='Offer'){ if(a.stage!=='Offer') p.stage='Offer'; }
  else if(i.outcome==='Rejected'||i.stage==='Rejected'){ if(!['Rejected','Offer'].includes(a.stage)) p.stage='Rejected'; if(a.status!=='Closed') p.status='Closed'; }
  else { const tgt=INT2APP[i.stage], ti=STAGE_ORDER.indexOf(tgt), ci=STAGE_ORDER.indexOf(a.stage); if(tgt&&ti>ci&&!['Rejected','Withdrawn'].includes(a.stage)) p.stage=tgt;
    if(up&&(!a.next||/^interview|^follow up on/i.test(a.next))) { const nx=`Interview ${fmtD(String(up.date).slice(0,10))}${up.time?' '+up.time:''} — ${up.stage}`; if(a.next!==nx) p.next=nx; else delete p.next; }
    if(i.date&&(i.outcome||'Pending')==='Pending'&&!a.next_date){ p.next_date=addDays(String(i.date).slice(0,10),3); } }
  if(Object.keys(p).length){ await db.update('apps',a.id,p); toast(`${a.ref} updated${p.stage?' → '+p.stage:''}`); }
}

async function recHook(op,coll,row,patch){
  if(!row||!canEdit()) return;
  try{
    if(coll==='apps'){
      if(op==='insert'&&CFG.autoFollow!==false&&row.status!=='Closed'&&!['Rejected','Offer'].includes(row.stage)&&(!row.applied||diffDays(T(),String(row.applied).slice(0,10))<Math.max(cfgN('staleDays')||30,cfgN('followDays')+1))) await ensureFollowTask(row);
      if(op==='update'&&patch&&['Rejected','Withdrawn'].includes(patch.stage)&&row.status!=='Closed'&&!('status' in patch)) await db.update('apps',row.id,{status:'Closed'});
      if(op==='update'&&patch&&patch.stage&&STAGE_ORDER.indexOf(patch.stage)>0&&!['Rejected','Withdrawn','Offer'].includes(patch.stage)) for(const t of autoTasks('app_follow',row.id).filter(isOpenTask)) await db.update('tasks',t.id,{status:'Complete',progress:100,notes:((t.notes||'')+` · they responded — ${patch.stage}`).replace(/^ · /,'')});
      if(op==='update'&&patch){ const closed=patch.status==='Closed'||['Rejected','Offer','Withdrawn'].includes(patch.stage);
        if(closed) for(const t of autoTasks('app_follow',row.id).filter(isOpenTask)) await db.update('tasks',t.id,{status:'Complete',progress:100,notes:((t.notes||'')+` · closed automatically (${patch.stage&&patch.stage!==row.stage?patch.stage:patch.status||row.stage})`).replace(/^ · /,'')});
        if('applied' in patch&&patch.applied) for(const t of autoTasks('app_follow',row.id).filter(isOpenTask)) await db.update('tasks',t.id,{due:maxD(addDays(String(patch.applied).slice(0,10),cfgN('followDays')),T()),start:String(patch.applied).slice(0,10)});
        if(('company' in patch||'position' in patch)) for(const t of autoTasks('app_follow',row.id).filter(isOpenTask)) await db.update('tasks',t.id,{task:followTitle(row)}); }
      if(op==='remove') for(const t of autoTasks('app_follow',row.id).filter(isOpenTask)) await db.remove('tasks',t.id);
    }
    if(coll==='interviews'){
      if(op==='insert'&&CFG.autoThanks!==false&&row.date&&!['Cancelled','Withdrew'].includes(row.outcome)&&String(row.date).slice(0,10)>=addDays(T(),-1)) await ensureThanksTask(row);
      if(op==='insert'&&row.app_id) for(const t of autoTasks('app_follow',row.app_id).filter(isOpenTask)) await db.update('tasks',t.id,{status:'Complete',progress:100,notes:((t.notes||'')+' · they responded — interview scheduled').replace(/^ · /,'')});
      if(op==='update'&&patch){ const open=autoTasks('int_thanks',row.id).filter(isOpenTask);
        const dead=['Cancelled','Withdrew'].includes(patch.outcome||row.outcome);
        if('date' in patch&&!dead){ if(patch.date){ if(open.length) for(const t of open) await db.update('tasks',t.id,{due:addDays(String(patch.date).slice(0,10),1),start:String(patch.date).slice(0,10)}); else if(CFG.autoThanks!==false&&!autoTasks('int_thanks',row.id).length&&String(patch.date).slice(0,10)>=addDays(T(),-1)) await ensureThanksTask(row); } }
        if('company' in patch||'stage' in patch) for(const t of open) await db.update('tasks',t.id,{task:thanksTitle(row)});
        if(['Withdrew','Cancelled'].includes(patch.outcome)) for(const t of [...open,...autoTasks('int_sched',row.id).filter(isOpenTask)]) await db.update('tasks',t.id,{status:'Complete',progress:100,notes:patch.outcome==='Withdrew'?'Interview withdrawn':'Interview cancelled'}); }
      if(op==='remove') for(const t of autoTasks('int_thanks',row.id).filter(isOpenTask)) await db.remove('tasks',t.id);
      if(typeof gcOnInterviewChange==='function') gcOnInterviewChange(op,row,patch);
    }
  }catch(e){ console.warn('auto task',e); }
}

const PAY_TYPES=['Salary','Hourly W-2','Hourly 1099','Hourly C2C'];

function offerCalc(o){
  const hourly=o.pay_type!=='Salary', hrs=+o.hours_week||40, wks=+o.weeks_year||52, base=+o.base||0;
  const cash=hourly?base*hrs*wks:base;
  const selfEmp=['Hourly 1099','Hourly C2C'].includes(o.pay_type)?cash*0.0765:0;   // the employer half of Social Security + Medicare you pay yourself
  const match=cash*(+o.match_pct||0)/100, bonus=+o.bonus||0, equity=+o.equity||0, ben=+o.benefits_value||0, sign=+o.sign_on||0;
  const workWeeks=Math.max(0,wks-(+o.pto_days||0)/5);
  const commute=(+o.onsite_days||0)*(+o.commute_miles||0)*workWeeks*cfgN('mileRate');
  const recurring=cash+bonus+equity+ben+match-selfEmp-commute, firstYear=recurring+sign;
  const hours=hrs*workWeeks, effHourly=hours?recurring/hours:0;
  const takeHome=Math.max(0,(cash+bonus)*(1-cfgN('takeHomeTaxPct')/100)-selfEmp)/12;
  return {cash,selfEmp,match,bonus,equity,ben,sign,commute,recurring,firstYear,effHourly,takeHome,hourlyEq:hrs*wks?cash/(hrs*wks):0};
}

  ];

/* ---- 4. Gantt ---- */
R.gantt = el => {
  const {rows:fr}=applySlicers('tasks',TASK_DEFS(),S.tasks);
  el.innerHTML=slicerHTML('tasks',TASK_DEFS(),S.tasks)+`<div class="card"><h3>Timeline <span class="hint">bars span start → due; dashed line is today; bar fill shows progress</span></h3><div id="gantt" class="chart tall"></div>
  <div class="legend"><span><i style="background:var(--good)"></i>Complete</span><span><i style="background:var(--warn)"></i>In Progress</span><span><i style="background:var(--crit)"></i>Overdue</span><span><i style="background:var(--idle)"></i>Not Started</span></div></div>`;
  const hidden=fr.filter(r=>!r.due).length;
  const rows=fr.filter(r=>r.due).map(r=>({...r,start:r.start&&String(r.start).slice(0,10)<=String(r.due).slice(0,10)?r.start:r.due})).sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  if(hidden) el.querySelector('.card h3 .hint').insertAdjacentText('beforeend',` · ${hidden} task${hidden===1?'':'s'} without a due date not shown`);
  if(!rows.length){ el.querySelector('#gantt').innerHTML='<div class="empty">Add tasks with start and due dates to see the timeline.</div>'; return; }
  const col={good:cssVar('--good'),warn:cssVar('--warn'),crit:cssVar('--crit'),idle:cssVar('--idle')};
  const y=rows.map(r=>`${r.ref} · ${r.task}`);
  const dur=r=>Math.max(1,diffDays(r.due,r.start)+1)*DAY;
  const base=rows.map(r=>r.start);
  const full={type:'bar',orientation:'h',y,x:rows.map(dur),base,marker:{color:rows.map(r=>col[ganttColor(r)]),opacity:.35},hovertemplate:rows.map(r=>`<b>${esc(r.task)}</b><br>${fmtD(r.start)} → ${fmtD(r.due)}<br>${r.status} · ${r.progress||0}%<extra></extra>`),width:.55};
  const prog={type:'bar',orientation:'h',y,x:rows.map(r=>dur(r)*(r.status==='Complete'?1:(+r.progress||0)/100)),base,marker:{color:rows.map(r=>col[ganttColor(r)])},hoverinfo:'skip',width:.55};
  const t=T();
  csPlot(el.querySelector('#gantt'),[full,prog],{...plotBase(),barmode:'overlay',height:Math.max(300,60+rows.length*44),margin:{l:280,r:20,t:10,b:40},
    xaxis:{type:'date',gridcolor:cssVar('--line-2'),range:[(()=>{ const m=rows.map(r=>String(r.start).slice(0,10)).sort()[0]; return m&&m<addDays(t,-14)?maxD(addDays(m,-2),addDays(t,-90)):addDays(t,-14); })(),(()=>{ const m=rows.map(r=>String(r.due).slice(0,10)).sort().pop(); return m&&m>addDays(t,21)?(m<addDays(t,120)?addDays(m,3):addDays(t,120)):addDays(t,21); })()],tickformat:'%b %d'},yaxis:{autorange:'reversed',automargin:true},
    shapes:[{type:'line',x0:t,x1:t,y0:0,y1:1,yref:'paper',line:{color:cssVar('--crit'),width:1.5,dash:'dash'}}],
    annotations:[{x:t,y:1.02,yref:'paper',text:'Today',showarrow:false,font:{color:cssVar('--crit'),size:11}}]},PCFG);
};

/* ---- match an event to an existing application ---- */
const gmTok=s=>new Set(String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>1&&!['the','and','of','for','a','an','in','to','sr','senior','jr','i','ii','iii','remote','onsite','hybrid','position','role','with'].includes(w)));
const gmSim=(a,b)=>{ const A=gmTok(a),B=gmTok(b); if(!A.size||!B.size) return 0; let n=0; A.forEach(w=>{ if(B.has(w)) n++; }); return n/Math.min(A.size,B.size); };
function gmCoHit(app,ev){ const ac=normCo(app.company); if(!ac) return false; return [ev.company,ev.agency,ev.client].filter(Boolean).map(normCo).some(k=>k.length>=3&&(ac.includes(k)||k.includes(ac))); }
const gmDigits=s=>String(s||'').replace(/\D/g,'');
function gmMatch(ev){
  const led=(S.emailSync||[]).find(x=>x.thread_id===ev.threadId&&x.application_id); if(led){ const a=S.apps.find(x=>x.id===led.application_id); if(a) return a; }
  const byEv=S.apps.find(a=>(a.evidence||[]).some(e=>e.thread_id===ev.threadId)); if(byEv) return byEv;
  const live=S.apps.filter(a=>!/^Duplicate/i.test(a.email_status||''));
  if(ev.req){ const d=gmDigits(ev.req); const r=live.find(a=>d.length>=3&&(gmDigits(a.req_id)===d||gmDigits(a.position).includes(d))&&(gmCoHit(a,ev)||!ev.company)); if(r) return r; }
  const cands=live.filter(a=>gmCoHit(a,ev)).map(a=>({a,s:gmSim(a.position,ev.title)})).sort((x,y)=>y.s-x.s);
  if(cands.length&&(cands[0].s>=0.5||(!ev.title&&cands.length===1))) return cands[0].a;
  return null;
}

/* ---- turn events into proposals ---- */
function gmPropose(events){
  const out=[]; const upd=new Map(), news=[];
  for(const ev of events){
    if(ev.type==='skip'){ out.push({kind:'skip',ev}); continue; }
    if(ev.type==='iv_only') continue;
    const app=gmMatch(ev); const evd={thread_id:ev.threadId,date:ev.date,subject:String(ev.subject||'').slice(0,140),from:ev.contactEmail||'',kind:ev.type,...(ev.src==='outlook'?{src:'outlook',url:ev.webLink||''}:{})};
    if(app){ const p={}; const fill=(k,v)=>{ if(v&&!String(app[k]||'').trim()) p[k]=v; };
      fill('location',ev.location); fill('req_id',ev.req); fill('job_url',ev.url); fill('contact_email',ev.contactEmail); fill('apply_method',ev.method);
      if(ev.contactEmail&&!GM_NOREPLY.test(ev.contactEmail)){ const r=String(app.recruiter||'').trim(), nv=[ev.contact,'('+ev.contactEmail+')'].filter(Boolean).join(' '); if((!r||/^(n\/a|self|job board|company job site)$/i.test(r))&&nv!==r) p.recruiter=nv; }
      if(ev.status&&(ES_RANK[ev.status]||0)>(ES_RANK[app.email_status]||0)) p.email_status=ev.status;
      const ns=ev.iv&&ev.status==='Interview'?null:ES_STAGE[ev.status]; if(ns==='Rejected'&&app.stage!=='Rejected'){ p.stage='Rejected'; p.status='Closed'; } else if(ns&&STAGE_ORDER.indexOf(ns)>STAGE_ORDER.indexOf(app.stage)) p.stage=ns;
      // a job that already has an offer is never closed by an email; an offer or rejection is only proposed, never pre-ticked
      let warn='';
      if(p.stage==='Rejected'&&app.stage==='Offer'){ delete p.stage; delete p.status; warn='rejection email on an application at Offer — check it'; }
      const has=(app.evidence||[]).some(e=>e.thread_id===ev.threadId);
      if(!Object.keys(p).length&&has) { out.push({kind:'current',ev,app}); continue; }
      const prev=upd.get(app.id);
      if(prev){ const P=prev.patch; Object.entries(p).forEach(([k,v])=>{ if(k==='email_status'){ if((ES_RANK[v]||0)>(ES_RANK[P[k]||app.email_status]||0)) P[k]=v; } else if(k==='stage'){ if(v==='Rejected'||STAGE_ORDER.indexOf(v)>STAGE_ORDER.indexOf(P.stage||app.stage)) P.stage=v; } else if(P[k]==null) P[k]=v; });
        P.evidence=[...P.evidence.filter(e=>e.thread_id!==ev.threadId),evd]; prev.evs.push(ev); if(warn) prev.warn=warn; if(P.stage==='Offer'||ev.status==='Offer') prev.checked=false; continue; }
      p.evidence=[...(app.evidence||[]).filter(e=>e.thread_id!==ev.threadId),evd];
      const it={kind:'update',ev,app,patch:p,checked:!(p.stage==='Offer'||warn),warn:warn||(p.stage==='Offer'?'offer — check before applying':''),evs:[ev]}; upd.set(app.id,it); out.push(it);
    } else if(ev.type==='receipt'||ev.type==='submission'){
      const rec={company:ev.company||'',position:ev.title||'',salary:ev.rate?('Rate: '+ev.rate):'',location:ev.location||'',source:ev.method==='LinkedIn Easy Apply'?'LinkedIn':ev.method==='Company website/ATS'?'Company Website':'Recruiter',applied:ev.date,stage:ES_STAGE[ev.status]&&ES_STAGE[ev.status]!=='Rejected'?ES_STAGE[ev.status]:(ev.status==='Rejected'?'Rejected':'Applied'),
        recruiter:[ev.contact,ev.contactEmail&&!GM_NOREPLY.test(ev.contactEmail)?'('+ev.contactEmail+')':''].filter(Boolean).join(' ')||'',next:'',status:ev.status==='Rejected'?'Closed':'Active',
        notes:`Added by ${ev.src==='outlook'?'Outlook':'Gmail'} sync`+(ev.confidence!=='high'?' — Needs Review: '+[!ev.company&&'company',!ev.title&&'job title'].filter(Boolean).join(', ')+' not found in the email':''),req_id:ev.req||null,job_url:ev.url||null,contact_email:ev.contactEmail||null,apply_method:ev.method||null,email_status:ev.status,evidence:[evd],email_synced_at:new Date().toISOString()};
      const same=news.find(x=>normCo(x.rec.company)&&normCo(x.rec.company)===normCo(rec.company)&&((ev.req&&x.rec.req_id===ev.req)||(!rec.position||!x.rec.position)||normTitle(x.rec.position)===normTitle(rec.position)||gmSim(normTitle(x.rec.position),normTitle(rec.position))>=0.85));
      if(same){ same.rec.evidence.push(evd); same.evs.push(ev); ['position','location','req_id','job_url','contact_email','apply_method'].forEach(k=>{ if(!same.rec[k]&&rec[k]) same.rec[k]=rec[k]; }); if(rec.applied&&(!same.rec.applied||rec.applied<same.rec.applied)) same.rec.applied=rec.applied; continue; }
      const it={kind:'new',ev,rec,checked:ev.confidence!=='low',evs:[ev]}; news.push(it); out.push(it);
    } else if(!ev.iv) out.push({kind:'review',ev,checked:false});
  }
  return out;
}

  const since=gmQueryDate(gmSince()); const ids=new Set();
  for(let i=0;i<GM_QUERIES.length;i++){ progress&&progress(`Searching your mail (${i+1}/${GM_QUERIES.length})…`); let page=null, n=0;
    do{ const r=await gmApi('threads',{q:`after:${since} ${GM_QUERIES[i]} ${GM_EXCL}`,maxResults:'100',...(page?{pageToken:page}:{})}); (r.threads||[]).forEach(t=>ids.add(t.id)); page=r.nextPageToken; n++; }while(page&&n<4); }

    ${ev.length?`<ul class="gm-evl">${ev.map(e=>`<li><a href="${esc(mailLink(e))}" target="_blank" rel="noopener">${esc(e.subject||'Open the email conversation')}</a><span>${e.date?fmtDY(e.date):''}${e.from?' · '+esc(e.from):''}</span></li>`).join('')}</ul>`:'<div class="empty">No linked emails yet. Use Sync from Gmail.</div>'}
    ${a.job_url?`<div class="note">Job posting: <a href="${esc(a.job_url)}" target="_blank" rel="noopener">${esc(a.job_url)}</a></div>`:''}
    <div style="margin-top:12px;display:flex;justify-content:flex-end"><button class="btn" id="gmCancel">Close</button></div></div>`);

function gmBarHTML(){ if(!isOwner()) return ''; const c=gmCfg(), o=olCfg();
  const ago=x=>x?Math.floor((Date.now()-Date.parse(x))/86400000):null, late=x=>x!=null&&x>=2;
  const st=(cfg,name)=>cfg.clientId?(cfg.lastRun?`${name} ${fmtD(String(cfg.lastRun).slice(0,10))} ${new Date(cfg.lastRun).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})} — ${esc(cfg.lastSummary||'')}${late(ago(cfg.lastRun))?` <span class="pill warn">${ago(cfg.lastRun)} days ago</span>`:''}`:`${name} not synced yet`):'';
  const pb=k=>{ const x=MAIL_PENDING[k]; if(!x) return ''; const n=mailPendingN(x.res); return n?`<div class="banner info xl-banner"><b>The automatic ${k==='outlook'?'Outlook':'Gmail'} check found ${n} item${n===1?'':'s'} for you to review</b> (${fmtD(String(x.at).slice(0,10))} ${new Date(x.at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}) — nothing changes until you approve. <button class="btn primary ra" data-mailpend="${k}">Review</button></div>`:''; };
  return `${pb('gmail')}${pb('outlook')}<div class="card gm-bar"><div><b>📧 Email sync</b> <span class="hint">${[st(c,'Gmail'),st(o,'Outlook')].filter(Boolean).join(' · ')||'not connected'} · jobs from ${fmtDY(gmSince())}${financeEditable()?` · bills &amp; money from ${fmtDY(finSince())}`:''}${cfgN('mailAutoHours')>0&&(c.clientId||o.clientId)?` · checks every ${cfgN('mailAutoHours')} h while open after you sign in`:''}</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="gmSync">${c.clientId?'Sync from Gmail':'Connect Gmail'}</button>${c.clientId?'<button class="btn" id="gmSet" title="Gmail connection settings">⚙</button>':''}<button class="btn ${o.clientId?'primary':''}" id="olSync">${o.clientId?'Sync from Outlook':'Connect Outlook'}</button>${o.clientId?'<button class="btn" id="olSet" title="Outlook connection settings">⚙</button>':''}</div></div>`; }
function bindGmBar(el){ const b=el.querySelector('#gmSync'); if(b) b.addEventListener('click',gmSyncStart); const s=el.querySelector('#gmSet'); if(s) s.addEventListener('click',()=>gmSetupModal(false));

/* ---- 6. Analytics ---- */
R.analytics = el => {
  const defs=[{k:'month',label:'Month',get:r=>monthKey(r.applied)},{k:'quarter',label:'Quarter',get:r=>quarterKey(r.applied)},{k:'status',label:'Application Status',opts:L.appStatus},{k:'source',label:'Job Source',opts:L.source},{k:'stage',label:'Stage',opts:L.stage},{k:'apply_method',label:'Method'},{k:'email_status',label:'Email status'},{k:'company',label:'Company'}];
  const {rows}=applySlicers('analytics',defs,S.apps);
  const pivot=(key,order)=>{ const m={}; rows.forEach(r=>{const k=key(r)||'(blank)'; m[k]=(m[k]||0)+1;}); const keys=order?order.filter(k=>m[k]!=null):Object.keys(m).sort(); return keys.map(k=>[k,m[k]]); };
  const pv=(title,data,fmtK)=>`<div class="card span6"><h3>${title}</h3><div class="tblwrap"><table class="tbl pivot"><thead><tr><th>${title.replace('Applications by ','')}</th><th style="text-align:right">Count</th><th style="text-align:right">Share</th></tr></thead><tbody>${data.map(([k,v])=>`<tr><td>${esc(fmtK?fmtK(k):k)}</td><td class="num">${v}</td><td class="num">${rows.length?Math.round(v/rows.length*100):0}%</td></tr>`).join('')||'<tr><td colspan="3" class="empty">No data</td></tr>'}</tbody><tfoot><tr><td>Total</td><td class="num">${rows.length}</td><td class="num">100%</td></tr></tfoot></table></div><div class="chart" id="pc-${title.replace(/\W/g,'')}" style="min-height:200px"></div></div>`;
  const bySource=pivot(r=>r.source,L.source), byStage=pivot(r=>r.stage,L.stage), byCo=pivot(r=>r.company), byMonth=pivot(r=>monthKey(r.applied));
  el.innerHTML=slicerHTML('analytics',defs,S.apps)+`<div class="grid g12">${ivPipelineHTML()}${goalsCardHTML('span4')}<div class="card span8"><h3>Weekly goals vs. actuals <span class="hint">last 8 weeks · dotted lines are your targets</span></h3><div id="goalChart" class="chart" style="min-height:260px"></div></div>
    <div class="card span12" style="padding-bottom:4px"><h3>What's working <span class="hint">response = any reply or progress past Applied · interview = an interview or an interview stage · all applications, not the filters above</span></h3></div>
    ${effTable('job source',a=>a.source)}${effTable('apply method',a=>a.apply_method)}${effTable('résumé version',a=>a.resume_version)}
    ${pv('Applications by Source',bySource)}${pv('Applications by Stage',byStage)}${pv('Applications by Company',byCo)}${pv('Applications by Month',byMonth,k=>k==='(blank)'?k:monthLabel(k))}</div>`;
  const acc=cssVar('--accent');
  const bar=(id,data,horizontal,fmtK)=>csPlot(el.querySelector('#pc-'+id),[{type:'bar',orientation:horizontal?'h':'v',[horizontal?'y':'x']:data.map(d=>fmtK?fmtK(d[0]):d[0]),[horizontal?'x':'y']:data.map(d=>d[1]),marker:{color:acc},hovertemplate:'%{'+(horizontal?'y':'x')+'}: %{'+(horizontal?'x':'y')+'}<extra></extra>'}],{...plotBase(),height:200,margin:{l:horizontal?120:40,r:10,t:6,b:34},[horizontal?'xaxis':'yaxis']:{...plotBase().yaxis,dtick:1}},PCFG);
  goalsChart(el.querySelector('#goalChart')); ivPipelineChart(el.querySelector('#ivWeeks'));
  bar('ApplicationsbySource',bySource,true); bar('ApplicationsbyStage',byStage,true); bar('ApplicationsbyCompany',byCo,true); bar('ApplicationsbyMonth',byMonth,false,k=>k==='(blank)'?k:monthLabel(k));
};

/* ---- 7. Interviews ---- */
R.interviews = el => {
  const t=T(), wk=addDays(t,7);
  const defs=[{k:'stage',label:'Interview Stage',opts:L.intStage},{k:'outcome',label:'Outcome',opts:L.outcome},{k:'type',label:'Type',opts:L.intType},{k:'when',label:'When',opts:['Upcoming','Today','Past','No date'],get:r=>!r.date?'No date':r.date>T()?'Upcoming':r.date===T()?'Today':'Past'},{k:'company',label:'Company'}];
  const {rows,filtered}=applySlicers('interviews',defs,S.interviews);
  if(SEL_INT&&!S.interviews.some(i=>i.id===SEL_INT)) SEL_INT=null;
  const up=S.interviews.filter(i=>i.date&&i.date>=t&&(i.outcome||'Pending')==='Pending');
  const m={up:up.length,week:up.filter(i=>i.date<=wk).length,avg:up.length?Math.round(sum(up.map(readiness))/up.length):0,weak:up.filter(i=>readiness(i)<CFG.readyGreen).length,unl:S.interviews.filter(i=>!intApp(i)).length};
  const cols=[{k:'ref',label:'ID',type:'ro',cls:'id'},{k:'company',label:'Company',type:'text',w:170},{k:'position',label:'Position',type:'text',w:190},{k:'date',label:'Interview Date',type:'date'},{k:'time',label:'Time',type:'text',w:80},{k:'stage',label:'Stage',type:'select',opts:L.intStage},{k:'type',label:'Interview Type',type:'select',opts:L.intType},{k:'interviewer',label:'Interviewer',type:'text',w:180},{k:'outcome',label:'Outcome',type:'select',opts:L.outcome},{k:'notes',label:'Notes',type:'text',w:200},
    {k:'_app',label:'Application',type:'ro',fmt:r=>{const a=intApp(r);return a?`<a href="#" data-go="apps:apps:${a.id}" title="${esc(a.company+' — '+(a.position||''))}${r.app_id?'':' (matched by company)'}">${esc(a.ref)}</a>`:'<span style="opacity:.45" title="Edit the interview to link it to an application">not linked</span>'}},
    {k:'_',label:'Readiness',type:'ro',fmt:r=>{const s=readiness(r);return `<span class="pill ${readyCls(s)}">${s}%</span>`}},{k:'__',label:'When',type:'ro',cls:'num',fmt:r=>{if(!r.date) return '—';const d=diffDays(r.date,T());return d===0?'Today':d>0?`in ${d}d`:`${-d}d ago`}},
    {k:'location',label:'Location',type:'text',w:170},
    {k:'_ev',label:'Email',type:'ro',fmt:r=>(r.evidence||[]).length?`<button type="button" class="btn ra" data-ivevid="${r.id}" title="Open the emails this interview was read from">✉ ${(r.evidence||[]).length}</button>`:`<span style="opacity:.4" title="${esc(r.source==='calendar'||r.gcal_source_id?'from your calendar':'entered by hand')}">${r.source==='calendar'||r.gcal_source_id?'📅':'—'}</span>`},
    {k:'_lk',label:'Join',type:'ro',fmt:r=>/^https?:\/\//i.test(r.link||'')?`<a class="btn ra" href="${esc(r.link)}" target="_blank" rel="noopener">Join ↗</a>`:(r.link?esc(r.link):'—')}];
  const cls=r=>r.outcome==='Offer'||r.outcome==='Advanced'?'st-good':r.outcome==='Rejected'?'st-idle':r.date<T()?'st-warn':'st-info';
  const card=(l,v,c)=>`<div class="kpi ${c}"><div class="l">${l}</div><div class="v">${v}</div></div>`;
  el.innerHTML=`<div class="kpis" style="margin-bottom:16px">${card('Upcoming interviews',m.up,'info')}${card('In the next 7 days',m.week,m.week?'warn':'good')}${card('Avg readiness (upcoming)',m.up?m.avg+'%':'—',m.up?readyCls(m.avg):'info')}${card('Upcoming, not yet ready',m.weak,m.weak?'crit':'good')}</div>`+
    (m.unl?`<div class="banner info" style="margin-bottom:12px">${m.unl} interview${m.unl===1?' is':'s are'} not linked to an application — open it with <b>Edit</b> and pick the application so stage changes flow to the Job Applications CRM.</div>`:'')+
    calBarHTML()+slicerHTML('interviews',defs,S.interviews)+`<div class="card">${tableHTML('interviews',rows,cols,{rowCls:cls,addLabel:'Add interview',filter:filtered,rec:'interviews',addModal:true,selId:SEL_INT,rowActs:r=>`<button type="button" class="btn ra" data-qa="prep:interviews:${r.id}" title="Open this interview on the Readiness Scorecard">Prep</button>${calActs(r)}`})}<div class="note">Click a row to select it — the Interview Readiness Scorecard opens on the selected interview. Changing Stage or Outcome moves the linked application forward (Offer, or Rejected → closed).</div></div>`;
  bindTable(el,'interviews',()=>REC.interviews.blank(),(row,k,v)=>{ if(['stage','outcome','date','time'].includes(k)) setTimeout(()=>guarded(()=>syncAppFromInterview(row),null),0); return null; });
  bindCalBar(el); el.querySelectorAll('[data-ivevid]').forEach(b=>b.addEventListener('click',()=>gmEvidenceModal(S.interviews.find(x=>x.id===b.dataset.ivevid))));
  const tb=el.querySelector('[data-tbl=interviews]'); if(tb) tb.addEventListener('click',e=>{ if(e.target.closest('input,select,button,a,textarea')) return; const tr=e.target.closest('tr[data-rid]'); if(tr&&SEL_INT!==tr.dataset.rid){ SEL_INT=tr.dataset.rid; render(true); } });
};

/* ---- 8. Readiness ---- */
const RD={show:'upcoming'};
const RD_TIPS={research:'Research the company, the role, recent news and your interviewers on LinkedIn.',star:'Write 3–5 STAR stories mapped to the job description’s top requirements.',technical:'Review the tools, systems and domain topics the posting lists; prepare one concrete example for each.',leadership:'Prepare examples of leading through change, conflict and a hard decision — with results.',questions:'Prepare 3–5 thoughtful questions for each interviewer.'};
R.ready = el => {
  const cats=[['research','Research'],['star','STAR Stories'],['technical','Technical Preparation'],['leadership','Leadership Examples'],['questions','Questions Prepared']];
  const t=T(), all=S.interviews.slice();
  const up=all.filter(i=>i.date&&i.date>=t&&(i.outcome||'Pending')==='Pending').sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const rest=all.filter(i=>!up.includes(i)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  if(SEL_INT&&!all.some(i=>i.id===SEL_INT)) SEL_INT=null;
  const sel=all.find(i=>i.id===SEL_INT)||up[0]||rest[0];
  const list=(RD.show==='upcoming'?up:RD.show==='past'?rest:[...up,...rest]).filter(i=>i!==sel);
  const sliders=i=>cats.map(([k,l])=>`<div class="score-row"><label for="${i.id}-${k}">${l} <span style="color:var(--ink-3)">20%</span></label><input id="${i.id}-${k}" type="range" min="0" max="100" step="5" value="${i[k]}" data-id="${i.id}" data-k="${k}" ${canEdit()?'':'disabled'}><span class="sv">${i[k]}</span></div>`).join('');
  const when=i=>{ if(!i.date) return 'no date'; const d=diffDays(i.date,t); return `${fmtD(i.date)}${i.time?' '+esc(i.time):''} · ${d===0?'today':d>0?'in '+d+'d':-d+'d ago'}`; };
  const big=i=>{ const s=readiness(i), c=readyCls(s), a=intApp(i), weak=cats.filter(([k])=>i[k]<CFG.readyGreen).sort((x,y)=>i[x[0]]-i[y[0]]);
    return `<div class="card span12 rd-sel"><h3>${esc(i.company)}${i.position?' — '+esc(i.position):''} <span class="hint">${esc(i.ref||'')} · ${esc(i.stage)} · ${when(i)} · ${esc(i.type||'')} · ${esc(i.outcome||'Pending')}</span><span style="flex:1"></span>${rowActsHTML('interviews',i)}</h3>
      <div class="rd-grid"><div>
        <div class="bigstat"><span class="v" style="color:var(--${c})">${s}%</span><span class="u">overall readiness</span><span class="pill ${c}" style="margin-left:auto">${c==='good'?'Ready':c==='warn'?'Needs work':'Not ready'}</span></div>
        <div class="bar" style="margin-bottom:10px"><i style="width:${s}%;background:var(--${c})"></i></div>${sliders(i)}
        <div class="note">Weighted score = Σ(category × 20%). Green ≥ ${CFG.readyGreen}%, yellow ${CFG.readyYellow}–${CFG.readyGreen-1}%, red below ${CFG.readyYellow}%.</div></div>
      <div class="rd-side"><div class="wsv-g">
        <div class="wsv-r"><span class="wsv-l">Application</span><span class="wsv-v">${a?`<a href="#" data-go="apps:apps:${a.id}">${esc(a.ref)} · ${esc(a.stage)} · ${esc(a.status)}</a>`:'not linked — use Edit to link it'}</span><span></span></div>
        <div class="wsv-r"><span class="wsv-l">Interviewer</span><span class="wsv-v">${esc(i.interviewer||'—')}</span><span></span></div>
        <div class="wsv-r"><span class="wsv-l">Join / location</span><span class="wsv-v">${[linkOut('url',i.link),esc(i.location||'')].filter(Boolean).join(' · ')||'—'}</span><span></span></div>
        ${(i.evidence||[]).length?`<div class="wsv-r"><span class="wsv-l">From email</span><span class="wsv-v">${(i.evidence||[]).slice(-3).map(e=>`<a href="${esc(mailLink(e))}" target="_blank" rel="noopener">${esc(String(e.subject||'email').slice(0,50))} ↗</a>`).join('<br>')}</span><span></span></div>`:''}
        <div class="wsv-r"><span class="wsv-l">Calendar</span><span class="wsv-v">${calActs(i)||'add a date first'}${i.gcal_event_id||i.gcal_source_id?' <span class="pill good">on Google Calendar</span>':''}</span><span></span></div></div>
        ${weak.length?`<div class="rd-tips"><b>Focus next</b><ul>${weak.slice(0,3).map(([k,l])=>`<li><b>${l} (${i[k]}%)</b> — ${RD_TIPS[k]}</li>`).join('')}</ul></div>`:'<div class="rd-tips"><b>All areas are green.</b> Do a final read of your notes and the job posting.</div>'}
        <div class="field" style="margin-top:10px"><label for="rdNotes">Prep notes <span class="hint">saved to the interview</span></label><textarea id="rdNotes" rows="5" ${canEdit()?'':'readonly'}>${esc(i.notes||'')}</textarea></div></div></div></div>`; };
  const small=i=>{ const s=readiness(i), c=readyCls(s); return `<div class="card span6"><h3><a href="#" data-rdsel="${i.id}" title="Make this the selected interview">${esc(i.company)}</a> <span class="hint">${esc(i.stage)} · ${when(i)} · ${esc(i.outcome||'')}</span><span style="flex:1"></span><span class="pill ${c}">${s}%</span></h3>
    <div class="bar" style="margin-bottom:10px"><i style="width:${s}%;background:var(--${c})"></i></div>${sliders(i)}</div>`; };
  const chip=(k,l,n)=>`<button type="button" class="${RD.show===k?'on':''}" data-rdshow="${k}">${l}${n!=null?` <small>${n}</small>`:''}</button>`;
  el.innerHTML=!all.length?`<div class="card empty">Add an interview first — from the Interview Tracker, or with <b>+ Interview</b> on any row of the Job Applications CRM.</div>`:
    `<div class="card rd-bar"><label for="rdPick">Interview</label><select id="rdPick">${up.length?`<optgroup label="Upcoming">${up.map(i=>`<option value="${i.id}" ${i===sel?'selected':''}>${esc(i.company)} — ${esc(i.stage)} · ${fmtD(i.date)}</option>`).join('')}</optgroup>`:''}${rest.length?`<optgroup label="Past / decided">${rest.map(i=>`<option value="${i.id}" ${i===sel?'selected':''}>${esc(i.company)} — ${esc(i.stage)} · ${i.date?fmtD(i.date):'no date'}</option>`).join('')}</optgroup>`:''}</select>
      <span class="opts">${chip('upcoming','Upcoming',up.length)}${chip('past','Past',rest.length)}${chip('all','All',all.length)}</span>${canEdit()?'<button class="btn" data-recnew="interviews">+ Add interview</button>':''}</div>
    <div class="grid g12">${sel?big(sel):''}${list.map(small).join('')||`<div class="card span12 empty">No other ${RD.show==='all'?'':RD.show+' '}interviews.</div>`}</div>`;
  const pk=el.querySelector('#rdPick'); if(pk) pk.addEventListener('change',()=>{ SEL_INT=pk.value; render(); });
  el.querySelectorAll('[data-rdshow]').forEach(b=>b.addEventListener('click',()=>{ RD.show=b.dataset.rdshow; render(true); }));
  el.querySelectorAll('[data-rdsel]').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); SEL_INT=a.dataset.rdsel; render(); window.scrollTo(0,0); }));

  el.querySelectorAll('input[type=range]').forEach(r=>{
    r.addEventListener('input',()=>{ r.nextElementSibling.textContent=r.value; });
    r.addEventListener('change',()=>{ guarded(()=>db.update('interviews',r.dataset.id,{[r.dataset.k]:+r.value})); render(true); });
  });
};

    {k:'_',label:'Follow-up',type:'ro',fmt:r=>{const s=followState(r.next,r.status==='Closed');return `<span class="pill ${s.cls}">${s.label}</span>`}},
    {k:'_lnk',label:'Applications',type:'ro',tfKind:'num',fmt:r=>{const a=recApps(r).length,i=recInts(r).length;return a||i?`<button type="button" class="btn ra" data-recv="recruiters:${r.id}" title="See the linked applications and interviews">${a} app${a===1?'':'s'}${i?` · ${i} int`:''}</button>`:'0'}}];
  const miss=missingRecruiters();

/* Reads only what the text says: "1 Riverside Plaza, Columbus, OH 43215" → street, city, state, ZIP.
   A city with no state stays without a state — nothing is guessed. */
function parseLocation(s){
  const raw=String(s||'').replace(/[()]/g,',').replace(/\s[—–]\s.*$/,'').replace(/\b(remote|on-?site|hybrid|in[- ]office|full[- ]time|part[- ]time|contract|\d+\s*days?\s*onsite)\b/gi,' ').replace(/\s+[-|/]\s+/g,',').replace(/\s{2,}/g,' ');
  const parts=raw.split(',').map(x=>x.trim().replace(/^[-–\s]+|[-–\s.]+$/g,'')).filter(x=>x&&!/coast|united states|^usa?$|nationwide|anywhere|^us$|midwest|^\d+%$/i.test(x));
  const o={address1:'',city:'',state:'',zip5:'',zip4:''};
  for(const p of parts){ let m;
    if((m=p.match(/^(\d{5})(?:-(\d{4}))?$/))){ o.zip5=m[1]; o.zip4=m[2]||''; continue; }
    if((m=p.match(/^([A-Za-z]{2})\s+(\d{5})(?:-(\d{4}))?$/)) && US_STATES.includes(m[1].toUpperCase())){ o.state=m[1].toUpperCase(); o.zip5=m[2]; o.zip4=m[3]||''; continue; }
    if((m=p.match(/^([A-Za-z ]+?)\s+(\d{5})(?:-(\d{4}))?$/)) && STATE_NAME[m[1].toLowerCase()]){ o.state=STATE_NAME[m[1].toLowerCase()]; o.zip5=m[2]; o.zip4=m[3]||''; continue; }
    if(/^[A-Za-z]{2}$/.test(p) && US_STATES.includes(p.toUpperCase())){ o.state=p.toUpperCase(); continue; }
    if(STATE_NAME[p.toLowerCase()]){ o.state=STATE_NAME[p.toLowerCase()]; continue; }
    if(/^\d+[A-Za-z]?\s+\S/.test(p) && !o.address1){ o.address1=p; continue; }
    if((m=p.match(/^(.+?)\s+([A-Z]{2})$/)) && US_STATES.includes(m[2])){ o.city=o.city||m[1]; o.state=m[2]; continue; }
    if(!o.city && /[a-z]/i.test(p)) o.city=p;
  }
  return o;
}

function wsExtract(kind,r,book){

    put('req_id',r.req_id,`${ref} · Req / Job ID`); put('job_url',r.job_url,`${ref} · Job posting link`);
    const ev=[...(Array.isArray(r.evidence)?r.evidence:[]).filter(e=>e&&e.thread_id).map(e=>mailLink(e)),...(String(r.notes||'').match(/https:\/\/mail\.google\.com\/[^\s|]+/g)||[])];

    const tm={Phone:'Phone',Video:'Video','On-site':'In person'}[r.type]; if(tm&&L.wsMethod.includes(tm)) put('method',tm,`${ref} · Type = ${r.type}`);

    put('contact',r.interviewer,`${ref} · Interviewer`); fromText(r.interviewer,`${ref} · Interviewer`);

    <div class="grid2"><div class="field"><label for="wsType">Activity type <span class="hint">counts toward the weekly tally</span></label>${sel('wsType',L.wsType,v.type)}</div>
      <div class="field"><label for="wsResult">Outcome details</label>${inp('wsResult','result','e.g. confirmation email received')}</div>
      <div class="field"><label for="wsReported">Reported on my weekly claim</label><input id="wsReported" type="date" value="${v.reported_on?String(v.reported_on).slice(0,10):''}"></div>
      <div class="field"><label for="wsNotes">Notes</label>${inp('wsNotes','notes','')}</div></div>

  const m=document.getElementById('modal'), $=id=>m.querySelector('#'+id); m.classList.add('wide');

  const read=()=>{ const o={}; for(const [k,id] of Object.entries(IDS)) o[k]=String($(id).value||'').trim();
    let z5=o.zip5.replace(/\D/g,''), z4=o.zip4.replace(/\D/g,''); if(z5.length>5){ z4=z4||z5.slice(5,9); z5=z5.slice(0,5); } o.zip5=z5; o.zip4=z4.slice(0,4);

  const fill=o=>{ for(const [k,id] of Object.entries(IDS)){ if(o[k]==null) continue; const e=$(id); let val=k==='date'?String(o[k]).slice(0,10):o[k]; if(e.tagName==='SELECT'&&val&&![...e.options].some(op=>op.value===val)) e.insertAdjacentHTML('beforeend',`<option>${esc(val)}</option>`); e.value=val; } showSrc(); miss(); };

  m.querySelectorAll('input,select').forEach(e=>e.addEventListener('change',miss)); miss();
  $('mClose').addEventListener('click',closeModal); $('wsCancel').addEventListener('click',closeModal);
  const ca=$('wsCopyAll'); if(ca) ca.addEventListener('click',()=>wsCopy(wsAsText(read()),'Claim fields'));

      closeModal(); render(); const left=wsMissing(o); toast(left.length?`Saved — Needs Review: ${left.join(', ')}`:'Saved — ready for your claim'); }); });

/* pull everything already tracked elsewhere in the app into the log */
const WSI={range:'all'};
function wsImportModal(){
  const all=wsCandidates(), thisWk=weekEnding(T()), lastWk=weekEnding(addDays(T(),-7));
  const list=all.filter(c=>WSI.range==='all'||(WSI.range==='this'?weekEnding(c.a.date)===thisWk:weekEnding(c.a.date)===lastWk));
  const pre=c=>c.kind==='apps'||c.kind==='interviews';
  openModal(`<div class="mhead"><b>Pull activities from CareerShift</b><button class="mclose" id="mClose" aria-label="Close">×</button></div><div class="mbody">
    <div class="note" style="margin-top:0">Applications, interviews, recruiter contacts and networking since ${fmtDY(S.settings.separationDate)} that aren't in the work-search log yet. Each field comes only from what that record (or your earlier entry for the same employer) actually says, and remembers where it came from. Anything missing stays blank and is flagged Needs Review. Applications and interviews are ticked; Ohio accepts recruiter and networking contacts only when they're a real step toward a job, so tick those yourself.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px"><select id="wsiRange" class="btn"><option value="all" ${WSI.range==='all'?'selected':''}>Everything since separation (${all.length})</option><option value="this" ${WSI.range==='this'?'selected':''}>This claim week (ending ${fmtD(thisWk)})</option><option value="last" ${WSI.range==='last'?'selected':''}>Last claim week (ending ${fmtD(lastWk)})</option></select>
      <button class="btn" id="wsiAll">Tick all</button><button class="btn" id="wsiNone">Untick all</button></div>
    ${list.length?`<div class="wsi-list">${list.map(c=>{ const miss=wsMissing(c.a); return `<label class="wsi-row"><input type="checkbox" data-i="${all.indexOf(c)}" ${pre(c)?'checked':''}>
      <span class="wsi-main"><b>${esc(c.a.employer)}</b>${c.a.end_client?' <span class="wsi-sub">for '+esc(c.a.end_client)+'</span>':''} <span class="pill ${c.kind==='apps'?'info':c.kind==='interviews'?'good':'idle'}">${WS_SRC[c.kind][0]} ${esc(c.r.ref||'')}</span><br>
      <span class="wsi-sub">${fmtDY(c.a.date)} · ${esc(c.a.method||'method ?')} · ${esc(c.a.position||'')}${c.a.city||c.a.state?' · '+esc([c.a.city,c.a.state].filter(Boolean).join(', ')):''}${c.a.req_id?' · Req '+esc(c.a.req_id):''}${c.a.contact_email?' · '+esc(c.a.contact_email):''}${c.a.evidence?' · email evidence':''}</span>
      ${miss.length?`<br><span class="wsi-miss">Needs Review after import: ${esc(miss.join(', '))}</span>`:''}</span></label>`; }).join('')}</div>`:'<div class="empty">Nothing new to pull — everything in that range is already in the log.</div>'}
    <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="wsiCancel">Cancel</button>${list.length&&canEdit()?'<button class="btn primary" id="wsiGo">Add ticked to the log</button>':''}</div></div>`);
  const m=document.getElementById('modal'); m.classList.add('wide');
  m.querySelector('#mClose').addEventListener('click',closeModal); m.querySelector('#wsiCancel').addEventListener('click',closeModal);
  m.querySelector('#wsiRange').addEventListener('change',e=>{ WSI.range=e.target.value; wsImportModal(); });
  m.querySelector('#wsiAll').addEventListener('click',()=>m.querySelectorAll('[data-i]').forEach(c=>c.checked=true)); m.querySelector('#wsiNone').addEventListener('click',()=>m.querySelectorAll('[data-i]').forEach(c=>c.checked=false));
  const go=m.querySelector('#wsiGo'); if(go) go.addEventListener('click',()=>guarded(async()=>{ const picks=[...m.querySelectorAll('[data-i]:checked')].map(c=>all[+c.dataset.i]).sort((x,y)=>String(x.a.date).localeCompare(String(y.a.date)));
    if(!picks.length) throw new Error('Tick at least one item'); let n=0; for(const c of picks){ if(wsFindDuplicate(c.a)) continue; await db.insert('activities',{ref:nextRef('activities'),...c.a}); n++; }
    logEvent('wsa_import',{n}); closeModal(); render(); toast(`${n} activit${n===1?'y':'ies'} added to the log`); }));
}
/* fill blank fields of every linked record from its source — never overwrites */
async function wsRefreshAll(){
  const todo=(S.activities||[]).map(a=>[a,wsRefreshPatch(a)]).filter(([,p])=>p);
  if(!todo.length){ toast('Nothing to fill — linked records have no extra details'); return; }
  if(!confirm(`Fill blank fields in ${todo.length} activit${todo.length===1?'y':'ies'} from their linked Applications / Interviews / Recruiter / Networking records?\n\nFields that already have a value are not changed.`)) return;
  await guarded(async()=>{ for(const [a,p] of todo) await db.update('activities',a.id,p); render(); },`Filled blanks in ${todo.length} activit${todo.length===1?'y':'ies'}`);
}

/* claim-week view: what to type into this week's certification */
const WSC={week:null};
function wsClaimHTML(){
  const acts=S.activities||[], thisWk=weekEnding(T()), lastWk=weekEnding(addDays(T(),-7));
  const weeks=[...new Set([thisWk,lastWk,...acts.map(a=>weekEnding(a.date))])].sort().reverse();
  if(!WSC.week||!weeks.includes(WSC.week)) WSC.week=acts.some(x=>weekEnding(x.date)===lastWk)||!acts.some(x=>weekEnding(x.date)===thisWk)?lastWk:thisWk;

const recActions=(id,kind)=>`<span class="rec-acts"><button class="btn" data-rv="${kind}:${id}" title="View">View</button>${canEdit()?`<button class="btn" data-re="${kind}:${id}" title="Edit">Edit</button><button class="btn rec-del" data-rd="${kind}:${id}" title="Delete">Delete</button>`:''}</span>`;
function bindRecActions(root){

function wsExportCSV(){
  const cols=[['ref','ID'],...WS_FIELDS.map(f=>[f[0],f[1]]),['_src','Linked source'],['_fs','Field sources']];
  const q=v=>{ const s=String(v??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const rows=(S.activities||[]).slice().sort((x,y)=>String(x.date).localeCompare(String(y.date)));
  const cell=(r,k)=>k==='_src'?(wsSrcRow(r)?.ref||(r.source_kind?'source deleted':'manual')):k==='_fs'?Object.entries(r.field_sources||{}).map(([f,s])=>`${f}: ${s}`).join('; '):(k==='date'||k==='reported_on')?(r[k]?String(r[k]).slice(0,10):''):r[k];
  const csv=[cols.map(c=>q(c[1])).join(','),...rows.map(r=>cols.map(([k])=>q(cell(r,k))).join(','))].join('\r\n');

function monthStats(m){ // totals for one month: income, spending (lines + debt payments − hardship relief), net
  const lines=expOf(m).filter(e=>(e.status||'Active')==='Active'), inc=expOf(m,'income').filter(e=>(e.status||'Active')==='Active');
  const cur=curMonth(), debts=debtsActive();
  const debtB = m>=cur ? sum(debts.map(debtPlanned)) : sum(debts.map(d=>debtPaidInMonth(d,m)));
  const debtA = m===cur ? sum(debts.map(d=>Math.max(debtPlanned(d),debtPaidInMonth(d,m)))) : sum((S.debts||[]).map(d=>debtPaidInMonth(d,m)));
  const relief=hardshipReliefInMonth(m);
  const spB=sum(lines.map(e=>+e.budget||0))+debtB-relief, spA=sum(lines.map(e=>+e.actual||0))+(m>cur?0:debtA)-(m>cur?0:relief);
  const incB=sum(inc.map(e=>+e.budget||0)), incA=sum(inc.map(e=>+e.actual||0));
  return {m,incB,incA,spB,spA,debtB,debtA,relief,netB:incB-spB,netA:incA-spA,rate:incA>0?(incA-spA)/incA:null,
    ess:sum(lines.filter(e=>expPri(e)==='Essential').map(e=>+e.actual||0)),disc:sum(lines.filter(e=>expPri(e)==='Discretionary').map(e=>+e.actual||0))};
}

/* ---- trends: week / month / year ---- */
function budgetSeries(gran){
  const months=budgetMonths().filter(x=>x<=curMonth());
  if(gran==='week'){
    const tx=(S.btxns||[]), pays=(S.debtpay||[]);
    const first=[...tx.map(x=>String(x.date).slice(0,10)),...pays.map(p=>String(p.date).slice(0,10))].filter(d=>d>=(months[0]||curMonth())+'-01').sort()[0]||T();
    const weeks=[]; for(let w=weekStart(first); w<=weekStart(T()); w=addDays(w,7)) weeks.push(w);
    return weeks.map(w=>{ const e=addDays(w,7), inW=d=>{const s=String(d).slice(0,10); return s>=w&&s<e;};
      const spend=sum(tx.filter(x=>x.kind!=='income'&&inW(x.date)).map(x=>+x.amount||0))+sum(pays.filter(p=>inW(p.date)).map(p=>+p.amount||0));
      const income=sum(tx.filter(x=>x.kind==='income'&&inW(x.date)).map(x=>+x.amount||0));
      return {key:w,label:'Wk of '+fmtD(w),income,spend,net:income-spend,budget:null}; });
  }
  const ms=months.map(monthStats);
  if(gran==='year'){ const ys=[...new Set(ms.map(x=>x.m.slice(0,4)))];
    return ys.map(y=>{ const r=ms.filter(x=>x.m.startsWith(y)); const income=sum(r.map(x=>x.incA)), spend=sum(r.map(x=>x.spA)); return {key:y,label:y+(y===curMonth().slice(0,4)?' (YTD)':''),income,spend,net:income-spend,budget:sum(r.map(x=>x.spB)),incBudget:sum(r.map(x=>x.incB)),months:r.length}; }); }
  return ms.map(x=>({key:x.m,label:mShort(x.m),income:x.incA,spend:x.spA,net:x.netA,budget:x.spB,incBudget:x.incB}));
}

  csPlot(el.querySelector('#btMain'),tr,{...plotBase(),barmode:'group',height:320,showlegend:true,legend:{orientation:'h',y:1.12},yaxis:{...plotBase().yaxis,tickformat:'$,.0f',automargin:true,zeroline:true,zerolinecolor:cssVar('--line')},xaxis:{...plotBase().xaxis,type:'category'}},PCFG);

// avalanche simulation across accounts: everyone gets its planned payment; `extra` goes to the highest-APR balance; freed payments roll over
const assumedPay = (d, pay) => pay>0 ? pay : (debtBal(d)>=1 ? Math.max(25, debtBal(d)*0.03) : 0); // no minimum entered yet → typical issuer floor
function avalanche(accts, extra, minOnly){
  let bal=accts.filter(d=>debtBal(d)>=1).map(d=>({apr:(+d.apr||0)/100/12,b:debtBal(d),pay:assumedPay(d, minOnly?(+d.minimum_payment||0):debtPlanned(d))})); const series=[sum(bal.map(x=>x.b))]; let interest=0, m=0;
  while(bal.some(x=>x.b>0.005) && m<600){ m++; let pool=extra; bal.sort((a,b)=>b.apr-a.apr);
    bal.forEach(x=>{ if(x.b<=0.005){ pool+=x.pay; return; } const i=x.b*x.apr; interest+=i; x.b+=i; const p=Math.min(x.b,x.pay); x.b-=p; });
    for(const x of bal){ if(pool<=0) break; if(x.b<=0.005) continue; const p=Math.min(x.b,pool); x.b-=p; pool-=p; }
    series.push(sum(bal.map(x=>Math.max(0,x.b)))); if(m>1 && series[m]>=series[m-1]-0.01) return {months:Infinity,interest:Infinity,series}; }
  return {months:m,interest,series};
}

/* ---- 14. Weekly ---- */
R.weekly = el => {
  const t=T(), wk=addDays(t,7), cc=cashCalc();
  const sec=(title,items,cls)=>`<div class="card span6"><h3>${title}<span class="hint">${items.length}</span></h3>${items.length?`<ul class="alist">${items.map(i=>`<li ${i.go?`data-go="${i.go}" class="clickable" tabindex="0" title="Open this record"`:''}><span class="pill ${i.c||cls||'info'}">${esc(i.p)}</span><span><span class="t">${esc(i.t)}</span><div class="m">${esc(i.m||'')}</div></span><span class="d">${esc(i.d||'')}</span></li>`).join('')}</ul>`:'<div class="empty">Nothing here this week.</div>'}</div>`;
  const end=addDays(t,6);
  const tasks=S.tasks.filter(r=>r.status!=='Complete'&&r.due&&r.due<=end).sort((a,b)=>a.due.localeCompare(b.due)).map(r=>({p:r.priority,c:taskState(r).cls,t:r.task,m:r.category+' · '+r.status,d:fmtD(r.due),go:'tasks:tasks:'+r.id}));
  const rec=S.recruiters.filter(r=>r.status!=='Closed'&&r.next&&r.next<=end).map(r=>({p:followState(r.next).label,c:followState(r.next).cls,t:r.name,m:(r.agency||'')+' · '+(r.company||''),d:fmtD(r.next),go:'recruiters:recruiters:'+r.id}));
  const net=S.contacts.filter(r=>r.status!=='Dormant'&&r.next&&r.next<=end).map(r=>({p:followState(r.next).label,c:followState(r.next).cls,t:r.person,m:(r.title||'')+', '+(r.company||''),d:fmtD(r.next),go:'network:contacts:'+r.id}));
  const ints=S.interviews.filter(r=>r.date>=t&&r.date<=end&&(r.outcome||'Pending')==='Pending').map(r=>({p:readiness(r)+'%',c:readyCls(readiness(r)),t:r.company+' — '+r.stage,m:r.type+' · '+(r.interviewer||''),d:fmtD(r.date),go:'ready:interviews:'+r.id}));
  const waiting=[...appsFollowDue().map(a=>({p:'Follow up',c:'warn',t:a.company+' — '+(a.position||''),m:a.ref+' · '+a.stage,d:fmtD(String(a.next_date).slice(0,10)),go:'apps:apps:'+a.id})),...quietApps().filter(x=>!appsFollowDue().includes(x.a)).map(x=>({p:'Gone quiet',c:'warn',t:x.a.company+' — '+(x.a.position||''),m:x.a.ref+' · '+x.a.stage,d:diffDays(t,x.last)+'d',go:'apps:apps:'+x.a.id})),
    ...S.apps.filter(r=>appOpen(r)&&r.stage==='Applied'&&r.applied&&diffDays(t,String(r.applied).slice(0,10))>=(cfgN('followDays')||7)&&!appsFollowDue().includes(r)).map(r=>({p:r.stage,c:'wait',t:r.company+' — '+(r.position||''),m:'Next: '+(r.next||'—'),d:diffDays(t,String(r.applied).slice(0,10))+'d ago',go:'apps:apps:'+r.id}))];
  let fin='';
  if(financeVisible()){
    const budget=expActive().filter(e=>+e.actual>+e.budget).map(e=>({p:'Over',c:e.actual>e.budget*(1+CFG.budgetCritPct/100)?'crit':'warn',t:e.category,m:`${fmtMoney(e.actual)} vs ${fmtMoney(e.budget)} budget`,d:'+'+fmtMoney(e.actual-e.budget)}));
    const cash=[{p:cc.cls==='good'?'OK':cc.cls==='warn'?'Watch':'Critical',c:cc.cls,t:`Runway ${isFinite(cc.months)?cc.months.toFixed(1)+' months':'∞'}`,m:cc.exhaust?'Cash exhausted '+fmtDY(cc.exhaust)+' at current burn':'Income covers expenses',d:fmtMoney(cc.cash)}];
    if(cc.burn>0&&cc.cash/cc.burn<6) cash.push({p:'Action',c:'crit',t:'Reduce burn or accelerate offers',m:'Under 6 months of runway',d:''});
    const pays=debtsActive().filter(d=>debtPaymentPending(d)&&String(d.due_date).slice(0,10)<=wk).map(d=>{const st=debtDueState(d);return {p:st.label,c:st.cls==='info'?'wait':st.cls,t:`${d.name} — ${fmtMoney(debtPlanned(d))}`,m:`${d.type} · min ${fmtMoney(d.minimum_payment)}${d.autopay?' · autopay':''}`,d:fmtD(d.due_date)}});
    const calls=hsActive().filter(h=>(h.next_followup&&h.next_followup<=wk)||h.status==='To call').map(h=>{const st=hsFollowState(h);return {p:st.label,c:st.cls,t:h.entity,m:`${h.type} · ${h.status}${h.program?' · '+h.program:''}`,d:h.next_followup?fmtD(h.next_followup):''}});

  el.innerHTML=`<div class="grid g12"><div class="card span12" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px"><div><b>Next 7 days:</b> ${fmtD(t)} – ${fmtD(addDays(t,6))} <span class="hint">· the work-search goals card uses the claim week, Sun ${fmtD(addDays(weekEnding(t),-6))} – Sat ${fmtD(weekEnding(t))}</span></div><div class="sample">Every section recomputes from the underlying trackers — click an item to open it.</div></div>
  ${goalsCardHTML('span6')}${sec('Tasks due this week',tasks)}${sec('Recruiter follow-ups',rec)}${sec('Networking follow-ups',net)}${sec('Interviews scheduled',ints)}${sec('Applications to follow up',waiting,'wait')}${fin}</div>`;
};

function genPassword(){ const a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789'; const v=crypto.getRandomValues(new Uint8Array(12)); let s=''; v.forEach(x=>s+=a[x%a.length]); return s.slice(0,4)+'-'+s.slice(4,8)+'-'+s.slice(8,12); }
function csvDownload(name, rows){
  if(!canExport()) return toast('You are not authorized to export');
  if(!rows.length) return toast('Nothing to export');
  const cols=Object.keys(rows[0]); const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv=[cols.join(',')].concat(rows.map(r=>cols.map(c=>q(typeof r[c]==='object'?JSON.stringify(r[c]):r[c])).join(','))).join('\n');
  const a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  logEvent('export',{file:name,rows:rows.length});
}

let RENDERING=false;

}

let ROLLED=null;
async function ensureBudgetMonth(){ // on the first load of a new month, start it from last month's lines (once; the database function is idempotent)
  if(!S||!financeEditable()) return false; const c=curMonth(); if(ROLLED===c) return false; ROLLED=c;
  if(!(S.expenses||[]).length || (S.expenses||[]).some(e=>(e.month||c)===c)) return false;
  try{ const n=await db.rollover(c); if(n){ logEvent('budget_rollover',{month:c,lines:n}); setTimeout(()=>toast(`${mLabel(c)} started — ${n} budget lines rolled over from last month`),400); return true; } }catch(e){ console.warn('rollover',e); }
  return false;
}
setInterval(()=>{ if(S&&ROLLED&&ROLLED!==curMonth()) refresh(true); }, 30*60*1000); // a tab left open across the 1st still rolls over
async function refresh(keepFocus){ try{ await db.loadAll(); if(await ensureBudgetMonth()) await db.loadAll(); render(keepFocus); }catch(e){ console.error(e); toast('Could not load: '+(e.message||e),true); } }
