<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="application-name" content="CareerShift"><meta name="version" content="1.6.1"><meta name="build" content="20260912.2141-bfb0971"><title>CareerShift</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232a78d6'/%3E%3Cpath d='M14 46h13V33h13V20h10' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M43 12l8 8-8 8' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.3/plotly.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  color-scheme:light;
  --ground:#f3f5f8; --surface:#ffffff; --surface-2:#f8fafc; --line:#dde3ea; --line-2:#eef1f5;
  --ink:#14213d; --ink-2:#4c5a6e; --ink-3:#7d8899;
  --accent:#2a78d6; --accent-deep:#1c5cab; --accent-soft:#e3eefc;
  --good:#1a8c4e; --good-soft:#dff3e7; --warn:#d99000; --warn-soft:#fff2cc; --crit:#d9403f; --crit-soft:#fde3e3;
  --soon:#e26a2c; --soon-soft:#fde8dc; --idle:#8b95a1; --idle-soft:#e9edf1; --wait:#6b5bd6; --wait-soft:#e9e6fb;
  --rail:#14213d; --rail-ink:#c9d3e3; --rail-active:#2a78d6;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 4px 14px rgba(20,33,61,.05);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#12161c; --surface:#1a2029; --surface-2:#1f2733; --line:#2b3440; --line-2:#242d39;
    --ink:#eef1f5; --ink-2:#b4bdc9; --ink-3:#7f8a99;
    --accent:#3987e5; --accent-deep:#6da7ec; --accent-soft:#1c2f4a;
    --good:#3fbf76; --good-soft:#153826; --warn:#f0b429; --warn-soft:#3d2f0a; --crit:#f06a69; --crit-soft:#3f1a1a;
    --soon:#f0834e; --soon-soft:#3f2416; --idle:#8b95a1; --idle-soft:#2a323d; --wait:#a99cf2; --wait-soft:#2a2547;
    --rail:#0d1117; --rail-ink:#aab4c3; --rail-active:#3987e5;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#12161c; --surface:#1a2029; --surface-2:#1f2733; --line:#2b3440; --line-2:#242d39;
  --ink:#eef1f5; --ink-2:#b4bdc9; --ink-3:#7f8a99;
  --accent:#3987e5; --accent-deep:#6da7ec; --accent-soft:#1c2f4a;
  --good:#3fbf76; --good-soft:#153826; --warn:#f0b429; --warn-soft:#3d2f0a; --crit:#f06a69; --crit-soft:#3f1a1a;
  --soon:#f0834e; --soon-soft:#3f2416; --idle:#8b95a1; --idle-soft:#2a323d; --wait:#a99cf2; --wait-soft:#2a2547;
  --rail:#0d1117; --rail-ink:#aab4c3; --rail-active:#3987e5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
/* rail */
.rail{background:var(--rail);color:var(--rail-ink);padding-block:18px;padding-inline:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px}
.brand .mark{width:30px;height:30px;border-radius:7px;background:var(--rail-active);display:grid;place-items:center;font-family:var(--mono);font-weight:600;color:#fff;font-size:12px}
.brand b{color:#fff;font-weight:600;font-size:14px;display:block;line-height:1.15}
.brand small{font-size:11px;opacity:.7;letter-spacing:.04em;text-transform:uppercase}
.zone{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.55;padding:12px 8px 4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;color:var(--rail-ink);cursor:pointer;font-size:13px}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.active{background:var(--rail-active);color:#fff}
.nav button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.nav .n{font-family:var(--mono);font-size:11px;opacity:.6;width:16px}
.nav .badge{margin-left:auto;font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.12);padding:1px 6px;border-radius:9px}
.nav button.active .badge{background:rgba(255,255,255,.25)}
/* main */
.main{padding-block:20px 48px;padding-inline:28px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.topbar h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
.topbar .sub{color:var(--ink-3);font-size:13px;margin-top:2px}
.asof{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.asof .chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink-2)}
.asof .chip b{font-family:var(--mono);color:var(--ink);font-weight:500}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-deep);color:#fff}
.btn.danger{color:var(--crit)}
.btn:focus-visible,.slicer button:focus-visible,.tbl input:focus-visible,.tbl select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* sections */
.grid{display:grid;gap:16px}
.g12{grid-template-columns:repeat(12,minmax(0,1fr))}
.span3{grid-column:span 3}.span4{grid-column:span 4}.span6{grid-column:span 6}.span8{grid-column:span 8}.span12{grid-column:span 12}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.card h3{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--ink-2);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.card h3 .hint{font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-3);margin-left:auto;font-size:12px}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px 16px;position:relative;box-shadow:var(--shadow);min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--idle)}
.kpi.good::before{background:var(--good)}.kpi.warn::before{background:var(--warn)}.kpi.crit::before{background:var(--crit)}.kpi.info::before{background:var(--accent)}
.kpi .l{font-size:11.5px;color:var(--ink-3);letter-spacing:.03em;text-transform:uppercase}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink-2);margin-top:2px;display:flex;align-items:center;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--idle)}
.dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--crit)}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap;background:var(--idle-soft);color:var(--ink-2)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.soon{background:var(--soon-soft);color:var(--soon)}.pill.info{background:var(--accent-soft);color:var(--accent)}.pill.wait{background:var(--wait-soft);color:var(--wait)}
/* slicers */
.slicers{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px;align-items:flex-start}
.slicer{display:flex;flex-direction:column;gap:5px}
.slicer .sl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.slicer .opts{display:flex;flex-wrap:wrap;gap:4px}
.slicer button{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.slicer button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.slicer button:hover:not(.on){border-color:var(--accent)}
/* tables */
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:8px 8px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap;font-weight:600}
.tbl td{padding:4px 6px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
.tbl tr.st-good td:first-child{box-shadow:inset 4px 0 0 var(--good)}
.tbl tr.st-warn td:first-child{box-shadow:inset 4px 0 0 var(--warn)}
.tbl tr.st-crit td:first-child{box-shadow:inset 4px 0 0 var(--crit)}
.tbl tr.st-soon td:first-child{box-shadow:inset 4px 0 0 var(--soon)}
.tbl tr.st-idle td:first-child{box-shadow:inset 4px 0 0 var(--idle)}
.tbl tr.st-wait td:first-child{box-shadow:inset 4px 0 0 var(--wait)}
.tbl input,.tbl select{width:100%;border:1px solid transparent;background:transparent;border-radius:4px;padding:4px 6px;min-width:70px}
.tbl input:hover,.tbl select:hover{border-color:var(--line)}
.tbl input:focus,.tbl select:focus{background:var(--surface-2);border-color:var(--accent)}
.tbl input[type=number]{font-family:var(--mono);text-align:right;min-width:60px}
.tbl input[type=date]{font-family:var(--mono);font-size:12.5px;min-width:130px}
.tbl .num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.tbl .id{font-family:var(--mono);color:var(--ink-3);font-size:12px}
.tbl .del{background:none;border:0;color:var(--ink-3);cursor:pointer;padding:2px 6px;border-radius:4px}
.tbl .del:hover{color:var(--crit);background:var(--crit-soft)}
.tbl tfoot td{font-weight:600;border-top:1px solid var(--line);background:var(--surface-2)}
.tblhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.tblhead .cnt{color:var(--ink-3);font-size:12.5px}
.pivot td,.pivot th{padding:6px 10px}
.pivot td.num{font-family:var(--mono);text-align:right}
/* lists */
.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.alist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line-2)}
.alist li:last-child{border-bottom:0}
.alist .t{font-weight:500}
.alist .m{font-size:12px;color:var(--ink-3)}
.alist .d{font-family:var(--mono);font-size:12px;color:var(--ink-2);text-align:right;white-space:nowrap}
.pri{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600;color:#fff;background:var(--idle)}
.pri.p1{background:var(--crit)}.pri.p2{background:var(--soon)}.pri.p3{background:var(--accent)}.pri.p4{background:var(--good)}.pri.p5{background:var(--wait)}
.empty{color:var(--ink-3);font-size:13px;padding:10px 4px}
/* gauges and charts */
.chart{width:100%;min-height:220px}
.chart.tall{min-height:300px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* inputs form */
.form{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.form label{font-size:13px;color:var(--ink-2)}
.form input{font-family:var(--mono);text-align:right;width:150px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface-2)}
.form input:focus{border-color:var(--accent);outline:none}
.form .out{font-family:var(--mono);text-align:right;font-weight:600}
.form .sep{grid-column:1/-1;border-top:1px solid var(--line);margin:4px 0}
.bigstat{display:flex;align-items:baseline;gap:8px;margin:6px 0 2px}
.bigstat .v{font-family:var(--mono);font-size:36px;font-weight:600;line-height:1}
.bigstat .u{color:var(--ink-3)}
.bar{height:8px;border-radius:4px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.score-row{display:grid;grid-template-columns:140px 1fr 56px;gap:10px;align-items:center;padding:5px 0}
.score-row input[type=range]{width:100%;accent-color:var(--accent)}
.score-row .sv{font-family:var(--mono);text-align:right}
.note{font-size:12px;color:var(--ink-3);margin-top:8px}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--ground);padding:9px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);opacity:0;transform:translateY(6px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.sample{font-size:11px;color:var(--ink-3);border:1px dashed var(--line);border-radius:6px;padding:4px 8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;padding-block:12px}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav button{width:auto}
  .zone{display:none}
  .main{padding-inline:16px}
  .span3,.span4,.span6,.span8{grid-column:span 12}
}

/* brand */
.brand .mark{background:none;width:34px;height:34px;padding:0}
.brand .mark svg{width:34px;height:34px;display:block}
.brand b{font-size:16px;letter-spacing:-.01em}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;background:var(--ground);padding:24px 16px}
.auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:28px 28px 24px}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.auth-brand svg{width:44px;height:44px}
.auth-brand b{font-size:22px;font-weight:600;letter-spacing:-.01em;display:block;line-height:1.1}
.auth-brand small{color:var(--ink-3);font-size:12.5px}
.auth h2{font-size:15px;font-weight:600;margin:18px 0 10px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;color:var(--ink-2);letter-spacing:.02em}
.field input,.field select{border:1px solid var(--line);border-radius:7px;padding:9px 11px;background:var(--surface-2);font-size:14px}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn.block{width:100%;padding:10px 12px;font-weight:600;font-size:14px}
.auth .links{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:12.5px;flex-wrap:wrap}
.auth .links button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:12.5px}
.msg{font-size:13px;border-radius:7px;padding:9px 11px;margin-top:10px}
.msg.err{background:var(--crit-soft);color:var(--crit)}.msg.ok{background:var(--good-soft);color:var(--good)}.msg.info{background:var(--accent-soft);color:var(--accent)}
.demo-note{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
/* app chrome */
.userbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.info{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.ro .tbl input,.ro .tbl select,.ro .form input,.ro input[type=range]{pointer-events:none;opacity:.85}
.ro [data-add],.ro .del,.ro #req{display:none}
.role{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--idle-soft);color:var(--ink-2)}
.role.owner{background:var(--accent-soft);color:var(--accent)}.role.editor{background:var(--good-soft);color:var(--good)}.role.viewer{background:var(--warn-soft);color:var(--warn)}
.feed li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:7px 4px;border-bottom:1px solid var(--line-2);font-size:13px}
.feed .who{font-weight:500}
.feed .when{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.inline-form .field{margin:0;min-width:180px;flex:1}
.sync{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.sync i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:5px;vertical-align:1px}
.sync.off i{background:var(--idle)}
/* version stamp */
.railfoot{margin-top:auto;padding:14px 8px 4px;font-size:11px;color:var(--rail-ink);opacity:.75;font-family:var(--mono);cursor:pointer;border-top:1px solid rgba(255,255,255,.08);line-height:1.5}
.railfoot b{color:#fff;font-weight:600}.railfoot span{opacity:.7}
.railfoot:hover{opacity:1}
.rail{display:flex;flex-direction:column}
/* access block in user form */
.acc{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:4px 0 12px;background:var(--surface-2)}
.acc-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin-bottom:6px}
.acc-row{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:start;padding:6px 0;border-top:1px solid var(--line-2)}
.acc-l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-top:4px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:13px;cursor:pointer;background:var(--surface)}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.seg input{accent-color:var(--accent)}
.acc-sum{margin-top:8px;padding:8px 10px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-size:12.5px}
.acc .chk{margin:4px 0}
/* onboarding kit */
.pwbox{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--warn-soft);border:1px solid var(--warn);border-radius:9px;padding:10px 14px;margin-bottom:12px;flex-wrap:wrap}
.pwbox span{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn)}
.pwbox code{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:.04em;user-select:all;color:var(--ink)}
.draft{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.draft-row{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line-2);font-size:13px}
.draft-row span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.draft-row input{border:0;background:transparent;font-weight:600;padding:2px 0}
.draft-row input:focus{outline:none;border-bottom:1px solid var(--accent)}

/* ===================== Derived logic ===================== */
function taskState(r){
  const t=T();
  if(r.status==='Complete') return {cls:'good',label:'Complete'};
  if(r.due && r.due<t) return {cls:'crit',label:'Overdue'};
  if(r.due && r.due===t) return {cls:'soon',label:'Due Today'};
  if(r.due && diffDays(r.due,t)<=CFG.dueSoonDays) return {cls:'soon',label:'Due Soon'};
  if(r.status==='In Progress') return {cls:'warn',label:'In Progress'};
  if(r.status==='Blocked') return {cls:'crit',label:'Blocked'};
  if(r.status==='Waiting') return {cls:'wait',label:'Waiting'};
  return {cls:'idle',label:'Not Started'};
}
function ganttColor(r){ const t=T(); if(r.status==='Complete') return 'good'; if(r.due && r.due<t) return 'crit'; if(r.status==='In Progress') return 'warn'; return 'idle'; }
function followState(next,closed){
  const t=T();
  if(closed) return {cls:'idle',label:'Closed'};
  if(!next) return {cls:'idle',label:'No date'};
  if(next<t) return {cls:'crit',label:'Overdue'};
  if(next===t) return {cls:'soon',label:'Due today'};
  if(diffDays(next,t)<=CFG.followWindowDays) return {cls:'warn',label:'This week'};
  return {cls:'good',label:'Scheduled'};
}
function readiness(i){ return Math.round((i.research+i.star+i.technical+i.leadership+i.questions)/5); }
function readyCls(s){ return s>=CFG.readyGreen?'good':s>=CFG.readyYellow?'warn':'crit'; }
function compliance(r){
  const total = (+r.apps||0)+(+r.networking||0)+(+r.recruiters||0)+(+r.training||0);
  const req = S.settings.weeklyRequirement;
  if(total>=req) return {cls:'good',label:'Compliant',total};
  if(total>=Math.max(1,req-1)) return {cls:'warn',label:'At Risk',total};
  return {cls:'crit',label:'Not Compliant',total};
}
function monthlyExpenses(){ return sum(S.expenses.map(e=>e.actual)); }
function cashCalc(){
  const c=S.cash;
  const cash = (+c.savings)+(+c.checking)+(+c.severance)+(+c.investments);
  const income = (+c.unemployment)+(+c.other);
  const burn = monthlyExpenses()-income;
  const months = burn>0 ? cash/burn : Infinity;
  const exhaust = burn>0 ? addDays(T(), Math.round(months*30.44)) : null;
  return {cash,income,burn,months,exhaust,cls: months>=CFG.runwayGreen?'good':months>=CFG.runwayYellow?'warn':'crit'};
}
function kpis(){
  const t=T(), wk=addDays(t,7);
  const open = S.tasks.filter(r=>r.status!=='Complete');
  const done = S.tasks.filter(r=>r.status==='Complete').length;
  const prog = S.tasks.length? Math.round(sum(S.tasks.map(r=>r.status==='Complete'?100:(+r.progress||0)))/S.tasks.length):0;
  const cc = cashCalc();
  return {
    total:S.tasks.length, dueToday:open.filter(r=>r.due===t).length, dueWeek:open.filter(r=>r.due>t && r.due<=wk).length, overdue:open.filter(r=>r.due && r.due<t).length,
    activeApps:S.apps.filter(r=>r.status!=='Closed').length, activeRec:S.recruiters.filter(r=>['Active','Interviewing','Offer'].includes(r.status)).length,
    contacts:S.contacts.length, intSched:S.interviews.filter(r=>r.date>=t && r.outcome==='Pending').length,
    offers:S.apps.filter(r=>r.stage==='Offer').length, completion:prog, done, runway:cc.months, runwayCls:cc.cls,
    days:S.settings.separationDate? diffDays(t,S.settings.separationDate):0,
  };
}

/* ===================== Generic editable table ===================== */
function tableHTML(id, rows, cols, opts={}){
  const {rowCls,foot,addLabel,filter} = opts;
  const head = cols.map(c=>`<th style="${c.w?`min-width:${c.w}px`:''}">${esc(c.label)}</th>`).join('');
  const body = rows.map(r=>{
    const cls = rowCls? rowCls(r):'';
    const cells = cols.map(c=>{
      const v = r[c.k];
      if(c.type==='ro') return `<td class="${c.cls||''}">${c.fmt? c.fmt(r):esc(v)}</td>`;
      if(c.type==='select') return `<td><select data-id="${r.id}" data-k="${c.k}">${c.opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></td>`;
      if(c.type==='number') return `<td><input type="number" data-id="${r.id}" data-k="${c.k}" value="${v??''}" ${c.min!=null?`min="${c.min}"`:''} ${c.max!=null?`max="${c.max}"`:''}></td>`;
      if(c.type==='date') return `<td><input type="date" data-id="${r.id}" data-k="${c.k}" value="${v?String(v).slice(0,10):''}"></td>`;
      return `<td><input type="text" data-id="${r.id}" data-k="${c.k}" value="${esc(v)}" style="${c.w?`min-width:${c.w}px`:''}"></td>`;
    }).join('');
    return `<tr class="${cls}">${cells}<td>${canEdit()?`<button class="del" data-del="${r.id}" title="Delete row">✕</button>`:''}</td></tr>`;
  }).join('');
  return `<div class="tblhead"><span class="cnt">${rows.length} row${rows.length===1?'':'s'}${filter?' (filtered)':''}</span>${canEdit()?`<button class="btn" data-add="${id}">+ ${addLabel||'Add row'}</button>`:'<span class="cnt">read-only</span>'}</div>
  <div class="tblwrap"><table class="tbl" data-tbl="${id}"><thead><tr>${head}<th></th></tr></thead><tbody>${body||`<tr><td colspan="${cols.length+1}" class="empty">No rows match the current filters.</td></tr>`}</tbody>${foot?`<tfoot>${foot}</tfoot>`:''}</table></div>`;
}
function bindTable(container, coll, onNew){
  container.querySelectorAll('[data-tbl]').forEach(tb=>{
    tb.addEventListener('change', e=>{
      const el=e.target; if(!el.dataset.id || !canEdit()) return;
      const v = el.type==='number'? (+el.value||0) : el.value;
      guarded(()=>db.update(coll, el.dataset.id, {[el.dataset.k]: v}), null); render(true);
    });
    tb.addEventListener('click', e=>{
      const b=e.target.closest('[data-del]'); if(!b||!canEdit()) return;
      guarded(async()=>{ await db.remove(coll,b.dataset.del); render(); }, 'Row deleted');
    });
  });
  container.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>guarded(async()=>{ await db.insert(coll,onNew()); render(); },'Row added')));
}

/* ===================== Slicers ===================== */
const SL = {};
function slicerHTML(view, defs, rows){
  SL[view] = SL[view]||{};
  return `<div class="slicers">${defs.map(d=>{
    const vals = d.opts || [...new Set(rows.map(d.get||(r=>r[d.k])))].filter(Boolean).sort();
    const sel = SL[view][d.k]||new Set();
    return `<div class="slicer"><span class="sl">${esc(d.label)}</span><div class="opts">${vals.map(v=>`<button data-sl="${view}" data-k="${d.k}" data-v="${esc(v)}" class="${sel.has(v)?'on':''}">${esc(v)}</button>`).join('')}${sel.size?`<button data-slclear="${view}" data-k="${d.k}" style="border-style:dashed">clear</button>`:''}</div></div>`;
  }).join('')}</div>`;
}
function applySlicers(view, defs, rows){
  const s=SL[view]||{}; let filtered=false;
  const out = rows.filter(r=>defs.every(d=>{ const sel=s[d.k]; if(!sel||!sel.size) return true; filtered=true; return sel.has((d.get||(x=>x[d.k]))(r)); }));
  return {rows:out, filtered};
}
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-sl]');
  if(b){ const s=SL[b.dataset.sl][b.dataset.k]=SL[b.dataset.sl][b.dataset.k]||new Set(); s.has(b.dataset.v)?s.delete(b.dataset.v):s.add(b.dataset.v); render(); return; }
  const c=e.target.closest('[data-slclear]');
  if(c){ SL[c.dataset.slclear][c.dataset.k]=new Set(); render(); }
});

    {n:3,label:'Recruiter follow-ups',items:S.recruiters.filter(r=>r.status!=='Closed'&&r.next&&r.next<=wk).sort((a,b)=>a.next.localeCompare(b.next)).map(r=>li('p3',3,`Follow up with ${r.name}`,`${r.agency||''} · ${r.status}${r.notes?' · '+r.notes:''}`,r.next<t?`Overdue ${-diffDays(r.next,t)}d`:r.next===t?'Today':fmtD(r.next)))},

function actionListHTML(groups){

}

/* ---- 4. Gantt ---- */
R.gantt = el => {
  el.innerHTML=`<div class="card"><h3>Timeline <span class="hint">bars span start → due; dashed line is today; bar fill shows progress</span></h3><div id="gantt" class="chart tall"></div>
  <div class="legend"><span><i style="background:var(--good)"></i>Complete</span><span><i style="background:var(--warn)"></i>In Progress</span><span><i style="background:var(--crit)"></i>Overdue</span><span><i style="background:var(--idle)"></i>Not Started</span></div></div>`;
  const rows=S.tasks.filter(r=>r.start&&r.due).slice().sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  if(!rows.length){ el.querySelector('#gantt').innerHTML='<div class="empty">Add tasks with start and due dates to see the timeline.</div>'; return; }
  const col={good:cssVar('--good'),warn:cssVar('--warn'),crit:cssVar('--crit'),idle:cssVar('--idle')};
  const y=rows.map(r=>`${r.ref} · ${r.task}`);
  const dur=r=>Math.max(1,diffDays(r.due,r.start)+1)*DAY;
  const base=rows.map(r=>r.start);
  const full={type:'bar',orientation:'h',y,x:rows.map(dur),base,marker:{color:rows.map(r=>col[ganttColor(r)]),opacity:.35},hovertemplate:rows.map(r=>`<b>${esc(r.task)}</b><br>${fmtD(r.start)} → ${fmtD(r.due)}<br>${r.status} · ${r.progress||0}%<extra></extra>`),width:.55};
  const prog={type:'bar',orientation:'h',y,x:rows.map(r=>dur(r)*(r.status==='Complete'?1:(+r.progress||0)/100)),base,marker:{color:rows.map(r=>col[ganttColor(r)])},hoverinfo:'skip',width:.55};
  const t=T();
  Plotly.newPlot(el.querySelector('#gantt'),[full,prog],{...plotBase(),barmode:'overlay',height:Math.max(300,60+rows.length*44),margin:{l:280,r:20,t:10,b:40},
    xaxis:{type:'date',gridcolor:cssVar('--line-2'),range:[addDays(t,-14),addDays(t,21)],tickformat:'%b %d'},yaxis:{autorange:'reversed',automargin:true},
    shapes:[{type:'line',x0:t,x1:t,y0:0,y1:1,yref:'paper',line:{color:cssVar('--crit'),width:1.5,dash:'dash'}}],
    annotations:[{x:t,y:1.02,yref:'paper',text:'Today',showarrow:false,font:{color:cssVar('--crit'),size:11}}]},PCFG);
};

R.analytics = el => {

  el.innerHTML=slicerHTML('analytics',defs,S.apps)+`<div class="grid g12">${pv('Applications by Source',bySource)}${pv('Applications by Stage',byStage)}${pv('Applications by Company',byCo)}${pv('Applications by Month',byMonth,k=>k==='(blank)'?k:monthLabel(k))}</div>`;

  const bar=(id,data,horizontal,fmtK)=>Plotly.newPlot(el.querySelector('#pc-'+id),[{type:'bar',orientation:horizontal?'h':'v',[horizontal?'y':'x']:data.map(d=>fmtK?fmtK(d[0]):d[0]),[horizontal?'x':'y']:data.map(d=>d[1]),marker:{color:acc},hovertemplate:'%{'+(horizontal?'y':'x')+'}: %{'+(horizontal?'x':'y')+'}<extra></extra>'}],{...plotBase(),height:200,margin:{l:horizontal?120:40,r:10,t:6,b:34},[horizontal?'xaxis':'yaxis']:{...plotBase().yaxis,dtick:1}},PCFG);
  bar('ApplicationsbySource',bySource,true); bar('ApplicationsbyStage',byStage,true); bar('ApplicationsbyCompany',byCo,true); bar('ApplicationsbyMonth',byMonth,false,k=>k==='(blank)'?k:monthLabel(k));

/* ---- 14. Weekly ---- */
R.weekly = el => {
  const t=T(), wk=addDays(t,7), cc=cashCalc();
  const sec=(title,items,cls)=>`<div class="card span6"><h3>${title}<span class="hint">${items.length}</span></h3>${items.length?`<ul class="alist">${items.map(i=>`<li><span class="pill ${i.c||cls||'info'}">${esc(i.p)}</span><span><span class="t">${esc(i.t)}</span><div class="m">${esc(i.m||'')}</div></span><span class="d">${esc(i.d||'')}</span></li>`).join('')}</ul>`:'<div class="empty">Nothing here this week.</div>'}</div>`;
  const tasks=S.tasks.filter(r=>r.status!=='Complete'&&r.due&&r.due<=wk).sort((a,b)=>a.due.localeCompare(b.due)).map(r=>({p:r.priority,c:taskState(r).cls,t:r.task,m:r.category+' · '+r.status,d:fmtD(r.due)}));
  const rec=S.recruiters.filter(r=>r.status!=='Closed'&&r.next&&r.next<=wk).map(r=>({p:followState(r.next).label,c:followState(r.next).cls,t:r.name,m:(r.agency||'')+' · '+(r.company||''),d:fmtD(r.next)}));
  const net=S.contacts.filter(r=>r.next&&r.next<=wk).map(r=>({p:followState(r.next).label,c:followState(r.next).cls,t:r.person,m:(r.title||'')+', '+(r.company||''),d:fmtD(r.next)}));
  const ints=S.interviews.filter(r=>r.date>=t&&r.date<=wk).map(r=>({p:readiness(r)+'%',c:readyCls(readiness(r)),t:r.company+' — '+r.stage,m:r.type+' · '+(r.interviewer||''),d:fmtD(r.date)}));
  const waiting=S.apps.filter(r=>r.status==='Waiting'||(r.status==='Active'&&r.applied&&diffDays(t,r.applied)>=7&&['Applied','Recruiter Screen'].includes(r.stage))).map(r=>({p:r.stage,c:'wait',t:r.company+' — '+r.position,m:'Next: '+(r.next||''),d:r.applied?diffDays(t,r.applied)+'d ago':''}));
  let fin='';
  if(financeVisible()){
    const budget=S.expenses.filter(e=>e.actual>e.budget).map(e=>({p:'Over',c:e.actual>e.budget*(1+CFG.budgetCritPct/100)?'crit':'warn',t:e.category,m:`${fmtMoney(e.actual)} vs ${fmtMoney(e.budget)} budget`,d:'+'+fmtMoney(e.actual-e.budget)}));
    const cash=[{p:cc.cls==='good'?'OK':cc.cls==='warn'?'Watch':'Critical',c:cc.cls,t:`Runway ${isFinite(cc.months)?cc.months.toFixed(1)+' months':'∞'}`,m:cc.exhaust?'Cash exhausted '+fmtDY(cc.exhaust)+' at current burn':'Income covers expenses',d:fmtMoney(cc.cash)}];
    if(cc.burn>0&&cc.cash/cc.burn<6) cash.push({p:'Action',c:'crit',t:'Reduce burn or accelerate offers',m:'Under 6 months of runway',d:''});
    fin=sec('Budget issues',budget)+sec('Cash runway alerts',cash);
  }
  el.innerHTML=`<div class="grid g12"><div class="card span12" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px"><div><b>This week:</b> ${fmtD(t)} – ${fmtD(addDays(t,6))}</div><div class="sample">Every section recomputes from the underlying trackers.</div></div>
  ${sec('Tasks due this week',tasks)}${sec('Recruiter follow-ups',rec)}${sec('Networking follow-ups',net)}${sec('Interviews scheduled',ints)}${sec('Applications waiting for response',waiting,'wait')}${fin}</div>`;
};

function genPassword(){ const a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789'; const v=crypto.getRandomValues(new Uint8Array(12)); let s=''; v.forEach(x=>s+=a[x%a.length]); return s.slice(0,4)+'-'+s.slice(4,8)+'-'+s.slice(8,12); }
function csvDownload(name, rows){
  if(!canExport()) return toast('You are not authorized to export');
  if(!rows.length) return toast('Nothing to export');
  const cols=Object.keys(rows[0]); const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv=[cols.join(',')].concat(rows.map(r=>cols.map(c=>q(typeof r[c]==='object'?JSON.stringify(r[c]):r[c])).join(','))).join('\n');
  const a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  logEvent('export',{file:name,rows:rows.length});
}

function healthChecks(){
  const t=T(), wk=addDays(t,-7);
  const events=S.events||[], users=S.adminUsers||[], inv=S.invites||[];
  const daysSince=d=>d?diffDays(t,String(d).slice(0,10)):null;
  const apps7=S.apps.filter(a=>a.applied&&a.applied>wk).length;
  const net7=S.contacts.filter(c=>c.last&&c.last>wk).length + S.recruiters.filter(r=>r.last&&r.last>wk).length;
  const responded=S.apps.filter(a=>a.stage!=='Applied').length;
  const followups=[...S.recruiters.map(r=>r.next),...S.contacts.map(c=>c.next)].filter(Boolean);
  const overdueF=followups.filter(d=>d<t).length;
  const lastExport=events.find(e=>e.event==='export'||e.event==='export_json');
  const activeDays=new Set(events.filter(e=>e.created_at>new Date(Date.now()-7*DAY).toISOString()).map(e=>String(e.created_at).slice(0,10))).size;
  const pendingFirst=users.filter(u=>u.must_change_password).length, never=users.filter(u=>!u.last_sign_in_at).length, disabled=users.filter(u=>u.banned_until&&new Date(u.banned_until)>new Date()).length;
  const staleInv=inv.filter(i=>daysSince(i.created_at)>7).length;
  const exporters=users.filter(u=>u.role!=='owner'&&u.can_export).length, wideScope=users.filter(u=>u.role==='editor'&&!u.read_only&&(!u.modules||!u.modules.length)).length;
  const chk=(group,name,cls,detail,fix)=>({group,name,cls,detail,fix});
  const out=[
    chk('Security','Row-level security','good','Every table enforces workspace membership, role, read-only flag and module scope in Postgres, not just in the UI.'),
    chk('Security','Finance visibility',CFG.financeVisibility==='owner'?'good':'warn',CFG.financeVisibility==='owner'?'Budget and Cash Runway are owner-only.':'Budget and Cash Runway are visible to all members.','Settings → Finance visibility'),
    chk('Security','Invitation email delivery',(S.mailConfig&&S.mailConfig.email_configured)?'good':'warn',(S.mailConfig&&S.mailConfig.email_configured)?'Temporary passwords are emailed automatically.':'No email provider configured — the onboarding kit shows the temporary password for you to send.','Add RESEND_API_KEY to the admin-users function secrets'),
    chk('Security','App version deployed',!LATEST?'info':cmpVer(APP_VERSION,LATEST)<0?'crit':'good',!LATEST?`Running v${APP_VERSION} (build ${APP_BUILD}); latest unknown.`:cmpVer(APP_VERSION,LATEST)<0?`Running v${APP_VERSION}; latest release is v${LATEST}.`:`Running v${APP_VERSION} (build ${APP_BUILD}) — latest.`,cmpVer(APP_VERSION,LATEST||'0')<0?'Replace index.html on your host':null),
    chk('Security','Members on old versions',(S.events||[]).some(e=>e.event==='sign_in'&&e.detail&&e.detail.version&&LATEST&&cmpVer(e.detail.version,LATEST)<0&&e.created_at>new Date(Date.now()-7*DAY).toISOString())?'warn':'good',`${new Set((S.events||[]).filter(e=>e.event==='sign_in'&&e.detail&&e.detail.version&&LATEST&&cmpVer(e.detail.version,LATEST)<0&&e.created_at>new Date(Date.now()-7*DAY).toISOString()).map(e=>e.user_email)).size} member(s) signed in on an older build this week.`,'Send them the new app link / clear cache'),
    chk('Security','App link configured',CFG.appUrl?'good':'warn',CFG.appUrl?`Onboarding messages point to ${CFG.appUrl}`:'No app link set — onboarding messages fall back to the current page address.','Settings → App link'),
    chk('Security','Accounts pending first sign-in',pendingFirst?'warn':'good',`${pendingFirst} member${pendingFirst===1?'':'s'} still on a temporary password.`,pendingFirst?'Follow up or reset their temporary password':null),
    chk('Security','Members who never signed in',never?'warn':'good',`${never} member${never===1?'':'s'} have never signed in.`),
    chk('Security','Disabled accounts',disabled?'info':'good',`${disabled} disabled account${disabled===1?'':'s'}.`),
    chk('Security','Export rights granted',exporters?'info':'good',`${exporters} non-owner member(s) may export data.`,exporters?'Review in Users → Edit':null),
    chk('Security','Editors with full write scope',wideScope>2?'warn':'info',`${wideScope} editor(s) can write to every module.`,'Use Access level to narrow scope where possible'),
    chk('Security','Stale pending invites',staleInv?'warn':'good',`${staleInv} legacy invite${staleInv===1?'':'s'} older than 7 days.`),
    chk('Security','Single owner',users.filter(u=>u.role==='owner').length<=1?'info':'warn',`${users.filter(u=>u.role==='owner').length||1} owner account(s). Keep exactly one; use editors for helpers.`),
    chk('Security','Multi-factor authentication','info','Not enforced. Enable MFA in Supabase Auth → Providers if you want a second factor for owners.'),
    chk('Backup','Last data export',lastExport?(daysSince(lastExport.created_at)>7?'warn':'good'):'crit',lastExport?`Last export ${ago(lastExport.created_at)}.`:'No export recorded yet.','Export / Import → Export workspace JSON (weekly recommended)'),
    chk('Data hygiene','Tasks without a due date',S.tasks.some(x=>!x.due)?'warn':'good',`${S.tasks.filter(x=>!x.due).length} task(s) have no due date.`),
    chk('Data hygiene','Overdue tasks > 7 days',S.tasks.some(x=>x.status!=='Complete'&&x.due&&diffDays(t,x.due)>7)?'crit':'good',`${S.tasks.filter(x=>x.status!=='Complete'&&x.due&&diffDays(t,x.due)>7).length} task(s) overdue more than a week.`),
    chk('Data hygiene','Applications without a next action',S.apps.some(a=>a.status!=='Closed'&&!a.next)?'warn':'good',`${S.apps.filter(a=>a.status!=='Closed'&&!a.next).length} open application(s) missing a next action.`),
    chk('Data hygiene','Applications silent > 14 days',S.apps.some(a=>a.status==='Active'&&a.stage==='Applied'&&a.applied&&diffDays(t,a.applied)>14)?'warn':'good',`${S.apps.filter(a=>a.status==='Active'&&a.stage==='Applied'&&a.applied&&diffDays(t,a.applied)>14).length} application(s) at "Applied" for over two weeks.`,'Follow up or mark Closed'),
    chk('Data hygiene','Contacts without a follow-up date',[...S.recruiters.filter(r=>r.status!=='Closed'&&!r.next),...S.contacts.filter(c=>c.status!=='Dormant'&&!c.next)].length?'warn':'good',`${[...S.recruiters.filter(r=>r.status!=='Closed'&&!r.next),...S.contacts.filter(c=>c.status!=='Dormant'&&!c.next)].length} active recruiter/contact record(s) with no next follow-up.`),
    chk('Data hygiene','Compliance logged this week',S.compliance.some(c=>c.week>=weekEnding(t))?'good':'crit',S.compliance.some(c=>c.week>=weekEnding(t))?'Current week is logged.':'No compliance row for the current week.','Compliance → Add week'),
    chk('Momentum','Applications this week',apps7>=CFG.weeklyAppTarget?'good':apps7>=Math.ceil(CFG.weeklyAppTarget/2)?'warn':'crit',`${apps7} of ${CFG.weeklyAppTarget} target in the last 7 days.`),
    chk('Momentum','Networking touches this week',net7>=CFG.weeklyNetworkTarget?'good':net7?'warn':'crit',`${net7} recruiter/contact touches of ${CFG.weeklyNetworkTarget} target.`),
    chk('Momentum','Response rate',S.apps.length?(responded/S.apps.length>=0.3?'good':'warn'):'info',S.apps.length?`${Math.round(responded/S.apps.length*100)}% of applications moved past "Applied" (benchmark ≥ 30%).`:'No applications yet.'),
    chk('Momentum','Interview conversion',S.apps.length?(S.interviews.length/S.apps.length>=0.2?'good':'warn'):'info',S.apps.length?`${S.interviews.length} interview(s) from ${S.apps.length} application(s) — ${Math.round(S.interviews.length/S.apps.length*100)}% (benchmark ≥ 20%).`:'No applications yet.'),
    chk('Momentum','Follow-up discipline',overdueF?'warn':'good',`${overdueF} overdue follow-up(s) of ${followups.length} scheduled.`),
    chk('Momentum','Interview readiness',S.interviews.some(i=>i.outcome==='Pending'&&i.date>=t&&readiness(i)<CFG.readyYellow)?'crit':'good',`${S.interviews.filter(i=>i.outcome==='Pending'&&i.date>=t&&readiness(i)<CFG.readyYellow).length} upcoming interview(s) below ${CFG.readyYellow}% readiness.`),
    chk('Momentum','Active days (last 7)',activeDays>=5?'good':activeDays>=3?'warn':'crit',`${activeDays} day(s) with recorded activity in the last week (target 5+).`),
  ];
  return out;
}

/* ===================== Render ===================== */
function render(keepFocus){
  if(!S) return;
  const v=VIEWS.find(x=>x.id===current) || VIEWS[1];
  if((v.finance && !financeVisible()) || !moduleOk(v.group)){ current='exec'; return render(); }
  document.getElementById('pageTitle').textContent=v.title; document.getElementById('pageSub').textContent=v.sub;
  document.getElementById('asofDate').textContent=parse(T()).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
  document.getElementById('daySince').textContent=S.settings.separationDate? diffDays(T(),S.settings.separationDate):'—';
  document.getElementById('wsName').textContent = MODE==='demo'? 'Offline demo' : (WS? WS.name : 'Workspace');
  document.getElementById('whoami').textContent = MODE==='demo'? 'demo' : (USER? USER.email : '');
  document.getElementById('avatar').textContent = (MODE==='demo'? 'D' : (USER? USER.email[0] : '?')).toUpperCase();
  const mr=document.getElementById('myRole'); mr.textContent=ROLE; mr.className='role '+ROLE;
  document.getElementById('appShell').classList.toggle('ro', !canEdit()); document.getElementById('view').classList.remove('ro');
  const bn=document.getElementById('banner');
  const outdated = LATEST && cmpVer(APP_VERSION,LATEST)<0 ? `<div class="banner" style="background:var(--crit-soft);color:var(--crit);border-color:var(--crit)">This copy is <b>v${APP_VERSION}</b> but the latest release is <b>v${LATEST}</b> — replace <code>index.html</code> on your host with the newest CareerShift.html. <button class="btn" id="btnAbout" style="padding:3px 9px;font-size:12px">Release notes</button></div>` : '';
  bn.innerHTML = outdated + (MODE==='demo'? `<div class="banner">Offline demo — data is stored only in this browser. <button class="btn" id="btnResetDemo" style="padding:3px 9px;font-size:12px">Reset sample data</button><button class="btn" id="btnExitDemo" style="padding:3px 9px;font-size:12px">Sign in to a real workspace</button></div>`
    : (!canEdit()? `<div class="banner info">You have <b>${ROLE}${ME.read_only?' (read-only)':''}</b> access — everything is read-only.</div>` : (S.tasks.length+S.apps.length===0 && isOwner()? `<div class="banner info">Empty workspace. <button class="btn" id="btnSample" style="padding:3px 9px;font-size:12px">Load sample data (3 rows per module)</button> or start adding your own.</div>`:'')));
  bn.querySelector('#btnAbout')?.addEventListener('click',aboutModal);
  bn.querySelector('#btnResetDemo')?.addEventListener('click',()=>{ S=demoSeed(); demoSave(); applySettings({}); render(); toast('Sample data restored'); });
  bn.querySelector('#btnExitDemo')?.addEventListener('click',()=>{ MODE='db'; S=null; showAuth(); });
  bn.querySelector('#btnSample')?.addEventListener('click',()=>guarded(async()=>{ await db.loadSample(); await refresh(); },'Sample data loaded'));
  renderNav();
  const el=document.getElementById('view');
  const active=document.activeElement, aid=active&&active.id, ak=active&&active.dataset&&(active.dataset.id+'|'+active.dataset.k);
  R[current](el);
  if(keepFocus){ let n=aid&&document.getElementById(aid); if(!n&&ak){ n=[...el.querySelectorAll('[data-id]')].find(x=>x.dataset.id+'|'+x.dataset.k===ak); } if(n) n.focus({preventScroll:true}); }
}
async function refresh(keepFocus){ try{ await db.loadAll(); render(keepFocus); }catch(e){ console.error(e); toast('Could not load: '+(e.message||e)); } }

/* ===================== Auth & workspace flow ===================== */
const authBody=()=>document.getElementById('authBody');
function showAuth(mode='signin', msg){
  document.getElementById('appShell').hidden=true; document.getElementById('authScreen').hidden=false;
  const m = msg? `<div class="msg ${msg.cls||'info'}">${esc(msg.text)}</div>`:'';
  if(mode==='signin') authBody().innerHTML=`<h2>Sign in</h2><form id="fSignin"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div><button class="btn primary block" type="submit">Sign in</button></form>${m}<div class="links"><button id="lnkSignup">Create account</button><button id="lnkForgot">Forgot password?</button></div>`;
  if(mode==='signup') authBody().innerHTML=`<h2>Create account</h2><form id="fSignup"><div class="field"><label for="email">Email (use the address you were invited with)</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="pw">Password (8+ characters)</label><input id="pw" type="password" autocomplete="new-password" minlength="8" required></div><button class="btn primary block" type="submit">Create account</button></form>${m}<div class="links"><button id="lnkSignin">Back to sign in</button></div>`;
  if(mode==='forgot') authBody().innerHTML=`<h2>Reset password</h2><form id="fForgot"><div class="field"><label for="email">Email</label><input id="email" type="email" required></div><button class="btn primary block" type="submit">Send reset link</button></form>${m}<div class="links"><button id="lnkSignin">Back to sign in</button></div>`;
  if(mode==='recover') authBody().innerHTML=`<h2>Choose a new password</h2><form id="fRecover"><div class="field"><label for="pw">New password</label><input id="pw" type="password" minlength="8" required></div><button class="btn primary block" type="submit">Update password</button></form>${m}`;
  if(mode==='workspace') authBody().innerHTML=`<h2>Set up your workspace</h2><p class="note" style="margin-top:0">You're signed in as <b>${esc(USER.email)}</b> but aren't a member of any workspace yet. Create your own, or wait for an invite from someone who has one.</p><form id="fWs"><div class="field"><label for="wsn">Workspace name</label><input id="wsn" value="My job search" required></div><div class="field"><label for="sep">Separation date</label><input id="sep" type="date" value="${T()}"></div><label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:12px"><input type="checkbox" id="withSample" checked> Load 3 rows of sample data per module</label><button class="btn primary block" type="submit">Create workspace</button></form>${m}<div class="links"><button id="lnkCheck">I was invited — check again</button><button id="lnkOut">Sign out</button></div>`;
  if(mode==='setpw') authBody().innerHTML=`<h2>Choose your password</h2><p class="note" style="margin-top:0">You signed in with a temporary password. Pick your own to continue.</p><form id="fSetPw"><div class="field"><label for="pw">New password (8+ characters)</label><input id="pw" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label for="pw2">Repeat password</label><input id="pw2" type="password" minlength="8" required></div><button class="btn primary block" type="submit">Save and continue</button></form>${m}<div class="links"><button id="lnkOut">Sign out</button></div>`;
  if(mode==='confirm') authBody().innerHTML=`<h2>Check your email</h2><div class="msg ok">We sent a confirmation link to <b>${esc(msg&&msg.email||'your address')}</b>. Open it, then come back and sign in.</div><div class="links"><button id="lnkSignin">Back to sign in</button></div>`;
  eyeAll(authBody());
  const on=(id,fn)=>{ const x=authBody().querySelector(id); if(x) x.addEventListener(id.startsWith('#f')?'submit':'click',e=>{e.preventDefault();fn();}); };
  on('#lnkSignup',()=>showAuth('signup')); on('#lnkSignin',()=>showAuth('signin')); on('#lnkForgot',()=>showAuth('forgot')); on('#lnkOut',()=>sb.auth.signOut());
  on('#lnkCheck',()=>enterApp());
  on('#fSignin',async()=>{ const {error}=await sb.auth.signInWithPassword({email:val('#email'),password:val('#pw')}); if(error) showAuth('signin',{cls:'err',text:/fetch/i.test(error.message)?'Cannot reach the CareerShift database from here. Open this file from your computer or a web host (not a sandboxed preview). The offline demo below still works.':error.message}); else enterApp(); });
  on('#fSignup',async()=>{ const email=val('#email'); const {data,error}=await sb.auth.signUp({email,password:val('#pw'),options:{emailRedirectTo:location.href.split('#')[0]}}); if(error) return showAuth('signup',{cls:'err',text:error.message}); if(!data.session) showAuth('confirm',{email}); else enterApp(); });
  on('#fForgot',async()=>{ const {error}=await sb.auth.resetPasswordForEmail(val('#email'),{redirectTo:location.href.split('#')[0]}); showAuth('forgot',error?{cls:'err',text:error.message}:{cls:'ok',text:'If that address has an account, a reset link is on its way.'}); });
  on('#fSetPw',async()=>{ if(val('#pw')!==val('#pw2')) return showAuth('setpw',{cls:'err',text:'Passwords do not match'}); const {error}=await sb.auth.updateUser({password:val('#pw'),data:{must_change_password:false}}); if(error) return showAuth('setpw',{cls:'err',text:error.message}); toast('Password set'); logEvent('password_set'); enterApp(); });
  on('#fRecover',async()=>{ const {error}=await sb.auth.updateUser({password:val('#pw')}); if(error) return showAuth('recover',{cls:'err',text:error.message}); toast('Password updated'); enterApp(); });
  on('#fWs',async()=>{ try{ const {data,error}=await sb.rpc('create_workspace',{p_name:val('#wsn'),p_separation:val('#sep')||null}); if(error) throw error; await enterApp(data, authBody().querySelector('#withSample').checked); }catch(e){ showAuth('workspace',{cls:'err',text:e.message}); } });
}
const val=sel=>authBody().querySelector(sel).value.trim();
/* password reveal toggle: wraps any password input in a row with an eye button */
function addEye(input){
  if(!input || input.dataset.eye) return; input.dataset.eye='1';
  const row=document.createElement('div'); row.className='pwrow'; input.parentNode.insertBefore(row,input); row.appendChild(input);
  const btn=document.createElement('button'); btn.type='button'; btn.className='btn eye'; btn.title='Show password'; btn.setAttribute('aria-label','Show password'); btn.setAttribute('aria-pressed','false');
  btn.innerHTML=EYE_ON;
  btn.addEventListener('click',()=>{ const show=input.type==='password'; input.type=show?'text':'password'; btn.innerHTML=show?EYE_OFF:EYE_ON; btn.title=btn.ariaLabel=show?'Hide password':'Show password'; btn.setAttribute('aria-pressed',String(show)); input.focus({preventScroll:true}); });
  row.appendChild(btn);
}
const EYE_ON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.8 21.8 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a21.8 21.8 0 0 1-3.17 4.19"/><line x1="1" y1="1" x2="23" y2="23"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>';
const eyeAll=root=>(root||document).querySelectorAll('input[type=password]').forEach(addEye);

let rtChannel=null, rtTimer=null;
function subscribeRealtime(){
  if(rtChannel){ sb.removeChannel(rtChannel); rtChannel=null; }
  rtChannel = sb.channel('ws-'+WS.id);
  ['tasks','applications','interviews','recruiters','contacts','compliance_weeks','expenses','cash_inputs','workspace_members','activity_log'].forEach(t=>{
    rtChannel.on('postgres_changes',{event:'*',schema:'public',table:t,filter:`workspace_id=eq.${WS.id}`},()=>{ clearTimeout(rtTimer); rtTimer=setTimeout(()=>refresh(true),350); });
  });
  rtChannel.subscribe(status=>{ const s=document.getElementById('syncState'); if(s) s.className='sync'+(status==='SUBSCRIBED'?'':' off'); });
}
async function enterApp(preferWs, withSample){
  const {data:{user}} = await sb.auth.getUser(); USER=user;
  if(!USER) return showAuth('signin');
  if(USER.user_metadata && USER.user_metadata.must_change_password) return showAuth('setpw');
  try{ await sb.rpc('accept_pending_invites'); }catch(e){ console.warn(e); }
  const {data:mems,error} = await sb.from('workspace_members').select('workspace_id, role, can_export, read_only, modules, first_name, last_name, display_name, phone, workspaces(id,name,separation_date,weekly_requirement,owner_id,settings)').eq('user_id',USER.id).order('created_at');
  if(error){ return showAuth('signin',{cls:'err',text:error.message}); }
  if(!mems || !mems.length) return showAuth('workspace');
  let pick = mems.find(m=>m.workspace_id===preferWs) || mems.find(m=>m.role==='owner') || mems[0];
  try{ const saved=localStorage.getItem('careershift.ws'); const s2=mems.find(m=>m.workspace_id===saved); if(!preferWs && s2) pick=s2; }catch(e){}
  try{ const {data:meta}=await sb.from('app_meta').select('key,value'); if(meta){ const m=Object.fromEntries(meta.map(x=>[x.key,x.value])); LATEST=m.latest_version||null; S=S||{}; S.changelog=m.changelog||''; } }catch(e){}
  const firstEntry = !WS;
  WS = pick.workspaces; ROLE = pick.role; ME = {can_export:pick.can_export, read_only:pick.read_only, modules:pick.modules, first_name:pick.first_name, last_name:pick.last_name, display_name:pick.display_name, phone:pick.phone}; applySettings(WS.settings);
  try{ localStorage.setItem('careershift.ws', WS.id); }catch(e){}
  if(firstEntry) logEvent('sign_in',{role:ROLE,version:APP_VERSION,build:APP_BUILD});
  stampVersion();
  if(withSample){ try{ await db.loadSample(); }catch(e){ console.error(e); toast('Sample data failed: '+e.message); } }
  document.getElementById('authScreen').hidden=true; document.getElementById('appShell').hidden=false;
  await refresh(); subscribeRealtime();
  // workspace switcher when a member of several
  if(mems.length>1){
    const sw=document.createElement('select'); sw.className='btn'; sw.id='wsSwitch';
    mems.forEach(m=>{ const o=document.createElement('option'); o.value=m.workspace_id; o.textContent=m.workspaces.name+' ('+m.role+')'; o.selected=m.workspace_id===WS.id; sw.appendChild(o); });
    sw.addEventListener('change',()=>enterApp(sw.value));
    const old=document.getElementById('wsSwitch'); if(old) old.remove();
    document.querySelector('.asof').prepend(sw);
  }
}

/* ===================== Boot ===================== */
document.getElementById('btnSignOut').addEventListener('click',async()=>{ if(MODE==='demo'){ MODE='db'; S=null; showAuth(); return; } logEvent('sign_out'); await new Promise(r=>setTimeout(r,250)); await sb.auth.signOut(); });
document.getElementById('btnDemo').addEventListener('click',async()=>{ MODE='demo'; ROLE='owner'; ME={}; USER=null; WS=null; await db.loadAll(); logEvent('sign_in',{role:'owner',demo:true}); document.getElementById('authScreen').hidden=true; document.getElementById('appShell').hidden=false; render(); });
try{ const mq=matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener('change',()=>render()); new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']}); }catch(e){}
function stampVersion(){
  const t=versionLabel();
  const rv=document.getElementById('railVersion'); if(rv){ rv.innerHTML=`${APP_NAME} <b>v${APP_VERSION}</b><br><span>build ${APP_BUILD}</span>${LATEST&&cmpVer(APP_VERSION,LATEST)<0?`<br><span class="pill crit" style="margin-top:4px">update available: v${LATEST}</span>`:''}`; rv.onclick=aboutModal; }
  const av=document.getElementById('authVersion'); if(av) av.textContent=t;
  document.title=`${APP_NAME} v${APP_VERSION}`;
  console.info(`%c${APP_NAME} ${t}`,'color:#2a78d6;font-weight:bold');
}
function aboutModal(){
  const cl=(S&&S.changelog)||'';
  openModal(`<div class="mhead"><b>About ${APP_NAME}</b><button class="mclose" id="aClose">×</button></div><div class="mbody">
    <div class="kit-grid"><div class="kv"><span>This copy</span><code>v${APP_VERSION}</code></div><div class="kv"><span>Build</span><code>${APP_BUILD}</code></div><div class="kv"><span>Latest released</span><code>${LATEST?'v'+LATEST:'—'}</code></div><div class="kv"><span>Status</span><code>${!LATEST?'unknown (offline)':cmpVer(APP_VERSION,LATEST)<0?'OUTDATED — replace index.html on your host':cmpVer(APP_VERSION,LATEST)>0?'newer than registry':'up to date'}</code></div>
    <div class="kv"><span>Backend</span><code>${SUPABASE_URL.replace('https://','')}</code></div><div class="kv"><span>Admin function</span><code>admin-users ${S&&S.mailConfig&&S.mailConfig.fn_version?'v'+S.mailConfig.fn_version:''}</code></div></div>
    <h3 style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);margin:6px 0">Release notes</h3>
    <ul class="alist" style="font-size:13px">${cl.split('|').map(x=>x.trim()).filter(Boolean).map(x=>`<li><span class="pill ${x.startsWith(APP_VERSION)?'info':'idle'}">${esc(x.split(' ')[0])}</span><span>${esc(x.slice(x.indexOf(' ')+1))}</span><span></span></li>`).join('')||'<li class="empty">Release notes load after sign-in.</li>'}</ul>
    <div class="mfoot"><button class="btn" id="aDone">Close</button></div></div>`);
  document.getElementById('aClose').onclick=document.getElementById('aDone').onclick=closeModal;
}
(async function boot(){
  stampVersion();
  if(!window.supabase){ showAuth('signin',{cls:'err',text:'Could not load the Supabase client — this page must be opened from a normal web host or local file, not inside a sandboxed preview. The offline demo below still works.'}); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='PASSWORD_RECOVERY') return showAuth('recover');
    if(event==='SIGNED_OUT'){ USER=null; WS=null; S=null; if(rtChannel){ sb.removeChannel(rtChannel); rtChannel=null; } showAuth('signin',{cls:'ok',text:'Signed out.'}); }
  });
  if(/claude(usercontent)?\.(ai|com)$/.test(location.hostname)){ // hosted preview cannot reach Supabase (CSP) — run the offline demo
    MODE='demo'; ROLE='owner'; ME={}; await db.loadAll(); logEvent('sign_in',{role:'owner',demo:true,version:APP_VERSION}); stampVersion(); document.getElementById('authScreen').hidden=true; document.getElementById('appShell').hidden=false; render();
    document.getElementById('banner').insertAdjacentHTML('afterbegin','<div class="banner info">Preview copy — this page runs the offline demo. Download <b>CareerShift.html</b> and open or host it to sign in and collaborate with your team.</div>'); return; }
  const {data:{session}} = await sb.auth.getSession();
  if(session) enterApp(); else showAuth('signin');
})();
</script>
