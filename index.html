<style>
:root{
  color-scheme:light;
  --ground:#f3f5f8; --surface:#ffffff; --surface-2:#f8fafc; --line:#dde3ea; --line-2:#eef1f5;
  --ink:#14213d; --ink-2:#4c5a6e; --ink-3:#7d8899;
  --accent:#2a78d6; --accent-deep:#1c5cab; --accent-soft:#e3eefc;
  --good:#1a8c4e; --good-soft:#dff3e7; --warn:#d99000; --warn-soft:#fff2cc; --crit:#d9403f; --crit-soft:#fde3e3;
  --soon:#e26a2c; --soon-soft:#fde8dc; --idle:#8b95a1; --idle-soft:#e9edf1; --wait:#6b5bd6; --wait-soft:#e9e6fb;
  --rail:#14213d; --rail-ink:#c9d3e3; --rail-active:#2a78d6;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 4px 14px rgba(20,33,61,.05);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#12161c; --surface:#1a2029; --surface-2:#1f2733; --line:#2b3440; --line-2:#242d39;
    --ink:#eef1f5; --ink-2:#b4bdc9; --ink-3:#7f8a99;
    --accent:#3987e5; --accent-deep:#6da7ec; --accent-soft:#1c2f4a;
    --good:#3fbf76; --good-soft:#153826; --warn:#f0b429; --warn-soft:#3d2f0a; --crit:#f06a69; --crit-soft:#3f1a1a;
    --soon:#f0834e; --soon-soft:#3f2416; --idle:#8b95a1; --idle-soft:#2a323d; --wait:#a99cf2; --wait-soft:#2a2547;
    --rail:#0d1117; --rail-ink:#aab4c3; --rail-active:#3987e5;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#12161c; --surface:#1a2029; --surface-2:#1f2733; --line:#2b3440; --line-2:#242d39;
  --ink:#eef1f5; --ink-2:#b4bdc9; --ink-3:#7f8a99;
  --accent:#3987e5; --accent-deep:#6da7ec; --accent-soft:#1c2f4a;
  --good:#3fbf76; --good-soft:#153826; --warn:#f0b429; --warn-soft:#3d2f0a; --crit:#f06a69; --crit-soft:#3f1a1a;
  --soon:#f0834e; --soon-soft:#3f2416; --idle:#8b95a1; --idle-soft:#2a323d; --wait:#a99cf2; --wait-soft:#2a2547;
  --rail:#0d1117; --rail-ink:#aab4c3; --rail-active:#3987e5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;transition:grid-template-columns .22s ease}
body.rail-collapsed .app{grid-template-columns:56px 1fr}

.railtoggle:hover{background:rgba(255,255,255,.14);color:#fff}

body.rail-collapsed .railtoggle{position:static;margin:0 auto 10px}
body.rail-collapsed .brand{padding:4px 0 10px;justify-content:center}
body.rail-collapsed .brand .mark{cursor:pointer}
body.rail-collapsed .brand > div:not(.mark),body.rail-collapsed .nav,body.rail-collapsed .railuser .ru-text,body.rail-collapsed .railuser .btn,body.rail-collapsed .railfoot{display:none}

/* rail */
.rail{background:var(--rail);color:var(--rail-ink);padding-block:18px 10px;padding-inline:14px;position:sticky;top:0;height:100vh;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px}
.brand .mark{width:30px;height:30px;border-radius:7px;background:var(--rail-active);display:grid;place-items:center;font-family:var(--mono);font-weight:600;color:#fff;font-size:12px}
.brand b{color:#fff;font-weight:600;font-size:14px;display:block;line-height:1.15}
.brand small{font-size:11px;opacity:.7;letter-spacing:.04em;text-transform:uppercase}
.zone{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.55;padding:12px 8px 4px}
.nav .zone-btn{display:flex;align-items:center;gap:6px;width:100%;background:none;border:0;color:var(--rail-ink);cursor:pointer;text-align:left;border-radius:6px;opacity:.7;font-weight:600;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;padding:10px 8px 4px}
.nav .zone-btn:hover{opacity:1;background:rgba(255,255,255,.05)}
.zone-btn:focus-visible{outline:2px solid #fff;outline-offset:1px;opacity:1}
.nav .zone-btn .cur{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--rail-active);margin-left:4px}
.nav .zone-btn.has-active{opacity:.9;color:#fff}
.zone-btn .chev{font-family:var(--mono);width:10px;display:inline-block;opacity:.8}
.zone-btn .badge{margin-left:auto}
.zonegrp{display:flex;flex-direction:column;gap:2px}
.zonegrp.collapsed .zone-btn{opacity:.55}
.navtools{display:flex;gap:6px;padding:10px 8px 4px;margin-top:4px}
.navtools button{background:none;border:1px solid rgba(255,255,255,.14);color:var(--rail-ink);border-radius:5px;padding:2px 8px;font-size:10.5px;cursor:pointer;opacity:.7}
.navtools button:hover{opacity:1;border-color:rgba(255,255,255,.4)}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;color:var(--rail-ink);cursor:pointer;font-size:13px}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.active{background:var(--rail-active);color:#fff}
.nav button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.nav .badge{margin-left:auto;font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.12);padding:1px 6px;border-radius:9px}
.nav button.active .badge{background:rgba(255,255,255,.25)}
/* main */
.main{padding-block:20px 48px;padding-inline:28px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.topbar h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
.topbar .sub{color:var(--ink-3);font-size:13px;margin-top:2px}
.asof{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.asof .chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink-2)}
.asof .chip b{font-family:var(--mono);color:var(--ink);font-weight:500}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-deep);color:#fff}
.btn.danger{color:var(--crit)}
.btn:focus-visible,.slicer button:focus-visible,.tbl input:focus-visible,.tbl select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* sections */
.grid{display:grid;gap:16px}
.g12{grid-template-columns:repeat(12,minmax(0,1fr))}
.span3{grid-column:span 3}.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.card h3{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--ink-2);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.card h3 .hint{font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-3);margin-left:auto;font-size:12px}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px 16px;position:relative;box-shadow:var(--shadow);min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--idle)}
.kpi.good::before{background:var(--good)}.kpi.warn::before{background:var(--warn)}.kpi.crit::before{background:var(--crit)}.kpi.info::before{background:var(--accent)}
.kpi .l{font-size:11.5px;color:var(--ink-3);letter-spacing:.03em;text-transform:uppercase}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink-2);margin-top:2px;display:flex;align-items:center;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--idle)}
.dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--crit)}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap;background:var(--idle-soft);color:var(--ink-2)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.soon{background:var(--soon-soft);color:var(--soon)}.pill.info{background:var(--accent-soft);color:var(--accent)}.pill.wait{background:var(--wait-soft);color:var(--wait)}
/* slicers */
.slicers{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px;align-items:flex-start}
.slicer{display:flex;flex-direction:column;gap:5px}
.slicer .sl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.slicer .opts{display:flex;flex-wrap:wrap;gap:4px}
.slicer button{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.slicer button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.slicer button:hover:not(.on){border-color:var(--accent)}
/* tables */
.tblwrap{overflow-x:auto}
.bm-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bm-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.bm-nav select{font-weight:600;min-width:170px}
.bm-tabs{display:flex;gap:6px;flex-wrap:wrap}.bm-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.usebar{display:inline-block;width:48px;height:6px;border-radius:3px;background:var(--line-2);margin-right:6px;vertical-align:middle;overflow:hidden}.usebar i{display:block;height:100%}
.tx-add{display:grid;grid-template-columns:150px minmax(160px,1.2fr) 150px 1.5fr auto;gap:8px;margin:4px 0 10px}
.tx-add input,.tx-add select{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;min-width:0}
@media (max-width:900px){.tx-add{grid-template-columns:1fr 1fr}.tx-add select,.tx-add input[type=text]:last-of-type{grid-column:1/-1}.tx-add .btn{grid-column:1/-1}.bm-nav select{min-width:0;flex:1}}
.tp-add{display:grid;grid-template-columns:1fr auto auto auto auto;gap:8px;margin:4px 0 10px}
.tp-add input,.tp-add select{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px}
.tp-add .tp-new{min-width:0}
.tp-summary{display:flex;gap:14px;font-size:12px;color:var(--ink-3);margin-bottom:6px;flex-wrap:wrap} .tp-summary a{color:var(--accent)}
.tp-list{list-style:none;margin:0;padding:0}
.tp-row{display:grid;grid-template-columns:auto 1fr 140px 110px 130px auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-2)}
.tp-row:last-child{border-bottom:0} .tp-row.done .tp-text{text-decoration:line-through;color:var(--ink-3)}
.tp-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--good);margin:0 4px}
.tp-main{min-width:0} .tp-text{width:100%;border:1px solid transparent;background:transparent;border-radius:4px;padding:3px 6px;font:inherit;font-size:13.5px;color:var(--ink)} .tp-text:hover{border-color:var(--line)} .tp-text:focus{background:var(--surface-2);border-color:var(--accent);outline:none}
.tp-meta{display:flex;gap:8px;align-items:center;padding-left:6px;font-size:11.5px;color:var(--ink-3);flex-wrap:wrap} .tp-cat{text-transform:uppercase;letter-spacing:.05em;font-size:10.5px;font-weight:600} .tp-note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.tp-due,.tp-sel{border:1px solid transparent;background:transparent;border-radius:4px;padding:4px 6px;font:inherit;font-size:12.5px;color:var(--ink)} .tp-due{font-family:var(--mono)} .tp-due:hover,.tp-sel:hover{border-color:var(--line)}
.tp-list .empty{padding:14px 6px}
@media (max-width:900px){.tp-row{grid-template-columns:auto 1fr auto;grid-auto-rows:auto}.tp-row .tp-due,.tp-row .tp-sel{grid-column:2}.tp-add{grid-template-columns:1fr 1fr}.tp-add .tp-new{grid-column:1/-1}}
.tbl .mv{background:none;border:0;color:var(--ink-3);cursor:pointer;padding:0 3px;font-size:9px;line-height:1.1}
.tbl .mv:hover{color:var(--accent)} .ro .mv{display:none}
.tbl tr.ex-off td{opacity:.55} .tbl tr.ex-off input[data-k=category]{text-decoration:line-through}
.mix{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line-2);margin:6px 0 8px}
.mix span{display:block;height:100%}
.mixleg{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap} .mixleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.scen{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px} .scen .box{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.scen .box .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)} .scen .box .v{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:2px} .scen .box .s{font-size:12px;color:var(--ink-2);margin-top:2px}
.rng{width:100%;accent-color:var(--accent);margin-top:4px} .ro .rng{pointer-events:auto;opacity:1}
.plist{list-style:none;margin:0;padding:0} .plist li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line-2)} .plist li:last-child{border-bottom:0} .plist input{margin-top:3px;accent-color:var(--accent)} .plist .t{font-weight:500} .plist .m{font-size:12px;color:var(--ink-3)} .plist li.done .t{text-decoration:line-through;color:var(--ink-3)}
@media (max-width:700px){.scen{grid-template-columns:1fr}}

.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:8px 8px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap;font-weight:600}
.tbl td{padding:4px 6px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
.tbl tr.st-good td:first-child{box-shadow:inset 4px 0 0 var(--good)}
.tbl tr.st-warn td:first-child{box-shadow:inset 4px 0 0 var(--warn)}
.tbl tr.st-crit td:first-child{box-shadow:inset 4px 0 0 var(--crit)}
.tbl tr.st-soon td:first-child{box-shadow:inset 4px 0 0 var(--soon)}
.tbl tr.st-idle td:first-child{box-shadow:inset 4px 0 0 var(--idle)}
.tbl tr.st-wait td:first-child{box-shadow:inset 4px 0 0 var(--wait)}
.tbl input,.tbl select{width:100%;border:1px solid transparent;background:transparent;border-radius:4px;padding:4px 6px;min-width:70px}
.tbl input:hover,.tbl select:hover{border-color:var(--line)}
.tbl input:focus,.tbl select:focus{background:var(--surface-2);border-color:var(--accent)}
.tbl input[type=number],.tbl input[data-num]{font-family:var(--mono);text-align:right;min-width:60px}

.tbl .num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.tbl .id{font-family:var(--mono);color:var(--ink-3);font-size:12px}
.tbl .del{background:none;border:0;color:var(--ink-3);cursor:pointer;padding:2px 6px;border-radius:4px}
.tbl .del:hover{color:var(--crit);background:var(--crit-soft)}
.tbl tfoot td{font-weight:600;border-top:1px solid var(--line);background:var(--surface-2)}
.tblhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.tblhead .cnt{color:var(--ink-3);font-size:12.5px}
.pivot td,.pivot th{padding:6px 10px}
.pivot td.num{font-family:var(--mono);text-align:right}
/* lists */
.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.alist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line-2)}
.alist li:last-child{border-bottom:0}

.pri{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600;color:#fff;background:var(--idle)}
.pri.p1{background:var(--crit)}.pri.p2{background:var(--soon)}.pri.p3{background:var(--accent)}.pri.p4{background:var(--good)}.pri.p5{background:var(--wait)}
.empty{color:var(--ink-3);font-size:13px;padding:10px 4px}
/* gauges and charts */
.chart{width:100%;min-height:220px}
.chart.tall{min-height:300px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* inputs form */
.form{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.form label{font-size:13px;color:var(--ink-2)}
.form input{font-family:var(--mono);text-align:right;width:150px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface-2)}

.form .out{font-family:var(--mono);text-align:right;font-weight:600}
.form .sep{grid-column:1/-1;border-top:1px solid var(--line);margin:4px 0}
.bigstat{display:flex;align-items:baseline;gap:8px;margin:6px 0 2px}

.bar{height:8px;border-radius:4px;background:var(--line-2);overflow:hidden}

.score-row{display:grid;grid-template-columns:140px 1fr 56px;gap:10px;align-items:center;padding:5px 0}

.note{font-size:12px;color:var(--ink-3);margin-top:8px}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--ground);padding:9px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);opacity:0;transform:translateY(6px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:none}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

  /* bottom tab bar */
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(20,33,61,.08)}
  .tabbar button{background:none;border:0;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink-3);cursor:pointer;min-height:56px;position:relative;touch-action:manipulation}
  .tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabbar button.active{color:var(--accent);font-weight:600}
  .tabbar .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--crit);color:#fff;font-family:var(--mono);font-size:10px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;display:grid;place-items:center}
  /* layout */
  .grid{gap:12px}
  .span3,.span4,.span5,.span6,.span7,.span8{grid-column:span 12}
  .card{padding:14px 14px;border-radius:12px}

  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

  .btn{min-height:40px;padding:8px 14px;font-size:14px;touch-action:manipulation}
  input,select,textarea{font-size:16px!important}
  .field input,.field select{padding:11px 12px;min-height:44px}
  .form{grid-template-columns:1fr}
  .form input,.form select{width:100%;min-height:44px}
  .form label{margin-top:6px}
  .form .out{text-align:left}
  .inline-form .field{min-width:0;flex-basis:100%}
  .slicer-toggle{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px}

  .slicers{gap:8px;margin-bottom:10px;display:none}

  .slicer{max-width:100%}

  .slicer .opts::-webkit-scrollbar{display:none}
  .slicer button{white-space:nowrap;min-height:36px;padding:6px 12px;font-size:13px}
  .tblhead{gap:8px}
  .tblhead .btn{flex:none}
  .tbl input,.tbl select{min-height:40px;padding:6px 8px}
  .tbl td{white-space:normal}
  /* generic editable tables become cards — every column is visible without sideways scrolling */
  .tbl[data-tbl].cards{display:block;border:0}
  .tbl[data-tbl].cards thead{display:none}
  .tbl[data-tbl].cards tbody,.tbl[data-tbl].cards tfoot{display:block}
  .tbl[data-tbl].cards tbody tr{display:block;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px 6px;margin-bottom:10px;box-shadow:none;position:relative}
  .tbl[data-tbl].cards tbody tr.st-good{border-left:4px solid var(--good)} .tbl[data-tbl].cards tbody tr.st-warn{border-left:4px solid var(--warn)} .tbl[data-tbl].cards tbody tr.st-crit{border-left:4px solid var(--crit)} .tbl[data-tbl].cards tbody tr.st-soon{border-left:4px solid var(--soon)} .tbl[data-tbl].cards tbody tr.st-idle{border-left:4px solid var(--idle)} .tbl[data-tbl].cards tbody tr.st-wait{border-left:4px solid var(--wait)} .tbl[data-tbl].cards tbody tr.st-info{border-left:4px solid var(--accent)}
  .tbl[data-tbl].cards tbody tr td:first-child{box-shadow:none}
  .tbl[data-tbl].cards td{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px;align-items:center;border:0;padding:4px 0;min-height:36px}
  .tbl[data-tbl].cards td::before{content:attr(data-label);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .tbl[data-tbl].cards td:not([data-label]),.tbl[data-tbl].cards td[data-label=""]{grid-template-columns:1fr;justify-items:end}
  .tbl[data-tbl].cards td:not([data-label])::before,.tbl[data-tbl].cards td[data-label=""]::before{content:none}
  .tbl[data-tbl].cards td.num{text-align:left}
  .tbl[data-tbl].cards td.empty{grid-template-columns:1fr;text-align:center}
  .tbl[data-tbl].cards td.empty::before{content:none}
  .tbl[data-tbl].cards .del{position:absolute;top:6px;right:6px;font-size:16px;padding:6px 10px}
  .tbl[data-tbl].cards .mv{font-size:13px;padding:4px 8px}
  .tbl[data-tbl].cards tfoot tr{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;padding:8px 10px;background:var(--surface);border:1px dashed var(--line);border-radius:10px}
  .tbl[data-tbl].cards tfoot td{border:0;padding:2px 0}
  .tbl[data-tbl].cards tfoot td:empty{display:none}
  /* modals become bottom sheets */
  .modal-back{place-items:end center;padding:0}
  .modal{max-width:none;max-height:calc(100dvh - env(safe-area-inset-top) - 24px);border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom)}
  .modal .btn{min-height:44px}
  .theme-fixed{top:calc(10px + env(safe-area-inset-top));right:12px}
  .auth{min-height:100dvh;padding:calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom))}
  .auth-card{padding:22px 18px 18px}
  .toast{left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));transform:none;max-width:none}
  .banner{font-size:13px}
  .scen{grid-template-columns:1fr}
  .tp-row{grid-template-columns:auto 1fr;grid-auto-rows:auto;padding:10px 0}

  .tp-add{grid-template-columns:1fr 1fr}
  .tp-add .tp-new,.tp-add .btn{grid-column:1/-1}
  .kit-grid,.grid2{grid-template-columns:1fr}
  .legend{gap:8px 12px}
}

function recApps(rc){ const n=nm(rc.name), ag=normCo(rc.agency); return S.apps.filter(a=>{ const ar=nm(a.recruiter); return (n&&ar&&(ar.includes(n)||n.includes(ar)))||(ag&&normCo(a.company)===ag); }); }

/* an interview's stage / outcome moves its application forward (never backward) */
async function syncAppFromInterview(i){
  const a=intApp(i); if(!a||!canEdit()) return; const p={};
  if(i.outcome==='Offer'||i.stage==='Offer'){ if(a.stage!=='Offer') p.stage='Offer'; }
  else if(i.outcome==='Rejected'||i.stage==='Rejected'){ if(!['Rejected','Offer'].includes(a.stage)) p.stage='Rejected'; if(a.status!=='Closed') p.status='Closed'; }
  else { const tgt=INT2APP[i.stage], ti=STAGE_ORDER.indexOf(tgt), ci=STAGE_ORDER.indexOf(a.stage); if(tgt&&ti>ci&&a.stage!=='Rejected') p.stage=tgt;
    if(i.date&&i.date>=T()&&(i.outcome||'Pending')==='Pending'&&(!a.next||/^interview/i.test(a.next))) { const nx=`Interview ${fmtD(i.date)}${i.time?' '+i.time:''} — ${i.stage}`; if(a.next!==nx) p.next=nx; } }

async function recHook(op,coll,row,patch){
  if(!row||!canEdit()) return;
  try{
    if(coll==='apps'){
      if(op==='insert'&&CFG.autoFollow!==false&&row.status!=='Closed'&&!['Rejected','Offer'].includes(row.stage)&&(!row.applied||diffDays(T(),String(row.applied).slice(0,10))<Math.max(cfgN('staleDays')||30,cfgN('followDays')+1))) await ensureFollowTask(row);
      if(op==='update'&&patch){ const closed=patch.status==='Closed'||['Rejected','Offer'].includes(patch.stage);
        if(closed) for(const t of autoTasks('app_follow',row.id).filter(isOpenTask)) await db.update('tasks',t.id,{status:'Complete',progress:100,notes:((t.notes||'')+` · closed automatically (${patch.stage&&patch.stage!==row.stage?patch.stage:patch.status||row.stage})`).replace(/^ · /,'')});
        if('applied' in patch&&patch.applied) for(const t of autoTasks('app_follow',row.id).filter(isOpenTask)) await db.update('tasks',t.id,{due:maxD(addDays(String(patch.applied).slice(0,10),cfgN('followDays')),T()),start:String(patch.applied).slice(0,10)});

      if(op==='remove') for(const t of autoTasks('app_follow',row.id).filter(isOpenTask)) await db.remove('tasks',t.id);
    }
    if(coll==='interviews'){
      if(op==='insert'&&CFG.autoThanks!==false&&row.date&&String(row.date).slice(0,10)>=addDays(T(),-1)) await ensureThanksTask(row);
      if(op==='update'&&patch){ const open=autoTasks('int_thanks',row.id).filter(isOpenTask);
        if('date' in patch){ if(patch.date){ if(open.length) for(const t of open) await db.update('tasks',t.id,{due:addDays(String(patch.date).slice(0,10),1),start:String(patch.date).slice(0,10)}); else if(CFG.autoThanks!==false&&!autoTasks('int_thanks',row.id).length&&String(patch.date).slice(0,10)>=addDays(T(),-1)) await ensureThanksTask(row); } }
        if('company' in patch||'stage' in patch) for(const t of open) await db.update('tasks',t.id,{task:thanksTitle(row)});
        if(patch.outcome==='Withdrew') for(const t of open) await db.update('tasks',t.id,{status:'Complete',progress:100,notes:'Interview withdrawn'}); }

}

const PAY_TYPES=['Salary','Hourly W-2','Hourly 1099','Hourly C2C'];

function offerCalc(o){
  const hourly=o.pay_type!=='Salary', hrs=+o.hours_week||40, wks=+o.weeks_year||52, base=+o.base||0;
  const cash=hourly?base*hrs*wks:base;

  const workWeeks=Math.max(0,wks-(+o.pto_days||0)/5);

  const code=await new Promise((res,rej)=>{ const done=(fn,v)=>{ window.removeEventListener('message',on); clearInterval(poll); fn(v); };

async function olRun(progress,interactive=true){

  if(olCfg().account!==me) await db.saveSettings({outlook:{...olCfg(),account:me}});
  const sent=(await olApi('me/mailFolders/sentitems',{'$select':'id'},interactive)).id; const since=gmSince(); const convs=new Map();
  const take=j=>(j.value||[]).forEach(m=>{ if(String(m.receivedDateTime||m.sentDateTime||'').slice(0,10)>=since&&m.conversationId&&!convs.has(m.conversationId)) convs.set(m.conversationId,m.webLink); });

  const worker=async()=>{ while(list.length){ const c=list.shift(); try{ const j=await olApi('me/messages',{'$filter':`conversationId eq '${c.replace(/'/g,"''")}'`,'$select':OL_SEL,'$expand':'attachments($select=name)','$top':'50'},interactive);
      const th=olToThread(c,(j.value||[]).sort((a,b)=>String(a.receivedDateTime).localeCompare(String(b.receivedDateTime))),sent,me); const ev=gmClassify(th,me); ev.src='outlook'; ev.webLink=convs.get(c)||th.webLink; events.push(ev); }

/* ===================== v1.22 — Income, Bills & Taxes: claim-week earnings, day-by-day cash calendar, tax set-aside, health-coverage deadlines ===================== */
const EARN_KINDS=['Wages','Holiday pay','Severance','Vacation / PTO pay','Other deductible income'];
const EARN_WAGE=new Set(['Wages','Holiday pay']);                 // Ohio: 20% of the weekly benefit is exempt, the rest is deducted
/* Ohio partial-benefit estimate for one claim week (Sunday–Saturday) — an estimate only; ODJFS decides */
function claimWeekEst(we,extraWages){ const w=+(S.cash&&S.cash.benefit_weekly)||0; const rows=(S.earnings||[]).filter(e=>e.week_end&&weekEnding(String(e.week_end).slice(0,10))===we);
  const wages=sum(rows.filter(e=>EARN_WAGE.has(e.kind)).map(e=>+e.gross||0))+(extraWages||0), deduct=sum(rows.filter(e=>!EARN_WAGE.has(e.kind)).map(e=>+e.gross||0)), hours=sum(rows.map(e=>+e.hours||0));
  const exempt=w*0.2, wageDed=Math.max(0,wages-exempt); const pay=!w?0:wages>=w?0:Math.max(0,w-wageDed-deduct);
  return {we,w,rows,wages,deduct,hours,exempt,wageDed,pay,reduced:w-pay}; }
const wPct=()=>((+S.cash.fed_withhold_pct||0)+(+S.cash.state_withhold_pct||0))/100;
/* every unemployment payment still to come, until the claim ends or the new job starts */
function benefitSchedule(days){ const b=benefitInfo(), c=S.cash, out=[]; if(!b.active) return out; const stop=[b.end,c.job_start?String(c.job_start).slice(0,10):null].filter(Boolean).sort()[0]; const horizon=addDays(T(),days||120);
  let we=weekEnding(addDays(T(),-7)); let n=0; while(n<b.weeksLeft&&we<=horizon){ const cert=addDays(we,1+((b.certDay-0+7)%7)), paid=addDays(cert,cfgN('uiPayLagDays'));
    if(stop&&addDays(we,-6)>=stop) break;
    if(paid>=T()){ const js=c.job_start?String(c.job_start).slice(0,10):null; let extra=0, startWk=false;
      if(js&&js>=addDays(we,-6)&&js<=we&&!(S.earnings||[]).some(e=>e.week_end&&weekEnding(String(e.week_end).slice(0,10))===we)){ startWk=true; const days=Math.max(0,Math.min(5,diffDays(addDays(we,-1),js)+1)); extra=(+c.job_gross_annual>0)?(+c.job_gross_annual)/52*days/5:(days>0?Infinity:0); }

const SL = {}; const SL_OPEN=new Set();
document.addEventListener('click',e=>{ const b=e.target.closest('[data-sltoggle]'); if(!b) return; const v=b.dataset.sltoggle; SL_OPEN.has(v)?SL_OPEN.delete(v):SL_OPEN.add(v); render(); });
function slicerHTML(view, defs, rows){
  SL[view] = SL[view]||{};
  const active=defs.reduce((n,d)=>n+((SL[view][d.k]&&SL[view][d.k].size)||0),0);
  const open=SL_OPEN.has(view);
  return `<button class="btn slicer-toggle ${active?'has':''}" data-sltoggle="${view}" aria-expanded="${open}">${open?'▴':'▾'} Filters${active?` · ${active} active`:''}</button><div class="slicers ${open?'open':''}">${defs.map(d=>{
    const vals = d.opts || [...new Set(rows.map(d.get||(r=>r[d.k])))].filter(Boolean).sort();
    const sel = SL[view][d.k]||new Set();
    return `<div class="slicer"><span class="sl">${esc(d.label)}</span><div class="opts">${vals.map(v=>`<button data-sl="${view}" data-k="${d.k}" data-v="${esc(v)}" class="${sel.has(v)?'on':''}">${esc(v)}</button>`).join('')}${sel.size?`<button data-slclear="${view}" data-k="${d.k}" style="border-style:dashed">clear</button>`:''}</div></div>`;
  }).join('')}</div>`;
}
function applySlicers(view, defs, rows){
  const s=SL[view]||{}; let filtered=false;
  const out = rows.filter(r=>defs.every(d=>{ const sel=s[d.k]; if(!sel||!sel.size) return true; filtered=true; return sel.has((d.get||(x=>x[d.k]))(r)); }));
  return {rows:out, filtered};
}
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-sl]');
  if(b){ const s=SL[b.dataset.sl][b.dataset.k]=SL[b.dataset.sl][b.dataset.k]||new Set(); s.has(b.dataset.v)?s.delete(b.dataset.v):s.add(b.dataset.v); render(); return; }
  const c=e.target.closest('[data-slclear]');
  if(c){ SL[c.dataset.slclear][c.dataset.k]=new Set(); render(); }
});

const PCFG={displayModeBar:false,responsive:true};
function gauge(el, value, max, color, suffix, steps, display){
  el.style.position='relative';

  Plotly.newPlot(el,[{type:'indicator',mode:'gauge',value:Math.min(value,max),
    gauge:{axis:{range:[0,max],tickwidth:1,tickcolor:cssVar('--ink-3'),tickfont:{size:10,color:cssVar('--ink-3')},nticks:5,ticks:'outside'},bar:{color,thickness:.32},bgcolor:cssVar('--line-2'),borderwidth:0,steps:steps||[]}}],

}

  if(financeVisible()) gauge(el.querySelector('#g2'),isFinite(k.runway)?k.runway:24,24,colorFor(k.runwayCls),'',[{range:[0,6],color:cssVar('--crit-soft')},{range:[6,12],color:cssVar('--warn-soft')},{range:[12,24],color:cssVar('--good-soft')}],isFinite(k.runway)?k.runway.toFixed(1)+' mo':'∞');
  const avgR = S.interviews.length? Math.round(sum(S.interviews.map(readiness))/S.interviews.length):0;
  gauge(el.querySelector('#g3'),avgR,100,colorFor(readyCls(avgR)),'%',[{range:[0,70],color:cssVar('--crit-soft')},{range:[70,85],color:cssVar('--warn-soft')},{range:[85,100],color:cssVar('--good-soft')}]);
  const weeks=[]; for(let i=7;i>=0;i--) weeks.push(weekEnding(addDays(t,-7*i)));
  const perWeek = weeks.map(w=>S.apps.filter(a=>a.applied && weekEnding(a.applied)===w).length);
  let cum=0; const cumul=perWeek.map(v=>cum+=v);
  Plotly.newPlot(el.querySelector('#c1'),[
    {type:'bar',x:weeks.map(fmtD),y:perWeek,name:'Applications',marker:{color:acc},hovertemplate:'Week of %{x}<br>%{y} applications<extra></extra>'},
    {type:'scatter',mode:'lines+markers',x:weeks.map(fmtD),y:cumul,name:'Cumulative',line:{color:cssVar('--ink-2'),width:2},marker:{size:7},hovertemplate:'Cumulative %{y}<extra></extra>'}],
    {...plotBase(),showlegend:true,legend:{orientation:'h',y:1.15},height:240,yaxis:{...plotBase().yaxis,dtick:1}},PCFG);
  const stages=L.stage.map(s=>S.apps.filter(a=>a.stage===s).length);
  Plotly.newPlot(el.querySelector('#c2'),[{type:'bar',orientation:'h',y:L.stage.slice().reverse(),x:stages.slice().reverse(),marker:{color:L.stage.slice().reverse().map(s=>s==='Offer'?good:s==='Rejected'?cssVar('--idle'):acc)},hovertemplate:'%{y}: %{x}<extra></extra>'}],
    {...plotBase(),margin:{l:110,r:16,t:4,b:30},height:240,xaxis:{...plotBase().xaxis,dtick:1}},PCFG);
  const days=[...Array(7)].map((_,i)=>addDays(t,i));
  const counts=days.map(d=>S.tasks.filter(r=>r.status!=='Complete'&&r.due===d).length);
  Plotly.newPlot(el.querySelector('#c3'),[{type:'bar',x:['Overdue',...days.map(d=>parse(d).toLocaleDateString(undefined,{weekday:'short',day:'numeric'}))],y:[k.overdue,...counts],
    marker:{color:[crit,...counts.map((c,i)=>i===0?cssVar('--soon'):acc)]},hovertemplate:'%{x}: %{y} tasks<extra></extra>'}],{...plotBase(),height:220,yaxis:{...plotBase().yaxis,dtick:1}},PCFG);
  const cc=cashCalc();
  const lights=[
    ['Overdue tasks',k.overdue?'crit':'good',k.overdue?`${k.overdue} overdue`:'On schedule'],
    ['Recruiter follow-ups',S.recruiters.some(r=>r.status!=='Closed'&&r.next&&r.next<t)?'crit':S.recruiters.some(r=>r.next===t)?'warn':'good',`${S.recruiters.filter(r=>r.status!=='Closed'&&r.next&&r.next<=t).length} due or overdue`],
    ['Networking follow-ups',S.contacts.some(r=>r.next&&r.next<t)?'crit':S.contacts.some(r=>r.next===t)?'warn':'good',`${S.contacts.filter(r=>r.next&&r.next<=t).length} due or overdue`],
    ['Interview readiness',readyCls(avgR),`${avgR}% average`],
    ['Unemployment compliance',(()=>{const c=S.compliance.map(compliance);return c.some(x=>x.cls==='crit')?'crit':c.some(x=>x.cls==='warn')?'warn':'good'})(),`${S.compliance.filter(r=>compliance(r).cls==='good').length}/${S.compliance.length} weeks compliant`],
  ];
  if(financeVisible()){
    lights.push(['Budget',sum(expActive().map(e=>+e.actual||0))>sum(expActive().map(e=>+e.budget||0))?'warn':'good',`${fmtMoney(sum(expActive().map(e=>+e.actual||0)))} vs ${fmtMoney(sum(expActive().map(e=>+e.budget||0)))} plan (${mShort(effMonth())})`]);
    try{ const cal=cashCalendar(30); lights.push(['Cash calendar (30 days)',cal.firstZero?'crit':cal.firstFloor?'warn':'good',cal.firstZero?`Runs out ${fmtDY(cal.firstZero)}`:`Low point ${fmtMoney(cal.low.bal)} on ${fmtD(cal.low.date)}`]); const hi=healthInfo(); if(hi.set) lights.push(['Health coverage',hi.decided?'good':hi.daysLeft!=null&&hi.daysLeft<=14?'crit':'warn',hi.decided?hi.choice+(hi.firstPrem&&hi.firstPrem>=T()?' · first premium due '+fmtD(hi.firstPrem):''):hi.nextDl?`Decide by ${fmtDY(hi.nextDl)} (${hi.daysLeft} days)`:'Decision windows have closed']); }catch(e){ console.warn(e); }
    lights.push(['Cash runway',cc.cls,isFinite(cc.months)?`${cc.months.toFixed(1)} months · exhausts ${fmtDY(cc.exhaust)}`:'Income covers expenses']);
  }
  el.querySelector('#lights').innerHTML=lights.map(([n,c,m])=>`<li><span class="dot ${c}"></span><span><span class="t">${n}</span><div class="m">${m}</div></span><span class="pill ${c}">${c==='good'?'OK':c==='warn'?'Watch':'Critical'}</span></li>`).join('');
};

/* ---- 2. Daily ---- */
function actionItems(){
  const t=T(), wk=addDays(t,7);
  const open=S.tasks.filter(r=>r.status!=='Complete');
  const li=(cls,n,title,meta,d,go)=>({cls,n,title,meta,d,go});
  return [
    {n:1,label:'Tasks due today (and overdue)',items:[...(benefitInfo().active&&benefitInfo().nextCert===t?[li('p1',1,'Certify this week\'s unemployment claim',`${benefitInfo().weeksLeft} week${benefitInfo().weeksLeft===1?'':'s'} of benefits left · log work-search activities first${financeVisible()&&claimWeekEst(weekEnding(addDays(t,-7))).rows.length?` · report ${fmtMoney(claimWeekEst(weekEnding(addDays(t,-7))).wages+claimWeekEst(weekEnding(addDays(t,-7))).deduct)} earnings/income`:''}`,'Today')]:[]),...open.filter(r=>r.due&&r.due<=t).sort((a,b)=>a.due.localeCompare(b.due)).map(r=>li('p1',1,r.task,`${r.category} · ${r.priority} · ${r.progress||0}%`,r.due<t?`Overdue ${-diffDays(r.due,t)}d`:'Today','tasks:tasks:'+r.id))]},
    {n:1,label:'Deadlines — health coverage, offers, cash',items:(()=>{ const out=[]; if(!financeVisible()) return out; const hi=healthInfo(); if(hi.set&&!hi.decided&&hi.nextDl&&hi.daysLeft<=21) out.push(li('p1',1,'Decide on health coverage (COBRA or Marketplace)',`COBRA election by ${fmtDY(hi.cobraBy)} · Marketplace by ${fmtDY(hi.mktBy)}`,hi.daysLeft+'d','income::')); if(hi.firstPrem&&hi.firstPrem>=t&&diffDays(hi.firstPrem,t)<=14) out.push(li('p1',1,'Pay the first COBRA premium',`Due ${fmtDY(hi.firstPrem)} — coverage does not start without it`,diffDays(hi.firstPrem,t)+'d','income::'));
      (S.offers||[]).filter(o=>['Considering','Negotiating'].includes(o.status)&&o.expires&&String(o.expires).slice(0,10)>=t&&diffDays(String(o.expires).slice(0,10),t)<=7).forEach(o=>out.push(li('p1',1,`Respond to the ${o.company} offer`,`Expires ${fmtDY(o.expires)} · ${fmtMoney(Math.round(offerCalc(o).recurring))}/yr total value`,diffDays(String(o.expires).slice(0,10),t)+'d','offers:offers:'+o.id)));
      try{ const cal=cashCalendar(14); if(cal.firstZero) out.push(li('p1',1,'Cash runs out in the next 14 days',`Balance goes below zero ${fmtDY(cal.firstZero)} — move a bill or call the lender`,fmtD(cal.firstZero),'income::')); }catch(e){} return out; })()},
    {n:2,label:'Tasks due within 7 days',items:open.filter(r=>r.due>t&&r.due<=wk).sort((a,b)=>a.due.localeCompare(b.due)).map(r=>li('p2',2,r.task,`${r.category} · ${r.priority}`,fmtD(r.due),'tasks:tasks:'+r.id))},
    {n:3,label:'Recruiter follow-ups',items:S.recruiters.filter(r=>r.status!=='Closed'&&r.next&&r.next<=wk).sort((a,b)=>a.next.localeCompare(b.next)).map(r=>li('p3',3,`Follow up with ${r.name}`,`${r.agency||''} · ${r.status}${r.notes?' · '+r.notes:''}`,r.next<t?`Overdue ${-diffDays(r.next,t)}d`:r.next===t?'Today':fmtD(r.next),'recruiters:recruiters:'+r.id))},
    {n:4,label:'Networking follow-ups',items:S.contacts.filter(r=>r.next&&r.next<=wk).sort((a,b)=>a.next.localeCompare(b.next)).map(r=>li('p4',4,`${r.method||'Contact'} ${r.person}`,`${r.title||''}, ${r.company||''} · ${r.status}`,r.next<t?`Overdue ${-diffDays(r.next,t)}d`:r.next===t?'Today':fmtD(r.next),'network:contacts:'+r.id))},
    {n:5,label:'Creditor calls & hardship follow-ups',items:financeVisible()?hsActive().filter(h=>(h.next_followup&&h.next_followup<=wk)||(h.status==='To call')).sort((a,b)=>String(a.next_followup||'9999').localeCompare(String(b.next_followup||'9999'))).map(h=>{const st=hsFollowState(h);return li('p2',5,`${h.status==='To call'?'Call':'Follow up with'} ${h.entity}`,`${h.type} · ${h.status}${h.program?' · '+h.program:''}${h.phone?' · '+h.phone:''}${h.reference?' · ref '+h.reference:''}`,st.label)}):[]},
    {n:6,label:'Payments due (credit cards & loans)',items:financeVisible()?debtsActive().filter(d=>debtPaymentPending(d)&&String(d.due_date).slice(0,10)<=wk).sort((a,b)=>String(a.due_date).localeCompare(String(b.due_date))).map(d=>{const st=debtDueState(d);return li('p1',5,`Pay ${d.name} — ${fmtMoney(debtPlanned(d))} (min ${fmtMoney(d.minimum_payment)})`,`${d.type}${d.autopay?' · autopay on':''}${d.issuer?' · '+d.issuer:''}`,st.label)}):[]},
    {n:7,label:'Interview preparation',items:S.interviews.filter(r=>r.outcome==='Pending'&&r.date>=t).sort((a,b)=>a.date.localeCompare(b.date)).map(r=>{const s=readiness(r);return li('p5',5,`Prep: ${r.company} — ${r.stage} (${r.type})`,`Readiness ${s}% · weakest: ${['research','star','technical','leadership','questions'].reduce((a,b)=>r[a]<=r[b]?a:b)}`,`${diffDays(r.date,t)===0?'Today':'in '+diffDays(r.date,t)+'d'}`,'ready:interviews:'+r.id)})},
  ];

function actionListHTML(groups){

R.daily = el => {

/* ---- 3. Tasks ---- */

const TASK_DEFS=()=>[{k:'health',label:'Health',opts:TASK_HEALTH,get:r=>taskState(r).label},{k:'status',label:'Status',opts:L.status},{k:'priority',label:'Priority',opts:L.priority},{k:'category',label:'Category'},{k:'duewin',label:'Due',opts:['Past due','Today','Next 7 days','Next 30 days','Later','No due date'],get:dueWindow},{k:'owner',label:'Owner'}];

    {k:'ref',label:'Task ID',type:'ro',cls:'id'},{k:'category',label:'Category',type:'select',opts:L.category},{k:'task',label:'Task',type:'text',w:220},{k:'subtask',label:'Subtask',type:'text',w:200},
    {k:'start',label:'Start',type:'date'},{k:'due',label:'Due',type:'date'},{k:'priority',label:'Priority',type:'select',opts:L.priority},{k:'status',label:'Status',type:'select',opts:L.status},
    {k:'owner',label:'Owner',type:'text',w:80},{k:'notes',label:'Notes',type:'text',w:200},{k:'progress',label:'Progress %',type:'number',min:0,max:100},
    {k:'_',label:'Health',type:'ro',fmt:r=>{const s=taskState(r);return `<span class="pill ${s.cls}">${s.label}</span>`}}];

  <div class="legend"><span><i style="background:var(--good)"></i>Complete</span><span><i style="background:var(--warn)"></i>In Progress</span><span><i style="background:var(--crit)"></i>Overdue / Blocked</span><span><i style="background:var(--soon)"></i>Due Today / Soon (≤3 days)</span><span><i style="background:var(--wait)"></i>Waiting</span><span><i style="background:var(--idle)"></i>Not Started</span></div></div>`;
  bindTable(el,'tasks',()=>({ref:nextRef('tasks'),category:'Applications',task:'New task',subtask:'',start:T(),due:addDays(T(),7),priority:'Medium',status:'Not Started',owner:'Me',notes:'',progress:0}));

/* ---- 4. Gantt ---- */
R.gantt = el => {
  const {rows:fr}=applySlicers('tasks',TASK_DEFS(),S.tasks);
  el.innerHTML=slicerHTML('tasks',TASK_DEFS(),S.tasks)+`<div class="card"><h3>Timeline <span class="hint">bars span start → due; dashed line is today; bar fill shows progress</span></h3><div id="gantt" class="chart tall"></div>
  <div class="legend"><span><i style="background:var(--good)"></i>Complete</span><span><i style="background:var(--warn)"></i>In Progress</span><span><i style="background:var(--crit)"></i>Overdue</span><span><i style="background:var(--idle)"></i>Not Started</span></div></div>`;
  const rows=fr.filter(r=>r.start&&r.due).slice().sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  if(!rows.length){ el.querySelector('#gantt').innerHTML='<div class="empty">Add tasks with start and due dates to see the timeline.</div>'; return; }
  const col={good:cssVar('--good'),warn:cssVar('--warn'),crit:cssVar('--crit'),idle:cssVar('--idle')};
  const y=rows.map(r=>`${r.ref} · ${r.task}`);
  const dur=r=>Math.max(1,diffDays(r.due,r.start)+1)*DAY;
  const base=rows.map(r=>r.start);
  const full={type:'bar',orientation:'h',y,x:rows.map(dur),base,marker:{color:rows.map(r=>col[ganttColor(r)]),opacity:.35},hovertemplate:rows.map(r=>`<b>${esc(r.task)}</b><br>${fmtD(r.start)} → ${fmtD(r.due)}<br>${r.status} · ${r.progress||0}%<extra></extra>`),width:.55};
  const prog={type:'bar',orientation:'h',y,x:rows.map(r=>dur(r)*(r.status==='Complete'?1:(+r.progress||0)/100)),base,marker:{color:rows.map(r=>col[ganttColor(r)])},hoverinfo:'skip',width:.55};
  const t=T();
  Plotly.newPlot(el.querySelector('#gantt'),[full,prog],{...plotBase(),barmode:'overlay',height:Math.max(300,60+rows.length*44),margin:{l:280,r:20,t:10,b:40},
    xaxis:{type:'date',gridcolor:cssVar('--line-2'),range:[addDays(t,-14),addDays(t,21)],tickformat:'%b %d'},yaxis:{autorange:'reversed',automargin:true},
    shapes:[{type:'line',x0:t,x1:t,y0:0,y1:1,yref:'paper',line:{color:cssVar('--crit'),width:1.5,dash:'dash'}}],
    annotations:[{x:t,y:1.02,yref:'paper',text:'Today',showarrow:false,font:{color:cssVar('--crit'),size:11}}]},PCFG);
};

  const cls=r=>r.stage==='Offer'?'st-good':r.stage==='Rejected'||r.status==='Closed'?'st-idle':r.status==='Waiting'?'st-wait':['Panel Interview','Final Interview','Hiring Manager'].includes(r.stage)?'st-warn':'st-info';

  const stale=staleApps(), mf=missingFollow();

/* ---- match an event to an existing application ---- */
const gmTok=s=>new Set(String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>1&&!['the','and','of','for','a','an','in','to','sr','senior','jr','i','ii','iii','remote','onsite','hybrid','position','role','with'].includes(w)));
const gmSim=(a,b)=>{ const A=gmTok(a),B=gmTok(b); if(!A.size||!B.size) return 0; let n=0; A.forEach(w=>{ if(B.has(w)) n++; }); return n/Math.min(A.size,B.size); };
function gmCoHit(app,ev){ const ac=normCo(app.company); if(!ac) return false; return [ev.company,ev.agency,ev.client].filter(Boolean).map(normCo).some(k=>k.length>=3&&(ac.includes(k)||k.includes(ac))); }
const gmDigits=s=>String(s||'').replace(/\D/g,'');
function gmMatch(ev){
  const led=(S.emailSync||[]).find(x=>x.thread_id===ev.threadId&&x.application_id); if(led){ const a=S.apps.find(x=>x.id===led.application_id); if(a) return a; }
  const byEv=S.apps.find(a=>(a.evidence||[]).some(e=>e.thread_id===ev.threadId)); if(byEv) return byEv;
  const live=S.apps.filter(a=>!/^Duplicate/i.test(a.email_status||''));
  if(ev.req){ const d=gmDigits(ev.req); const r=live.find(a=>d.length>=3&&(gmDigits(a.req_id)===d||gmDigits(a.position).includes(d))&&(gmCoHit(a,ev)||!ev.company)); if(r) return r; }
  const cands=live.filter(a=>gmCoHit(a,ev)).map(a=>({a,s:gmSim(a.position,ev.title)})).sort((x,y)=>y.s-x.s);
  if(cands.length&&(cands[0].s>=0.5||(!ev.title&&cands.length===1))) return cands[0].a;
  return null;
}

/* ---- turn events into proposals ---- */
function gmPropose(events){
  const out=[];
  for(const ev of events){
    if(ev.type==='skip'){ out.push({kind:'skip',ev}); continue; }
    const app=gmMatch(ev); const evd={thread_id:ev.threadId,date:ev.date,subject:String(ev.subject||'').slice(0,140),from:ev.contactEmail||'',kind:ev.type,...(ev.src==='outlook'?{src:'outlook',url:ev.webLink||''}:{})};
    if(app){ const p={}; const fill=(k,v)=>{ if(v&&!String(app[k]||'').trim()) p[k]=v; };
      fill('location',ev.location); fill('req_id',ev.req); fill('job_url',ev.url); fill('contact_email',ev.contactEmail); fill('apply_method',ev.method);
      if(ev.contactEmail&&!GM_NOREPLY.test(ev.contactEmail)){ const r=String(app.recruiter||'').trim(), nv=[ev.contact,'('+ev.contactEmail+')'].filter(Boolean).join(' '); if((!r||/^(n\/a|self|job board|company job site)$/i.test(r))&&nv!==r) p.recruiter=nv; }
      if(ev.status&&(ES_RANK[ev.status]||0)>(ES_RANK[app.email_status]||0)) p.email_status=ev.status;
      const ns=ES_STAGE[ev.status]; if(ns==='Rejected'&&app.stage!=='Rejected'){ p.stage='Rejected'; p.status='Closed'; } else if(ns&&STAGE_ORDER.indexOf(ns)>STAGE_ORDER.indexOf(app.stage)) p.stage=ns;
      const has=(app.evidence||[]).some(e=>e.thread_id===ev.threadId);
      if(!Object.keys(p).length&&has) { out.push({kind:'current',ev,app}); continue; }
      p.evidence=[...(app.evidence||[]).filter(e=>e.thread_id!==ev.threadId),evd];
      out.push({kind:'update',ev,app,patch:p,checked:true});
    } else if(ev.type==='receipt'||ev.type==='submission'){
      const rec={company:ev.company||'',position:ev.title||'',salary:ev.rate?('Rate: '+ev.rate):'',location:ev.location||'',source:ev.method==='LinkedIn Easy Apply'?'LinkedIn':ev.method==='Company website/ATS'?'Company Website':'Recruiter',applied:ev.date,stage:ES_STAGE[ev.status]&&ES_STAGE[ev.status]!=='Rejected'?ES_STAGE[ev.status]:(ev.status==='Rejected'?'Rejected':'Applied'),
        recruiter:[ev.contact,ev.contactEmail&&!GM_NOREPLY.test(ev.contactEmail)?'('+ev.contactEmail+')':''].filter(Boolean).join(' ')||'',next:'',status:ev.status==='Rejected'?'Closed':'Active',
        notes:`Added by ${ev.src==='outlook'?'Outlook':'Gmail'} sync`+(ev.confidence!=='high'?' — Needs Review: '+[!ev.company&&'company',!ev.title&&'job title'].filter(Boolean).join(', ')+' not found in the email':''),req_id:ev.req||null,job_url:ev.url||null,contact_email:ev.contactEmail||null,apply_method:ev.method||null,email_status:ev.status,evidence:[evd],email_synced_at:new Date().toISOString()};
      out.push({kind:'new',ev,rec,checked:ev.confidence!=='low'});
    } else out.push({kind:'review',ev,checked:false});
  }
  return out;
}

/* ---- run a sync ---- */
async function gmRun(progress){
  const me=(await gmApi('profile')).emailAddress.toLowerCase(); GM.account=me;
  if(gmCfg().account!==me) await db.saveSettings({gmail:{...gmCfg(),account:me}});
  const since=gmQueryDate(gmSince()); const ids=new Set();
  for(let i=0;i<GM_QUERIES.length;i++){ progress&&progress(`Searching your mail (${i+1}/${GM_QUERIES.length})…`); let page=null, n=0;
    do{ const r=await gmApi('threads',{q:`after:${since} ${GM_QUERIES[i]} ${GM_EXCL}`,maxResults:'100',...(page?{pageToken:page}:{})}); (r.threads||[]).forEach(t=>ids.add(t.id)); page=r.nextPageToken; n++; }while(page&&n<4); }
  const ign=new Set((S.emailSync||[]).filter(x=>x.decision==='ignored').map(x=>x.thread_id));
  const list=[...ids].filter(id=>!ign.has(id)).slice(0,400); const events=[]; let done=0;
  const worker=async()=>{ while(list.length){ const id=list.shift(); try{ const th=await gmApi('threads/'+id,{format:'full'}); events.push(gmClassify(th,me)); }catch(e){ if(/expired|sign-in/i.test(e.message)) throw e; events.push({threadId:id,type:'skip',why:'Could not read: '+e.message}); } done++; progress&&progress(`Reading ${done} of ${done+list.length} conversations…`); } };
  await Promise.all([worker(),worker(),worker(),worker()]);
  return {me,scanned:ids.size,ignored:ign.size,props:gmPropose(events.sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))))};
}
async function gmLedger(rows){ if(!rows.length) return; rows=rows.map(r=>({workspace_id:WS?WS.id:null,...r}));
  if(MODE==='demo'){ S.emailSync=S.emailSync||[]; rows.forEach(r=>{ const i=S.emailSync.findIndex(x=>x.thread_id===r.thread_id); if(i>=0) S.emailSync[i]={...S.emailSync[i],...r}; else S.emailSync.push(r); }); demoSave(); return; }
  const {error}=await sb.from('email_sync').upsert(rows,{onConflict:'workspace_id,thread_id'}); if(error) throw error;
  rows.forEach(r=>{ const i=(S.emailSync||[]).findIndex(x=>x.thread_id===r.thread_id); if(i>=0) S.emailSync[i]={...S.emailSync[i],...r}; else (S.emailSync=S.emailSync||[]).push(r); }); }

R.analytics = el => {
