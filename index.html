  const {rows}=applySlicers('analytics',defs,S.apps);
  const pivot=(key,order)=>{ const m={}; rows.forEach(r=>{const k=key(r)||'(blank)'; m[k]=(m[k]||0)+1;}); const keys=order?order.filter(k=>m[k]!=null):Object.keys(m).sort(); return keys.map(k=>[k,m[k]]); };
  const pv=(title,data,fmtK)=>`<div class="card span6"><h3>${title}</h3><div class="tblwrap"><table class="tbl pivot"><thead><tr><th>${title.replace('Applications by ','')}</th><th style="text-align:right">Count</th><th style="text-align:right">Share</th></tr></thead><tbody>${data.map(([k,v])=>`<tr><td>${esc(fmtK?fmtK(k):k)}</td><td class="num">${v}</td><td class="num">${rows.length?Math.round(v/rows.length*100):0}%</td></tr>`).join('')||'<tr><td colspan="3" class="empty">No data</td></tr>'}</tbody><tfoot><tr><td>Total</td><td class="num">${rows.length}</td><td class="num">100%</td></tr></tfoot></table></div><div class="chart" id="pc-${title.replace(/\W/g,'')}" style="min-height:200px"></div></div>`;
  const bySource=pivot(r=>r.source,L.source), byStage=pivot(r=>r.stage,L.stage), byCo=pivot(r=>r.company), byMonth=pivot(r=>monthKey(r.applied));
  el.innerHTML=slicerHTML('analytics',defs,S.apps)+`<div class="grid g12">${goalsCardHTML('span4')}<div class="card span8"><h3>Weekly goals vs. actuals <span class="hint">last 8 weeks · dotted lines are your targets</span></h3><div id="goalChart" class="chart" style="min-height:260px"></div></div>
    <div class="card span12" style="padding-bottom:4px"><h3>What's working <span class="hint">response = any reply or progress past Applied · interview = an interview or an interview stage · all applications, not the filters above</span></h3></div>
    ${effTable('job source',a=>a.source)}${effTable('apply method',a=>a.apply_method)}${effTable('résumé version',a=>a.resume_version)}
    ${pv('Applications by Source',bySource)}${pv('Applications by Stage',byStage)}${pv('Applications by Company',byCo)}${pv('Applications by Month',byMonth,k=>k==='(blank)'?k:monthLabel(k))}</div>`;
  const acc=cssVar('--accent');
  const bar=(id,data,horizontal,fmtK)=>Plotly.newPlot(el.querySelector('#pc-'+id),[{type:'bar',orientation:horizontal?'h':'v',[horizontal?'y':'x']:data.map(d=>fmtK?fmtK(d[0]):d[0]),[horizontal?'x':'y']:data.map(d=>d[1]),marker:{color:acc},hovertemplate:'%{'+(horizontal?'y':'x')+'}: %{'+(horizontal?'x':'y')+'}<extra></extra>'}],{...plotBase(),height:200,margin:{l:horizontal?120:40,r:10,t:6,b:34},[horizontal?'xaxis':'yaxis']:{...plotBase().yaxis,dtick:1}},PCFG);
  goalsChart(el.querySelector('#goalChart'));
  bar('ApplicationsbySource',bySource,true); bar('ApplicationsbyStage',byStage,true); bar('ApplicationsbyCompany',byCo,true); bar('ApplicationsbyMonth',byMonth,false,k=>k==='(blank)'?k:monthLabel(k));
};

/* ---- 7. Interviews ---- */
R.interviews = el => {
  const t=T(), wk=addDays(t,7);
  const defs=[{k:'stage',label:'Interview Stage',opts:L.intStage},{k:'outcome',label:'Outcome',opts:L.outcome},{k:'type',label:'Type',opts:L.intType},{k:'when',label:'When',opts:['Upcoming','Today','Past','No date'],get:r=>!r.date?'No date':r.date>T()?'Upcoming':r.date===T()?'Today':'Past'},{k:'company',label:'Company'}];
  const {rows,filtered}=applySlicers('interviews',defs,S.interviews);
  if(SEL_INT&&!S.interviews.some(i=>i.id===SEL_INT)) SEL_INT=null;
  const up=S.interviews.filter(i=>i.date&&i.date>=t&&(i.outcome||'Pending')==='Pending');
  const m={up:up.length,week:up.filter(i=>i.date<=wk).length,avg:up.length?Math.round(sum(up.map(readiness))/up.length):0,weak:up.filter(i=>readiness(i)<CFG.readyGreen).length,unl:S.interviews.filter(i=>!intApp(i)).length};
  const cols=[{k:'ref',label:'ID',type:'ro',cls:'id'},{k:'company',label:'Company',type:'text',w:170},{k:'position',label:'Position',type:'text',w:190},{k:'date',label:'Interview Date',type:'date'},{k:'time',label:'Time',type:'text',w:80},{k:'stage',label:'Stage',type:'select',opts:L.intStage},{k:'type',label:'Interview Type',type:'select',opts:L.intType},{k:'interviewer',label:'Interviewer',type:'text',w:180},{k:'outcome',label:'Outcome',type:'select',opts:L.outcome},{k:'notes',label:'Notes',type:'text',w:200},
    {k:'_app',label:'Application',type:'ro',fmt:r=>{const a=intApp(r);return a?`<a href="#" data-go="apps:apps:${a.id}" title="${esc(a.company+' — '+(a.position||''))}${r.app_id?'':' (matched by company)'}">${esc(a.ref)}</a>`:'<span style="opacity:.45" title="Edit the interview to link it to an application">not linked</span>'}},
    {k:'_',label:'Readiness',type:'ro',fmt:r=>{const s=readiness(r);return `<span class="pill ${readyCls(s)}">${s}%</span>`}},{k:'__',label:'When',type:'ro',cls:'num',fmt:r=>{if(!r.date) return '—';const d=diffDays(r.date,T());return d===0?'Today':d>0?`in ${d}d`:`${-d}d ago`}},
    {k:'_lk',label:'Join',type:'ro',fmt:r=>/^https?:\/\//i.test(r.link||'')?`<a class="btn ra" href="${esc(r.link)}" target="_blank" rel="noopener">Join ↗</a>`:(r.link?esc(r.link):'—')}];
  const cls=r=>r.outcome==='Offer'||r.outcome==='Advanced'?'st-good':r.outcome==='Rejected'?'st-idle':r.date<T()?'st-warn':'st-info';
  const card=(l,v,c)=>`<div class="kpi ${c}"><div class="l">${l}</div><div class="v">${v}</div></div>`;
  el.innerHTML=`<div class="kpis" style="margin-bottom:16px">${card('Upcoming interviews',m.up,'info')}${card('In the next 7 days',m.week,m.week?'warn':'good')}${card('Avg readiness (upcoming)',m.up?m.avg+'%':'—',m.up?readyCls(m.avg):'info')}${card('Upcoming, not yet ready',m.weak,m.weak?'crit':'good')}</div>`+
    (m.unl?`<div class="banner info" style="margin-bottom:12px">${m.unl} interview${m.unl===1?' is':'s are'} not linked to an application — open it with <b>Edit</b> and pick the application so stage changes flow to the Job Applications CRM.</div>`:'')+
    calBarHTML()+slicerHTML('interviews',defs,S.interviews)+`<div class="card">${tableHTML('interviews',rows,cols,{rowCls:cls,addLabel:'Add interview',filter:filtered,rec:'interviews',addModal:true,selId:SEL_INT,rowActs:r=>`<button type="button" class="btn ra" data-qa="prep:interviews:${r.id}" title="Open this interview on the Readiness Scorecard">Prep</button>${calActs(r)}`})}<div class="note">Click a row to select it — the Interview Readiness Scorecard opens on the selected interview. Changing Stage or Outcome moves the linked application forward (Offer, or Rejected → closed).</div></div>`;
  bindTable(el,'interviews',()=>REC.interviews.blank(),(row,k,v)=>{ if(['stage','outcome','date','time'].includes(k)) setTimeout(()=>guarded(()=>syncAppFromInterview(row),null),0); return null; });
  bindCalBar(el);
  const tb=el.querySelector('[data-tbl=interviews]'); if(tb) tb.addEventListener('click',e=>{ if(e.target.closest('input,select,button,a,textarea')) return; const tr=e.target.closest('tr[data-rid]'); if(tr&&SEL_INT!==tr.dataset.rid){ SEL_INT=tr.dataset.rid; render(true); } });
};

/* ---- 8. Readiness ---- */
const RD={show:'upcoming'};
const RD_TIPS={research:'Research the company, the role, recent news and your interviewers on LinkedIn.',star:'Write 3–5 STAR stories mapped to the job description’s top requirements.',technical:'Review the tools, systems and domain topics the posting lists; prepare one concrete example for each.',leadership:'Prepare examples of leading through change, conflict and a hard decision — with results.',questions:'Prepare 3–5 thoughtful questions for each interviewer.'};
R.ready = el => {
  const cats=[['research','Research'],['star','STAR Stories'],['technical','Technical Preparation'],['leadership','Leadership Examples'],['questions','Questions Prepared']];
  const t=T(), all=S.interviews.slice();
  const up=all.filter(i=>i.date&&i.date>=t&&(i.outcome||'Pending')==='Pending').sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const rest=all.filter(i=>!up.includes(i)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  if(SEL_INT&&!all.some(i=>i.id===SEL_INT)) SEL_INT=null;
  const sel=all.find(i=>i.id===SEL_INT)||up[0]||rest[0];
  const list=(RD.show==='upcoming'?up:RD.show==='past'?rest:[...up,...rest]).filter(i=>i!==sel);
  const sliders=i=>cats.map(([k,l])=>`<div class="score-row"><label for="${i.id}-${k}">${l} <span style="color:var(--ink-3)">20%</span></label><input id="${i.id}-${k}" type="range" min="0" max="100" step="5" value="${i[k]}" data-id="${i.id}" data-k="${k}" ${canEdit()?'':'disabled'}><span class="sv">${i[k]}</span></div>`).join('');
  const when=i=>{ if(!i.date) return 'no date'; const d=diffDays(i.date,t); return `${fmtD(i.date)}${i.time?' '+esc(i.time):''} · ${d===0?'today':d>0?'in '+d+'d':-d+'d ago'}`; };
  const big=i=>{ const s=readiness(i), c=readyCls(s), a=intApp(i), weak=cats.filter(([k])=>i[k]<CFG.readyGreen).sort((x,y)=>i[x[0]]-i[y[0]]);
    return `<div class="card span12 rd-sel"><h3>${esc(i.company)}${i.position?' — '+esc(i.position):''} <span class="hint">${esc(i.ref||'')} · ${esc(i.stage)} · ${when(i)} · ${esc(i.type||'')} · ${esc(i.outcome||'Pending')}</span><span style="flex:1"></span>${rowActsHTML('interviews',i)}</h3>
      <div class="rd-grid"><div>
        <div class="bigstat"><span class="v" style="color:var(--${c})">${s}%</span><span class="u">overall readiness</span><span class="pill ${c}" style="margin-left:auto">${c==='good'?'Ready':c==='warn'?'Needs work':'Not ready'}</span></div>
        <div class="bar" style="margin-bottom:10px"><i style="width:${s}%;background:var(--${c})"></i></div>${sliders(i)}
        <div class="note">Weighted score = Σ(category × 20%). Green ≥ ${CFG.readyGreen}%, yellow ${CFG.readyYellow}–${CFG.readyGreen-1}%, red below ${CFG.readyYellow}%.</div></div>
      <div class="rd-side"><div class="wsv-g">
        <div class="wsv-r"><span class="wsv-l">Application</span><span class="wsv-v">${a?`<a href="#" data-go="apps:apps:${a.id}">${esc(a.ref)} · ${esc(a.stage)} · ${esc(a.status)}</a>`:'not linked — use Edit to link it'}</span><span></span></div>
        <div class="wsv-r"><span class="wsv-l">Interviewer</span><span class="wsv-v">${esc(i.interviewer||'—')}</span><span></span></div>
        <div class="wsv-r"><span class="wsv-l">Join / location</span><span class="wsv-v">${linkOut('url',i.link)||'—'}</span><span></span></div>
        <div class="wsv-r"><span class="wsv-l">Calendar</span><span class="wsv-v">${calActs(i)||'add a date first'}${i.gcal_event_id||i.gcal_source_id?' <span class="pill good">on Google Calendar</span>':''}</span><span></span></div></div>
        ${weak.length?`<div class="rd-tips"><b>Focus next</b><ul>${weak.slice(0,3).map(([k,l])=>`<li><b>${l} (${i[k]}%)</b> — ${RD_TIPS[k]}</li>`).join('')}</ul></div>`:'<div class="rd-tips"><b>All areas are green.</b> Do a final read of your notes and the job posting.</div>'}
        <div class="field" style="margin-top:10px"><label for="rdNotes">Prep notes <span class="hint">saved to the interview</span></label><textarea id="rdNotes" rows="5" ${canEdit()?'':'readonly'}>${esc(i.notes||'')}</textarea></div></div></div></div>`; };
  const small=i=>{ const s=readiness(i), c=readyCls(s); return `<div class="card span6"><h3><a href="#" data-rdsel="${i.id}" title="Make this the selected interview">${esc(i.company)}</a> <span class="hint">${esc(i.stage)} · ${when(i)} · ${esc(i.outcome||'')}</span><span style="flex:1"></span><span class="pill ${c}">${s}%</span></h3>
    <div class="bar" style="margin-bottom:10px"><i style="width:${s}%;background:var(--${c})"></i></div>${sliders(i)}</div>`; };
  const chip=(k,l,n)=>`<button type="button" class="${RD.show===k?'on':''}" data-rdshow="${k}">${l}${n!=null?` <small>${n}</small>`:''}</button>`;
  el.innerHTML=!all.length?`<div class="card empty">Add an interview first — from the Interview Tracker, or with <b>+ Interview</b> on any row of the Job Applications CRM.</div>`:
    `<div class="card rd-bar"><label for="rdPick">Interview</label><select id="rdPick">${up.length?`<optgroup label="Upcoming">${up.map(i=>`<option value="${i.id}" ${i===sel?'selected':''}>${esc(i.company)} — ${esc(i.stage)} · ${fmtD(i.date)}</option>`).join('')}</optgroup>`:''}${rest.length?`<optgroup label="Past / decided">${rest.map(i=>`<option value="${i.id}" ${i===sel?'selected':''}>${esc(i.company)} — ${esc(i.stage)} · ${i.date?fmtD(i.date):'no date'}</option>`).join('')}</optgroup>`:''}</select>
      <span class="opts">${chip('upcoming','Upcoming',up.length)}${chip('past','Past',rest.length)}${chip('all','All',all.length)}</span>${canEdit()?'<button class="btn" data-recnew="interviews">+ Add interview</button>':''}</div>
    <div class="grid g12">${sel?big(sel):''}${list.map(small).join('')||`<div class="card span12 empty">No other ${RD.show==='all'?'':RD.show+' '}interviews.</div>`}</div>`;
  const pk=el.querySelector('#rdPick'); if(pk) pk.addEventListener('change',()=>{ SEL_INT=pk.value; render(); });
  el.querySelectorAll('[data-rdshow]').forEach(b=>b.addEventListener('click',()=>{ RD.show=b.dataset.rdshow; render(true); }));
  el.querySelectorAll('[data-rdsel]').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); SEL_INT=a.dataset.rdsel; render(); window.scrollTo(0,0); }));
  const nt=el.querySelector('#rdNotes'); if(nt&&sel) nt.addEventListener('change',()=>{ guarded(()=>db.update('interviews',sel.id,{notes:nt.value}),'Prep notes saved'); });
  el.querySelectorAll('input[type=range]').forEach(r=>{
    r.addEventListener('input',()=>{ r.nextElementSibling.textContent=r.value; });
    r.addEventListener('change',()=>{ guarded(()=>db.update('interviews',r.dataset.id,{[r.dataset.k]:+r.value})); render(true); });
  });
};

/* ---- 9. Recruiters ---- */
const qaLinks=r=>`${r.email?`<a class="btn ra" href="mailto:${esc(r.email)}" title="Email ${esc(r.email)}">✉</a>`:''}${r.phone?`<a class="btn ra" href="tel:${esc(String(r.phone).replace(/[^\d+]/g,''))}" title="Call ${esc(r.phone)}">☎</a>`:''}${/^https?:\/\//i.test(r.linkedin||'')?`<a class="btn ra" href="${esc(r.linkedin)}" target="_blank" rel="noopener" title="LinkedIn profile">in</a>`:''}`;
R.recruiters = el => {
  const t=T(), wk=addDays(t,7);
  const open=S.recruiters.filter(r=>r.status!=='Closed');
  const m={active:S.recruiters.filter(r=>['Active','Interviewing','Offer'].includes(r.status)).length,today:open.filter(r=>r.next===t).length,week:open.filter(r=>r.next>t&&r.next<=wk).length,over:open.filter(r=>r.next&&r.next<t).length};
  const defs=[{k:'status',label:'Recruiter Status',opts:L.recStatus},{k:'follow',label:'Follow-up',get:r=>followState(r.next,r.status==='Closed').label},{k:'linked',label:'Linked to',opts:['Applications','No applications'],get:r=>recApps(r).length?'Applications':'No applications'},{k:'agency',label:'Agency'},{k:'company',label:'Company'}];
  const {rows,filtered}=applySlicers('recruiters',defs,S.recruiters);
  const cols=[{k:'ref',label:'ID',type:'ro',cls:'id'},{k:'name',label:'Recruiter',type:'text',w:140},{k:'agency',label:'Agency',type:'text',w:140},{k:'company',label:'Company',type:'text',w:160},{k:'phone',label:'Phone',type:'text',w:110},{k:'email',label:'Email',type:'text',w:170},{k:'linkedin',label:'LinkedIn',type:'text',w:170},{k:'last',label:'Last Contact',type:'date'},{k:'next',label:'Next Follow-Up',type:'date'},{k:'status',label:'Status',type:'select',opts:L.recStatus},{k:'notes',label:'Notes',type:'text',w:200},
    {k:'_',label:'Follow-up',type:'ro',fmt:r=>{const s=followState(r.next,r.status==='Closed');return `<span class="pill ${s.cls}">${s.label}</span>`}},
    {k:'_lnk',label:'Applications',type:'ro',tfKind:'num',fmt:r=>{const a=recApps(r).length,i=recInts(r).length;return a||i?`<button type="button" class="btn ra" data-recv="recruiters:${r.id}" title="See the linked applications and interviews">${a} app${a===1?'':'s'}${i?` · ${i} int`:''}</button>`:'0'}}];
  const miss=missingRecruiters();
  const card=(l,v,c)=>`<div class="kpi ${c}"><div class="l">${l}</div><div class="v">${v}</div></div>`;
  el.innerHTML=`<div class="kpis" style="margin-bottom:16px">${card('Active recruiters',m.active,'info')}${card('Follow-ups due today',m.today,m.today?'warn':'good')}${card('Follow-ups due this week',m.week,'info')}${card('Overdue follow-ups',m.over,m.over?'crit':'good')}</div>`+
    (miss.length&&canEdit()?`<div class="banner info xl-banner"><b>${miss.length} recruiter${miss.length===1?'':'s'} named on your applications ${miss.length===1?'is':'are'} not in this CRM:</b> ${miss.slice(0,8).map(x=>`<span class="xl-chip">${esc(x.name)} <small>${x.apps.map(a=>esc(a.ref)).join(', ')}</small> <button type="button" class="btn ra" data-addrec="${esc(nm(x.name))}">+ Add</button></span>`).join('')}</div>`:'')+
    slicerHTML('recruiters',defs,S.recruiters)+`<div class="card">${tableHTML('recruiters',rows,cols,{rowCls:r=>'st-'+followState(r.next,r.status==='Closed').cls,addLabel:'Add recruiter',filter:filtered,rec:'recruiters',addModal:true,rowActs:r=>`${canEdit()?`<button type="button" class="btn ra" data-qa="touch:recruiters:${r.id}" title="Contacted today — Last contact becomes today, next follow-up in 7 days">✓</button>`:''}${qaLinks(r)}`})}
    <div class="note">An application is linked to a recruiter when its Recruiter field names them, or when it was made through their agency. <b>✓</b> logs a contact today and sets the next follow-up a week out; <b>View</b> shows every linked application and interview.</div></div>`;
  bindTable(el,'recruiters',()=>REC.recruiters.blank());
};

/* ---- 10. Networking ---- */
R.network = el => {
  const t=T(), wkStart=addDays(t,-7);
  const activeApp=a=>a.status!=='Closed'&&!['Rejected'].includes(a.stage);
  const opp=S.contacts.filter(c=>c.referral!=='None'&&!['Referral Asked','Referral Received'].includes(c.status)&&coApps(c.company).some(activeApp));
  const m={total:S.contacts.length,weekly:S.contacts.filter(r=>r.last&&r.last>wkStart&&r.last<=t).length,asked:S.contacts.filter(r=>['Referral Asked','Referral Received'].includes(r.status)).length,recv:S.contacts.filter(r=>r.status==='Referral Received').length,at:S.contacts.filter(c=>coApps(c.company).length).length};
  const defs=[{k:'status',label:'Status',opts:L.netStatus},{k:'referral',label:'Referral Potential',opts:L.referral},{k:'follow',label:'Follow-up',get:r=>followState(r.next,r.status==='Dormant').label},{k:'appl',label:'Applied there',opts:['Yes','No'],get:r=>coApps(r.company).length?'Yes':'No'},{k:'relationship',label:'Relationship'},{k:'company',label:'Company'}];
  const {rows,filtered}=applySlicers('network',defs,S.contacts);
  const cols=[{k:'ref',label:'ID',type:'ro',cls:'id'},{k:'person',label:'Person',type:'text',w:140},{k:'company',label:'Company',type:'text',w:160},{k:'title',label:'Title',type:'text',w:150},{k:'email',label:'Email',type:'text',w:170},{k:'relationship',label:'Relationship',type:'select',opts:L.relationship},{k:'referral',label:'Referral Potential',type:'select',opts:L.referral},{k:'last',label:'Last Contact',type:'date'},{k:'next',label:'Next Follow-Up',type:'date'},{k:'method',label:'Contact Method',type:'select',opts:L.method},{k:'status',label:'Status',type:'select',opts:L.netStatus},{k:'notes',label:'Notes',type:'text',w:200},
    {k:'_',label:'Follow-up',type:'ro',fmt:r=>{const s=followState(r.next,r.status==='Dormant');return `<span class="pill ${s.cls}">${s.label}</span>`}},
    {k:'_co',label:'Applied there',type:'ro',tfKind:'num',fmt:r=>{const a=coApps(r.company);return a.length?`<button type="button" class="btn ra" data-recv="contacts:${r.id}" title="${esc(a.map(x=>x.ref+' '+(x.position||'')).join(' · '))}">${a.length} app${a.length===1?'':'s'}</button>`:'0'}}];
  const card=(l,v,c)=>`<div class="kpi ${c}"><div class="l">${l}</div><div class="v">${v}</div></div>`;
  el.innerHTML=`<div class="kpis" style="margin-bottom:16px">${card('Total contacts',m.total,'info')}${card('Connections this week',m.weekly,m.weekly>=3?'good':'warn')}${card('Referrals asked',m.asked,'info')}${card('Referrals received',m.recv,m.recv?'good':'warn')}${card('Contacts where you applied',m.at,m.at?'good':'info')}</div>`+
    (opp.length&&canEdit()?`<div class="banner info xl-banner"><b>Referral opportunities —</b> you have an open application where these contacts work: ${opp.slice(0,8).map(c=>{const a=coApps(c.company).find(activeApp);return `<span class="xl-chip">${esc(c.person)} @ ${esc(c.company)} <small>${esc(a.ref)} ${esc(a.position||'')}</small> <button type="button" class="btn ra" data-qa="ref:contacts:${c.id}">Ask for referral</button></span>`}).join('')}</div>`:'')+
    slicerHTML('network',defs,S.contacts)+`<div class="card">${tableHTML('contacts',rows,cols,{rowCls:r=>'st-'+followState(r.next,r.status==='Dormant').cls,addLabel:'Add contact',filter:filtered,rec:'contacts',addModal:true,rowActs:r=>`${canEdit()?`<button type="button" class="btn ra" data-qa="touch:contacts:${r.id}" title="Contacted today — Last contact becomes today, next follow-up in 7 days">✓</button>`:''}${qaLinks(r)}`})}
    <div class="note"><b>Ask for referral</b> marks the contact Referral Asked and adds a follow-up task (due in 5 days) to the Master Task Tracker. <b>Applied there</b> counts your applications at the contact’s company.</div></div>`;
  bindTable(el,'contacts',()=>REC.contacts.blank());
};

/* ---- Work-search log: Ohio weekly-claim fields, extracted from the rest of the app with per-field sources ---- */
const US_STATES=['AL','AK','AZ','AR','CA','CO','CT','DE','DC','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY'];
const STATE_NAME={alabama:'AL',alaska:'AK',arizona:'AZ',arkansas:'AR',california:'CA',colorado:'CO',connecticut:'CT',delaware:'DE','district of columbia':'DC',florida:'FL',georgia:'GA',hawaii:'HI',idaho:'ID',illinois:'IL',indiana:'IN',iowa:'IA',kansas:'KS',kentucky:'KY',louisiana:'LA',maine:'ME',maryland:'MD',massachusetts:'MA',michigan:'MI',minnesota:'MN',mississippi:'MS',missouri:'MO',montana:'MT',nebraska:'NE',nevada:'NV','new hampshire':'NH','new jersey':'NJ','new mexico':'NM','new york':'NY','north carolina':'NC','north dakota':'ND',ohio:'OH',oklahoma:'OK',oregon:'OR',pennsylvania:'PA','rhode island':'RI','south carolina':'SC','south dakota':'SD',tennessee:'TN',texas:'TX',utah:'UT',vermont:'VT',virginia:'VA',washington:'WA','west virginia':'WV',wisconsin:'WI',wyoming:'WY'};
/* Reads only what the text says: "1 Riverside Plaza, Columbus, OH 43215" → street, city, state, ZIP.
   A city with no state stays without a state — nothing is guessed. */
function parseLocation(s){
  const raw=String(s||'').replace(/[()]/g,',').replace(/\s[—–]\s.*$/,'').replace(/\b(remote|on-?site|hybrid|in[- ]office|full[- ]time|part[- ]time|contract|\d+\s*days?\s*onsite)\b/gi,' ').replace(/\s+[-|/]\s+/g,',').replace(/\s{2,}/g,' ');
  const parts=raw.split(',').map(x=>x.trim().replace(/^[-–\s]+|[-–\s.]+$/g,'')).filter(x=>x&&!/coast|united states|^usa?$|nationwide|anywhere|^us$|midwest|^\d+%$/i.test(x));
  const o={address1:'',city:'',state:'',zip5:'',zip4:''};
  for(const p of parts){ let m;
    if((m=p.match(/^(\d{5})(?:-(\d{4}))?$/))){ o.zip5=m[1]; o.zip4=m[2]||''; continue; }
    if((m=p.match(/^([A-Za-z]{2})\s+(\d{5})(?:-(\d{4}))?$/)) && US_STATES.includes(m[1].toUpperCase())){ o.state=m[1].toUpperCase(); o.zip5=m[2]; o.zip4=m[3]||''; continue; }
    if((m=p.match(/^([A-Za-z ]+?)\s+(\d{5})(?:-(\d{4}))?$/)) && STATE_NAME[m[1].toLowerCase()]){ o.state=STATE_NAME[m[1].toLowerCase()]; o.zip5=m[2]; o.zip4=m[3]||''; continue; }
    if(/^[A-Za-z]{2}$/.test(p) && US_STATES.includes(p.toUpperCase())){ o.state=p.toUpperCase(); continue; }
    if(STATE_NAME[p.toLowerCase()]){ o.state=STATE_NAME[p.toLowerCase()]; continue; }
    if(/^\d+[A-Za-z]?\s+\S/.test(p) && !o.address1){ o.address1=p; continue; }
    if((m=p.match(/^(.+?)\s+([A-Z]{2})$/)) && US_STATES.includes(m[2])){ o.city=o.city||m[1]; o.state=m[2]; continue; }
    if(!o.city && /[a-z]/i.test(p)) o.city=p;
  }
  return o;
}
const normCo=s=>String(s||'').toLowerCase().replace(/\bc\/o\b.*$/,'').replace(/&/g,' and ').replace(/\b(inc|llc|l\.l\.c|ltd|corp|corporation|co|company|group|the|pllc|lp|llp)\b\.?/g,'').replace(/[^a-z0-9]/g,'');
const WS_ADDR=['address1','address2','city','state','zip5','zip4'];
/* every field the log keeps: [key, label, group]. "claim" = what the Ohio weekly claim asks for */
const WS_FIELDS=[
  ['date','d · Date of activity','claim'],['employer','Work search activity completed — entity applied to / contacted','claim'],['address1','Street address','claim'],['address2','Address line 2','claim'],['city','City','claim'],['state','State','claim'],['zip5','ZIP','claim'],['zip4','ZIP+4','claim'],
  ['method','b · Method','claim'],['position','c · Position applied for / activity explanation','claim'],['outcome','e · Outcome','claim'],
  ['end_client','End client (when submitted through an agency)','origin'],['channel','Source / channel (where it originated)','origin'],['contact','Recruiter / contact','origin'],['contact_email','Contact email','origin'],['contact_phone','Contact phone','origin'],['req_id','Job / requisition ID','origin'],['job_url','Job posting URL','origin'],['evidence','Supporting reference (email / confirmation)','origin'],
  ['type','Activity type (weekly tally)','rec'],['result','Outcome details','rec'],['reported_on','Reported on my weekly claim','rec'],['notes','Notes','rec']];
const WS_LABEL=Object.fromEntries(WS_FIELDS.map(f=>[f[0],f[1]]));
const WS_REQ=[['employer','Activity completed'],['address1','Street address'],['city','City'],['state','State'],['zip5','ZIP'],['method','Method'],['position','Position / explanation'],['date','Date'],['outcome','Outcome']];
const wsMissing=a=>WS_REQ.filter(([k])=>k==='zip5'?!/^\d{5}$/.test(String(a.zip5||'')):!String(a[k]??'').trim()).map(([,l])=>l);
const wsReadyPill=a=>{ const m=wsMissing(a); return m.length?`<span class="pill ${m.length>3?'crit':'warn'}" title="Needs Review — missing: ${esc(m.join(', '))}">Needs Review · ${m.length}</span>`:'<span class="pill good">Ready</span>'; };
const WS_SRC={apps:['Application','apps'],interviews:['Interview','interviews'],recruiters:['Recruiter','recruiters'],contacts:['Networking','contacts']};
const wsSrcRow=a=>a.source_kind&&S[a.source_kind]?S[a.source_kind].find(r=>r.id===a.source_id):null;
const wsSrcPill=a=>{ const r=wsSrcRow(a); return r?`<span class="pill info" title="Linked to ${WS_SRC[a.source_kind][0]} ${esc(r.ref||'')}">${esc(r.ref||WS_SRC[a.source_kind][0])}</span>`:(a.source_kind?'<span class="pill idle" title="The linked source record was deleted">source gone</span>':'<span class="pill idle">manual</span>'); };
const mapsUrl=a=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([a.employer,a.city,a.state].filter(Boolean).join(' '));
const EMAIL_RE=/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i, PHONE_RE=/(?:\+?1[\s.-]?)?\(?\b\d{3}\)?[\s.-]\d{3}[\s.-]\d{4}\b/;
const wsLinks=s=>String(s||'').split(/\s+·\s+|\s+\|\s+|\s+/).filter(x=>/^https?:\/\//.test(x));
/* the latest address you entered for each employer, with the record it came from */
function employerBook(){ const b={}; (S.activities||[]).slice().sort((x,y)=>String(y.updated_at||y.date||'').localeCompare(String(x.updated_at||x.date||''))).forEach(a=>{ const k=normCo(a.employer); if(k&&!b[k]&&(a.address1||a.city||a.zip5)) b[k]={ref:a.ref,...Object.fromEntries(WS_ADDR.map(f=>[f,a[f]||'']))}; }); return b; }

/* Extract a log entry from a record elsewhere in CareerShift. Every value comes from a field of that record
   (or your own earlier entry for the same employer); field_sources says which. Anything not stated stays blank. */
function wsExtract(kind,r,book){
  book=book||employerBook(); const rec={}, src={}, ref=r.ref||WS_SRC[kind][0];
  const put=(k,v,from)=>{ v=v==null?'':String(v).trim(); if(!v) return; rec[k]=v; src[k]=from; };
  const putLoc=(loc,from)=>{ const p=parseLocation(loc); ['address1','city','state','zip5','zip4'].forEach(f=>put(f,p[f],from)); };
  const fromText=(t,from)=>{ const e=String(t||'').match(EMAIL_RE); if(e&&!rec.contact_email) put('contact_email',e[0],from); const p=String(t||'').match(PHONE_RE); if(p&&!rec.contact_phone) put('contact_phone',p[0],from); };
  if(kind==='apps'){
    const co=String(r.company||'').trim(), co2=co.split(/\s+c\/o\s+/i);
    if(co2.length===2){ put('employer',co2[0],`${ref} · Company`); put('end_client',co2[1],`${ref} · Company (“c/o”)`); } else put('employer',co,`${ref} · Company`);
    put('position',r.position,`${ref} · Position`); put('date',r.applied&&String(r.applied).slice(0,10),`${ref} · Date applied`); put('channel',r.source,`${ref} · Job source`);
    rec.type='Application'; src.type=`${ref} · Application record`;
    const am={'Company website/ATS':'Online','LinkedIn Easy Apply':'Online','Job board':'Online','Email to recruiter':'Email','Email to employer':'Email','In person':'In person'}[r.apply_method];
    if(am&&L.wsMethod.includes(am)) put('method',am,`${ref} · Method = ${r.apply_method}`);
    const es=String(r.email_status||'');
    const out=r.stage==='Offer'||/offer/i.test(es)?'Job offer received':r.stage==='Rejected'||/reject/i.test(es)?'Not selected':['Recruiter Screen','Hiring Manager','Panel Interview','Final Interview'].includes(r.stage)?'Interview scheduled':(r.stage==='Applied'&&r.status!=='Closed'?'Application submitted — awaiting response':'');
    if(out&&L.wsOutcome.includes(out)) put('outcome',out,`${ref} · Stage = ${r.stage||''}${es?' / Email status = '+es:''}`);
    putLoc(r.location,`${ref} · Location`);
    put('contact',r.recruiter,`${ref} · Recruiter`); if(r.contact_email) put('contact_email',r.contact_email,`${ref} · Contact email`); fromText(r.recruiter,`${ref} · Recruiter`);
    put('req_id',r.req_id,`${ref} · Req / Job ID`); put('job_url',r.job_url,`${ref} · Job posting link`);
    const ev=[...(Array.isArray(r.evidence)?r.evidence:[]).filter(e=>e&&e.thread_id).map(e=>mailLink(e)),...(String(r.notes||'').match(/https:\/\/mail\.google\.com\/[^\s|]+/g)||[])];
    if(ev.length) put('evidence',[...new Set(ev)].join(' · '),`${ref} · Email evidence`);
  } else if(kind==='interviews'){
    put('employer',r.company,`${ref} · Company`); put('date',r.date&&String(r.date).slice(0,10),`${ref} · Interview date`);
    rec.type='Interview'; src.type=`${ref} · Interview record`;
    if(r.position) put('position',`${r.stage?r.stage+' interview':'Interview'} for ${String(r.position).trim()}`,`${ref} · Stage + Position`);
    const tm={Phone:'Phone',Video:'Video','On-site':'In person'}[r.type]; if(tm&&L.wsMethod.includes(tm)) put('method',tm,`${ref} · Type = ${r.type}`);
    const om={Pending:'Interviewed — awaiting decision',Advanced:'Advanced to next round',Rejected:'Not selected',Offer:'Job offer received',Withdrew:'Withdrew'}[r.outcome]; if(om&&L.wsOutcome.includes(om)) put('outcome',om,`${ref} · Outcome = ${r.outcome}`);
    put('contact',r.interviewer,`${ref} · Interviewer`); fromText(r.interviewer,`${ref} · Interviewer`);
    const app=(S.apps||[]).find(x=>normCo(x.company)&&normCo(x.company)===normCo(r.company));
    if(app){ const ar=app.ref||'application'; putLoc(app.location,`${ar} · Location (same company)`); put('req_id',app.req_id,`${ar} · Req / Job ID (same company)`); put('job_url',app.job_url,`${ar} · Job posting link (same company)`); put('channel',app.source,`${ar} · Job source (same company)`); }
  } else if(kind==='recruiters'){
    const org=String(r.agency||'').trim()||String(r.company||'').trim();
    put('employer',org,`${ref} · ${r.agency?'Agency':'Company'}`); if(r.agency&&r.company&&normCo(r.agency)!==normCo(r.company)) put('end_client',r.company,`${ref} · Company`);
    put('date',r.last&&String(r.last).slice(0,10),`${ref} · Last contact`); rec.type='Recruiter contact'; src.type=`${ref} · Recruiter record`; put('channel','Recruiter',`${ref} · Recruiter CRM`);
    put('contact',r.name,`${ref} · Name`); put('contact_email',r.email,`${ref} · Email`); put('contact_phone',r.phone,`${ref} · Phone`);
    if(r.name) put('position',`Recruiter contact: ${r.name}${org?', '+org:''}`,`${ref} · Name + Agency`);
  } else {
    put('employer',String(r.company||'').trim()||r.person,`${ref} · ${r.company?'Company':'Person'}`); put('date',r.last&&String(r.last).slice(0,10),`${ref} · Last contact`);
    rec.type='Networking'; src.type=`${ref} · Networking record`; put('channel','Networking',`${ref} · Networking CRM`); put('contact',r.person,`${ref} · Person`);
    const cm={Email:'Email',Phone:'Phone',Video:'Video',Coffee:'In person'}[r.method]; if(cm&&L.wsMethod.includes(cm)) put('method',cm,`${ref} · Contact method = ${r.method}`);
    if(r.person) put('position',`Networking contact: ${r.person}${r.title?', '+r.title:''}`,`${ref} · Person + Title`);
  }
  const known=book[normCo(rec.employer)]; if(known) WS_ADDR.forEach(f=>{ if(known[f]&&!rec[f]){ rec[f]=known[f]; src[f]=`${known.ref} · your earlier entry for this employer`; } });
  return {...rec,source_kind:kind,source_id:r.id,field_sources:src};
}
const wsFromSource=(kind,r,book)=>wsExtract(kind,r,book);
/* blanks this record could take from its linked source — never overwrites anything already there */
function wsRefreshPatch(a){
  const r=wsSrcRow(a); if(!r) return null; const x=wsExtract(a.source_kind,r), p={}, fs={...(a.field_sources||{})};
  WS_FIELDS.forEach(([k])=>{ if(k==='type') return; if(x[k]&&!String(a[k]??'').trim()){ p[k]=x[k]; fs[k]=x.field_sources[k]; } });
  return Object.keys(p).length?{...p,field_sources:fs}:null;
}
/* possible source records for an entry typed in by hand — same employer within the same claim week */
function wsLinkSuggestions(a){
  if(a.source_kind||!normCo(a.employer)) return []; const k=normCo(a.employer), w=weekEnding(a.date||T()), out=[];
  (S.apps||[]).forEach(r=>{ if(normCo(r.company)===k&&r.applied&&weekEnding(r.applied)===w) out.push({kind:'apps',r,why:`same employer, applied ${fmtD(r.applied)}`}); });
  (S.interviews||[]).forEach(r=>{ if(normCo(r.company)===k&&r.date&&weekEnding(r.date)===w) out.push({kind:'interviews',r,why:`same employer, interview ${fmtD(r.date)}`}); });
  return out.filter(c=>!(S.activities||[]).some(x=>x.source_kind===c.kind&&x.source_id===c.r.id));
}
/* duplicate check for a new entry: same linked source, or same employer + same date */
function wsFindDuplicate(o,exceptId){
  return (S.activities||[]).find(x=>x.id!==exceptId&&((o.source_kind&&x.source_kind===o.source_kind&&x.source_id===o.source_id)||(normCo(o.employer)&&normCo(x.employer)===normCo(o.employer)&&String(x.date||'').slice(0,10)===String(o.date||'').slice(0,10))));
}
function wsCandidates(){
  const since=String(S.settings.separationDate||'2000-01-01').slice(0,10), t=T(), acts=S.activities||[], book=employerBook(), out=[];
  const logged=(kind,r,a)=>acts.some(x=>(x.source_kind===kind&&x.source_id===r.id) || (!x.source_kind && normCo(x.employer) && normCo(x.employer)===normCo(a.employer) && weekEnding(x.date)===weekEnding(a.date)));
  const take=(kind,rows,dk)=>rows.forEach(r=>{ const d=r[dk]&&String(r[dk]).slice(0,10); if(!d||d<since||d>t) return; if(kind==='apps'&&/^duplicate/i.test(r.email_status||'')) return; const a=wsExtract(kind,r,book); if(!a.employer) return; if(!logged(kind,r,a)) out.push({kind,r,a}); });
  take('apps',S.apps||[],'applied'); take('interviews',S.interviews||[],'date'); take('recruiters',S.recruiters||[],'last'); take('contacts',S.contacts||[],'last');
  return out.sort((x,y)=>String(y.a.date).localeCompare(String(x.a.date)));
}
const wsCopy=(txt,label)=>navigator.clipboard?.writeText(txt).then(()=>toast((label||'Copied')+' copied')).catch(()=>toast('Select the text and copy it manually'));
function wsAsText(a){ return [`Work search activity completed: ${a.employer||''}`,`Location: ${[a.address1,a.address2].filter(Boolean).join(', ')}`,`City / State / ZIP: ${a.city||''}, ${a.state||''} ${a.zip5||''}${a.zip4?'-'+a.zip4:''}`,`b. Method: ${a.method||''}`,`c. Position / explanation: ${a.position||''}`,`d. Date: ${a.date?fmtDY(a.date):''}`,`e. Outcome: ${a.outcome||''}`].join('\n'); }
async function wsDelete(a){ if(!a||!canEdit()) return; if(!confirm(`Delete ${a.ref||'this activity'}${a.employer?' — '+a.employer:''} (${a.date?fmtDY(a.date):'no date'}) from the work-search log?${a.reported_on?'\n\nIt is marked as reported on your weekly claim — keep a copy (Export CSV) if you may need it as proof.':''}`)) return false;
  await guarded(async()=>{ await db.remove('activities',a.id); closeModal(); render(); },'Activity deleted'); return true; }

/* View — every field, where it came from, and what still needs review */
function wsViewModal(a){
  if(!a) return; const fs=a.field_sources||{}, miss=wsMissing(a), sugg=wsLinkSuggestions(a), rp=wsRefreshPatch(a), srow=wsSrcRow(a);
  const val=(k)=>{ const v=a[k]; if(v==null||String(v).trim()==='') return WS_REQ.some(r=>r[0]===k)?'<span class="wsv-nr">Needs Review — not available</span>':'<span class="wsv-na">—</span>';
    if(k==='date'||k==='reported_on') return esc(fmtDY(String(v).slice(0,10)));
    if(k==='job_url'||k==='evidence'){ const ls=wsLinks(v); return ls.length?ls.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener">${k==='evidence'?'Email '+(i+1):esc(u)}</a>`).join(' · ')+(ls.length<String(v).split(' · ').length?' · '+esc(String(v).split(' · ').filter(x=>!/^https?:/.test(x)).join(' · ')):''):esc(v); }
    if(k==='contact_email') return `<a href="mailto:${esc(v)}">${esc(v)}</a>`; if(k==='contact_phone') return `<a href="tel:${esc(String(v).replace(/[^\d+]/g,''))}">${esc(v)}</a>`;
    return esc(v); };
  const grp=(g,title)=>`<div class="wsv-g"><div class="wsv-t">${title}</div>${WS_FIELDS.filter(f=>f[2]===g).map(([k,l])=>`<div class="wsv-r"><span class="wsv-l">${esc(l)}</span><span class="wsv-v">${val(k)}</span><span class="wsv-s" title="Where this value came from">${fs[k]?esc(fs[k]):(a[k]!=null&&String(a[k]).trim()!==''?(Object.keys(fs).length?'entered by hand':'source not recorded'):'')}</span></div>`).join('')}</div>`;
  openModal(`<div class="mhead"><b>${esc(a.ref||'Activity')} · ${esc(a.employer||'(no employer)')}</b><button class="mclose" id="mClose" aria-label="Close">×</button></div><div class="mbody">
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${wsReadyPill(a)} ${wsSrcPill(a)} <span class="pill idle">claim week ends ${fmtD(weekEnding(a.date||T()))}</span>${a.reported_on?' <span class="pill good">reported '+fmtD(a.reported_on)+'</span>':''}</div>
    ${miss.length?`<div class="note">Needs Review — the claim asks for: <b>${esc(miss.join(', '))}</b>. These were not in any linked record, so they were left blank rather than guessed.</div>`:''}
    ${srow?`<div class="note">Linked to ${WS_SRC[a.source_kind][0]} <b>${esc(srow.ref||'')}</b>${srow.company?' — '+esc(srow.company):''}${srow.position?' · '+esc(srow.position):''}. Editing this activity never changes that record.</div>`:''}
    ${rp&&canEdit()?`<div class="ws-banner"><span>${Object.keys(rp).filter(k=>k!=='field_sources').length} blank field(s) can be filled from ${esc(srow.ref||'the linked record')}: ${esc(Object.keys(rp).filter(k=>k!=='field_sources').map(k=>WS_LABEL[k]||k).join(', '))}.</span><button class="btn" id="wsvRefresh">Fill blanks from source</button></div>`:''}
    ${sugg.length&&canEdit()?`<div class="ws-banner"><span>Possible source for this hand-entered activity: ${sugg.map((c,i)=>`<b>${esc(c.r.ref||'')}</b> ${esc(c.r.company||'')} — ${esc(c.why)} <button class="btn" data-link="${i}">Link</button>`).join(' ')}</span></div>`:''}
    ${grp('claim','What the Ohio weekly claim asks for')}${grp('origin','Where it originated / where it was submitted · contact')}${grp('rec','Your record-keeping')}
    <div class="note" style="font-size:11.5px">Created ${a.created_at?fmtDY(String(a.created_at).slice(0,10)):'—'} · last changed ${a.updated_at?fmtDY(String(a.updated_at).slice(0,10)):'—'}</div>
    <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button class="btn" id="wsvCopy">Copy for the claim</button>${canEdit()?'<button class="btn" id="wsvDel" style="color:var(--crit)">Delete</button><button class="btn primary" id="wsvEdit">Edit</button>':''}<button class="btn" id="wsvClose">Close</button></div></div>`);
  const m=document.getElementById('modal'); m.classList.add('wide');
  m.querySelector('#mClose').addEventListener('click',closeModal); m.querySelector('#wsvClose').addEventListener('click',closeModal);
  m.querySelector('#wsvCopy').addEventListener('click',()=>wsCopy(wsAsText(a),'Claim fields'));
  const ed=m.querySelector('#wsvEdit'); if(ed) ed.addEventListener('click',()=>activityModal(a));
  const dl=m.querySelector('#wsvDel'); if(dl) dl.addEventListener('click',()=>wsDelete(a));
  const rf=m.querySelector('#wsvRefresh'); if(rf) rf.addEventListener('click',()=>guarded(async()=>{ await db.update('activities',a.id,rp); render(); wsViewModal(S.activities.find(x=>x.id===a.id)); },'Blank fields filled from the linked record'));
  m.querySelectorAll('[data-link]').forEach(b=>b.addEventListener('click',()=>{ const c=sugg[+b.dataset.link]; guarded(async()=>{ const base={...a,source_kind:c.kind,source_id:c.r.id}; const p=wsRefreshPatch(base)||{}; await db.update('activities',a.id,{source_kind:c.kind,source_id:c.r.id,...p}); render(); wsViewModal(S.activities.find(x=>x.id===a.id)); },`Linked to ${c.r.ref||'source'}`); }));
}

/* Add / Edit — same order and wording as the Ohio weekly claim, plus where it originated */
function activityModal(a,preset){
  const isNew=!a, v=a?{...a}:{date:T(),type:'Application',method:'',outcome:'',state:'',...(preset||{})};
  const book=employerBook(), names=[...new Set([...(S.activities||[]).map(x=>x.employer),...(S.apps||[]).map(x=>x.company),...(S.interviews||[]).map(x=>x.company),...(S.recruiters||[]).map(x=>x.agency)].filter(Boolean).map(s=>String(s).trim()))].sort();
  const since=String(S.settings.separationDate||'2000-01-01').slice(0,10);
  let fs={...(v.field_sources||{})};
  const srcOpts=(kind,rows,dk,lab)=>{ const rs=rows.filter(r=>r[dk]&&String(r[dk]).slice(0,10)>=since).sort((x,y)=>String(y[dk]).localeCompare(String(x[dk]))).slice(0,80); return rs.length?`<optgroup label="${WS_SRC[kind][0]}s">${rs.map(r=>`<option value="${kind}:${r.id}">${esc(r.ref||'')} · ${esc(lab(r))} · ${fmtD(r[dk])}</option>`).join('')}</optgroup>`:''; };

/* fill blank fields of every linked record from its source — never overwrites */
async function wsRefreshAll(){
  const todo=(S.activities||[]).map(a=>[a,wsRefreshPatch(a)]).filter(([,p])=>p);
  if(!todo.length){ toast('Nothing to fill — linked records have no extra details'); return; }

}

      <span class="pill ${wk.length>=req?'good':wk.length===req-1?'warn':'crit'}">${wk.length} of ${req} activities</span><span class="pill ${ready.length===wk.length&&wk.length?'good':'warn'}">${ready.length} ready</span>${rep?`<span class="pill good">Reported ${fmtD(wk[0].reported_on)}</span>`:''}<span style="flex:1"></span>${canEdit()?'<button class="btn" id="wscAdd">+ Add activity to this week</button>':''}</div>

/* the same View · Edit · Delete trio on every record in this module */
const recActions=(id,kind)=>`<span class="rec-acts"><button class="btn" data-rv="${kind}:${id}" title="View">View</button>${canEdit()?`<button class="btn" data-re="${kind}:${id}" title="Edit">Edit</button><button class="btn rec-del" data-rd="${kind}:${id}" title="Delete">Delete</button>`:''}</span>`;
function bindRecActions(root){

function wsExportCSV(){

function monthStats(m){ // totals for one month: income, spending (lines + debt payments − hardship relief), net
  const lines=expOf(m).filter(e=>(e.status||'Active')==='Active'), inc=expOf(m,'income').filter(e=>(e.status||'Active')==='Active');
  const cur=curMonth(), debts=debtsActive();
  const debtB = m>=cur ? sum(debts.map(debtPlanned)) : sum(debts.map(d=>debtPaidInMonth(d,m)));
  const debtA = m===cur ? sum(debts.map(d=>Math.max(debtPlanned(d),debtPaidInMonth(d,m)))) : sum((S.debts||[]).map(d=>debtPaidInMonth(d,m)));
  const relief=hardshipReliefInMonth(m);
  const spB=sum(lines.map(e=>+e.budget||0))+debtB-relief, spA=sum(lines.map(e=>+e.actual||0))+(m>cur?0:debtA)-(m>cur?0:relief);
  const incB=sum(inc.map(e=>+e.budget||0)), incA=sum(inc.map(e=>+e.actual||0));
  return {m,incB,incA,spB,spA,debtB,debtA,relief,netB:incB-spB,netA:incA-spA,rate:incA>0?(incA-spA)/incA:null,
    ess:sum(lines.filter(e=>expPri(e)==='Essential').map(e=>+e.actual||0)),disc:sum(lines.filter(e=>expPri(e)==='Discretionary').map(e=>+e.actual||0))};
}

/* ---- trends: week / month / year ---- */
function budgetSeries(gran){
  const months=budgetMonths().filter(x=>x<=curMonth());
  if(gran==='week'){
    const tx=(S.btxns||[]), pays=(S.debtpay||[]);
    const first=[...tx.map(x=>String(x.date).slice(0,10)),...pays.map(p=>String(p.date).slice(0,10))].filter(d=>d>=(months[0]||curMonth())+'-01').sort()[0]||T();
    const weeks=[]; for(let w=weekStart(first); w<=weekStart(T()); w=addDays(w,7)) weeks.push(w);
    return weeks.map(w=>{ const e=addDays(w,7), inW=d=>{const s=String(d).slice(0,10); return s>=w&&s<e;};
      const spend=sum(tx.filter(x=>x.kind!=='income'&&inW(x.date)).map(x=>+x.amount||0))+sum(pays.filter(p=>inW(p.date)).map(p=>+p.amount||0));
      const income=sum(tx.filter(x=>x.kind==='income'&&inW(x.date)).map(x=>+x.amount||0));
      return {key:w,label:'Wk of '+fmtD(w),income,spend,net:income-spend,budget:null}; });
  }
  const ms=months.map(monthStats);
  if(gran==='year'){ const ys=[...new Set(ms.map(x=>x.m.slice(0,4)))];
    return ys.map(y=>{ const r=ms.filter(x=>x.m.startsWith(y)); const income=sum(r.map(x=>x.incA)), spend=sum(r.map(x=>x.spA)); return {key:y,label:y+(y===curMonth().slice(0,4)?' (YTD)':''),income,spend,net:income-spend,budget:sum(r.map(x=>x.spB)),incBudget:sum(r.map(x=>x.incB)),months:r.length}; }); }
  return ms.map(x=>({key:x.m,label:mShort(x.m),income:x.incA,spend:x.spA,net:x.netA,budget:x.spB,incBudget:x.incB}));
}

  const under=Object.entries(cats).map(([k,v])=>({k,slack:closedMs.length?Math.min(...closedMs.map(m=>v[m]?v[m].b-v[m].a:0)):0})).filter(x=>closedMs.length>=2&&x.slack>=10).sort((a,b)=>b.slack-a.slack).slice(0,4);
  const insights=[];
  if(curS&&last3.length){ const a=avg(last3.map(x=>x.spA)); insights.push({c:curS.spA>a*1.05?'warn':'good',t:`This month's spending ${curS.spA>a?'is above':'is at or below'} your ${last3.length}-month average`,m:`${fmtMoney(curS.spA)} so far vs ${fmtMoney(a)} average`}); }

      <div id="btMain" class="chart" style="min-height:300px"></div></div>

      <tbody>${rowsT.map(r=>`<tr><td>${esc(r.label)}</td><td class="num">${fmtMoney(r.income)}</td>${g!=='week'?`<td class="num">${fmtMoney(r.budget)}</td>`:''}<td class="num">${fmtMoney(r.spend)}</td>${g!=='week'?`<td class="num" style="color:var(--${r.budget-r.spend<0?'crit':'good'})">${fmtMoney(r.budget-r.spend)}</td>`:''}<td class="num" style="color:var(--${r.net<0?'crit':'good'})">${r.net>=0?'+':''}${fmtMoney(r.net)}</td><td class="num">${r.income>0?Math.round(r.net/r.income*100)+'%':'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No data yet.</td></tr>'}</tbody></table></div></div>

// avalanche simulation across accounts: everyone gets its planned payment; `extra` goes to the highest-APR balance; freed payments roll over
const assumedPay = (d, pay) => pay>0 ? pay : (debtBal(d)>=1 ? Math.max(25, debtBal(d)*0.03) : 0); // no minimum entered yet → typical issuer floor
function avalanche(accts, extra, minOnly){
  let bal=accts.filter(d=>debtBal(d)>=1).map(d=>({apr:(+d.apr||0)/100/12,b:debtBal(d),pay:assumedPay(d, minOnly?(+d.minimum_payment||0):debtPlanned(d))})); const series=[sum(bal.map(x=>x.b))]; let interest=0, m=0;
  while(bal.some(x=>x.b>0.005) && m<600){ m++; let pool=extra; bal.sort((a,b)=>b.apr-a.apr);
    bal.forEach(x=>{ if(x.b<=0.005){ pool+=x.pay; return; } const i=x.b*x.apr; interest+=i; x.b+=i; const p=Math.min(x.b,x.pay); x.b-=p; });
    for(const x of bal){ if(pool<=0) break; if(x.b<=0.005) continue; const p=Math.min(x.b,pool); x.b-=p; pool-=p; }
    series.push(sum(bal.map(x=>Math.max(0,x.b)))); if(m>1 && series[m]>=series[m-1]-0.01) return {months:Infinity,interest:Infinity,series}; }
  return {months:m,interest,series};
}

/* ---- 14. Weekly ---- */
R.weekly = el => {
  const t=T(), wk=addDays(t,7), cc=cashCalc();
  const sec=(title,items,cls)=>`<div class="card span6"><h3>${title}<span class="hint">${items.length}</span></h3>${items.length?`<ul class="alist">${items.map(i=>`<li><span class="pill ${i.c||cls||'info'}">${esc(i.p)}</span><span><span class="t">${esc(i.t)}</span><div class="m">${esc(i.m||'')}</div></span><span class="d">${esc(i.d||'')}</span></li>`).join('')}</ul>`:'<div class="empty">Nothing here this week.</div>'}</div>`;
  const tasks=S.tasks.filter(r=>r.status!=='Complete'&&r.due&&r.due<=wk).sort((a,b)=>a.due.localeCompare(b.due)).map(r=>({p:r.priority,c:taskState(r).cls,t:r.task,m:r.category+' · '+r.status,d:fmtD(r.due)}));
  const rec=S.recruiters.filter(r=>r.status!=='Closed'&&r.next&&r.next<=wk).map(r=>({p:followState(r.next).label,c:followState(r.next).cls,t:r.name,m:(r.agency||'')+' · '+(r.company||''),d:fmtD(r.next)}));
  const net=S.contacts.filter(r=>r.next&&r.next<=wk).map(r=>({p:followState(r.next).label,c:followState(r.next).cls,t:r.person,m:(r.title||'')+', '+(r.company||''),d:fmtD(r.next)}));
  const ints=S.interviews.filter(r=>r.date>=t&&r.date<=wk).map(r=>({p:readiness(r)+'%',c:readyCls(readiness(r)),t:r.company+' — '+r.stage,m:r.type+' · '+(r.interviewer||''),d:fmtD(r.date)}));
  const waiting=S.apps.filter(r=>r.status==='Waiting'||(r.status==='Active'&&r.applied&&diffDays(t,r.applied)>=7&&['Applied','Recruiter Screen'].includes(r.stage))).map(r=>({p:r.stage,c:'wait',t:r.company+' — '+r.position,m:'Next: '+(r.next||''),d:r.applied?diffDays(t,r.applied)+'d ago':''}));
  let fin='';
  if(financeVisible()){
    const budget=expActive().filter(e=>+e.actual>+e.budget).map(e=>({p:'Over',c:e.actual>e.budget*(1+CFG.budgetCritPct/100)?'crit':'warn',t:e.category,m:`${fmtMoney(e.actual)} vs ${fmtMoney(e.budget)} budget`,d:'+'+fmtMoney(e.actual-e.budget)}));
    const cash=[{p:cc.cls==='good'?'OK':cc.cls==='warn'?'Watch':'Critical',c:cc.cls,t:`Runway ${isFinite(cc.months)?cc.months.toFixed(1)+' months':'∞'}`,m:cc.exhaust?'Cash exhausted '+fmtDY(cc.exhaust)+' at current burn':'Income covers expenses',d:fmtMoney(cc.cash)}];
    if(cc.burn>0&&cc.cash/cc.burn<6) cash.push({p:'Action',c:'crit',t:'Reduce burn or accelerate offers',m:'Under 6 months of runway',d:''});
    const pays=debtsActive().filter(d=>debtPaymentPending(d)&&String(d.due_date).slice(0,10)<=wk).map(d=>{const st=debtDueState(d);return {p:st.label,c:st.cls==='info'?'wait':st.cls,t:`${d.name} — ${fmtMoney(debtPlanned(d))}`,m:`${d.type} · min ${fmtMoney(d.minimum_payment)}${d.autopay?' · autopay':''}`,d:fmtD(d.due_date)}});
    const calls=hsActive().filter(h=>(h.next_followup&&h.next_followup<=wk)||h.status==='To call').map(h=>{const st=hsFollowState(h);return {p:st.label,c:st.cls,t:h.entity,m:`${h.type} · ${h.status}${h.program?' · '+h.program:''}`,d:h.next_followup?fmtD(h.next_followup):''}});
    const cal7=cashCalendar(7), hi=healthInfo(), money=cal7.items.map(x=>({p:x.amt>=0?'In':'Out',c:x.amt>=0?'good':'warn',t:x.label,m:`balance after ${fmtMoney(x.bal)}`,d:fmtD(x.date)+' · '+fmtMoney(Math.abs(x.amt))}));
    if(hi.set&&!hi.decided&&hi.nextDl) money.unshift({p:'Decide',c:hi.daysLeft<=14?'crit':'warn',t:'Health coverage decision',m:`COBRA by ${fmtD(hi.cobraBy)} · Marketplace by ${fmtD(hi.mktBy)}`,d:hi.daysLeft+' days'});
    fin=sec('Money in & out this week',money)+sec('Creditor calls & hardship follow-ups',calls)+sec('Payments due this week',pays)+sec('Budget issues',budget)+sec('Cash runway alerts',cash);
  }
  el.innerHTML=`<div class="grid g12"><div class="card span12" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px"><div><b>This week:</b> ${fmtD(t)} – ${fmtD(addDays(t,6))}</div><div class="sample">Every section recomputes from the underlying trackers.</div></div>
  ${goalsCardHTML('span6')}${sec('Tasks due this week',tasks)}${sec('Recruiter follow-ups',rec)}${sec('Networking follow-ups',net)}${sec('Interviews scheduled',ints)}${sec('Applications waiting for response',waiting,'wait')}${fin}</div>`;
};

function genPassword(){ const a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789'; const v=crypto.getRandomValues(new Uint8Array(12)); let s=''; v.forEach(x=>s+=a[x%a.length]); return s.slice(0,4)+'-'+s.slice(4,8)+'-'+s.slice(8,12); }
function csvDownload(name, rows){
  if(!canExport()) return toast('You are not authorized to export');
  if(!rows.length) return toast('Nothing to export');
  const cols=Object.keys(rows[0]); const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv=[cols.join(',')].concat(rows.map(r=>cols.map(c=>q(typeof r[c]==='object'?JSON.stringify(r[c]):r[c])).join(','))).join('\n');
  const a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  logEvent('export',{file:name,rows:rows.length});
}

    ${edit&&!isOwn?`<div class="field"><label for="uStatus">Account status</label><select id="uStatus"><option value="active" ${!(u.banned_until&&new Date(u.banned_until)>new Date())?'selected':''}>Active</option><option value="disabled" ${(u.banned_until&&new Date(u.banned_until)>new Date())?'selected':''}>Disabled</option></select></div>`:''}

    <div class="acc"><div class="acc-h">🎯 Access level</div>
      ${isOwn?`<div class="note">You are the workspace owner: full access to everything. This cannot be changed.</div>`:`
      <div class="acc-row"><span class="acc-l">Role</span><div class="seg" id="uRoleSeg"><label><input type="radio" name="uRole" value="editor" ${(!u||u.role==='editor')?'checked':''}> <b>Editor</b> — adds &amp; updates</label><label><input type="radio" name="uRole" value="viewer" ${(u&&u.role==='viewer')?'checked':''}> <b>Viewer</b> — read-only</label></div></div>
      <div class="acc-row"><span class="acc-l">Scope</span><div><div class="seg"><label><input type="radio" name="uScope" value="all" ${mods.length?'':'checked'}> Full workspace</label><label><input type="radio" name="uScope" value="limited" ${mods.length?'checked':''}> Limited to selected modules</label></div>
        <div class="grid2" id="uModsBox" style="margin-top:6px;${mods.length?'':'opacity:.55'}">${Object.entries(MODULE_GROUPS).map(([k,l])=>`<label class="chk"><input type="checkbox" class="uMod" value="${k}" ${mods.includes(k)?'checked':''}> ${l}</label>`).join('')}</div></div></div>
      <div class="acc-row"><span class="acc-l">Extras</span><div><label class="chk"><input type="checkbox" id="uExport" ${u&&u.can_export?'checked':''}> Authorize data export / download</label>
        <div class="note" style="margin:0">Budget &amp; Cash Runway follow the workspace setting (currently <b>${CFG.financeVisibility==='members'?'visible to all members':'owner only'}</b> — change under Settings).</div></div></div>
      <div class="acc-sum" id="uSummary"></div>`}
    </div>
    <div class="field"><label for="uNotes">Notes (internal)</label><input id="uNotes" value="${esc(u?u.notes||'':'')}" placeholder="e.g. former colleague, helps with networking"></div>

    ${edit?'':`<div class="acc"><div class="acc-h">📨 Send credentials via</div>
      <label class="chk"><input type="checkbox" id="uSendMail" checked> ✉ Email — ${mail?'sent automatically from CareerShift':'opens a pre-filled email in your email app (automatic sending needs an email provider — see Security Audit)'}</label>
      <label class="chk"><input type="checkbox" id="uSendWa"> 💬 WhatsApp — opens a chat with the credentials message<span id="uWaHint" class="note" style="display:inline;margin-left:6px"></span></label>
      <div class="note" style="margin:4px 0 0">The onboarding kit (full email draft, copy, download) opens after creation either way.</div></div>`}
    <div id="uMsg"></div>
    <div class="mfoot"><button type="button" class="btn" id="mCancel">Cancel</button><button type="submit" class="btn primary" id="mSave">${edit?'Save changes':'Create user'}</button></div>
  </form>`;
  openModal(html);
  const m=document.getElementById('modal'); const $=s=>m.querySelector(s);
  $('#mClose').onclick=$('#mCancel').onclick=closeModal;
  eyeAll(m);
  if(!edit){ $('#uGen').onclick=()=>{ $('#uPw').value=genPassword(); if($('#uPw').type==='password') $('#uPw').nextElementSibling.click(); }; }
  const readAccess=()=>{ const role=(m.querySelector('input[name=uRole]:checked')||{}).value||'editor'; const limited=(m.querySelector('input[name=uScope]:checked')||{}).value==='limited'; const modules=limited?[...m.querySelectorAll('.uMod:checked')].map(c=>c.value):[]; return {role,limited,modules,canExp:!!($('#uExport')&&$('#uExport').checked)}; };
  const refreshSummary=()=>{ const s=$('#uSummary'); if(!s) return; const a=readAccess(); const box=$('#uModsBox'); if(box) box.style.opacity=a.limited?'1':'.55'; s.textContent=(a.limited&&!a.modules.length)?'Pick at least one module for a limited scope.':accessSummary(a.role,a.modules,a.canExp,false); };
  m.querySelectorAll('.uMod').forEach(c=>c.addEventListener('change',()=>{ m.querySelector('input[name=uScope][value=limited]').checked=true; refreshSummary(); }));
  m.querySelectorAll('input[name=uRole],input[name=uScope],#uExport').forEach(x=>x.addEventListener('change',refreshSummary)); refreshSummary();
  const waHint=()=>{ const h=$('#uWaHint'); if(h) h.textContent=$('#uPhone').value.trim()?'':'(no mobile — WhatsApp will ask you to pick the contact)'; }; if(!edit){ $('#uPhone').addEventListener('input',waHint); waHint(); }
  $('#fUser').addEventListener('submit',e=>{ e.preventDefault();
    // open the WhatsApp tab synchronously (browsers block pop-ups opened after an await)
    const wantWa=!edit&&$('#uSendWa').checked; const waWin=wantWa? window.open('about:blank','_blank') : null;
    guarded(async()=>{
      const a=isOwn?{role:'owner',limited:false,modules:[],canExp:true}:readAccess();
      if(a.limited && !a.modules.length) throw new Error('Pick at least one module for a limited scope');
      if(!edit && USER && $('#uEmail').value.trim().toLowerCase()===USER.email.toLowerCase()) throw new Error('That is your own email — you are already the owner. Add a different person.');
      const base={first_name:$('#uFirst').value.trim(),last_name:$('#uLast').value.trim(),phone:$('#uPhone').value.trim(),can_export:String(a.canExp),read_only:'false',modules:a.modules,notes:$('#uNotes').value.trim(),app_url:appUrl()};
      $('#mSave').disabled=true; $('#mSave').textContent=edit?'Saving…':'Creating…';
      if(edit){
        await db.admin({action:'update_user',user_id:u.user_id,...base,...(isOwn?{}:{role:a.role,status:$('#uStatus').value})});
        closeModal(); S.adminUsers=null; await refresh(); await db.loadAdmin(); render(); toast('User updated');
      } else {
        const email=$('#uEmail').value.trim().toLowerCase(), pw=$('#uPw').value;
        const r=await db.admin({action:'invite',email,role:a.role,password:pw,status:$('#uStatus').value,require_change:String($('#uRequire').checked),send_email:String(mail&&$('#uSendMail').checked),...base});
        S.adminUsers=null; await db.loadAll(); await db.loadAdmin(); render();
        const created={...base,phone:$('#uPhone').value.trim(),email,role:a.role,read_only:false,can_export:a.canExp,display_name:r.display_name};
        const tempPw=r.created_account? pw : null;
        if(waWin){ if(tempPw||true){ waWin.location=waLink(created.phone, waCredentialsText(created,tempPw)); logEvent('onboarding_whatsapp',{target:email,with_password:!!tempPw}); } }
        if(!mail && $('#uSendMail').checked){ logEvent('onboarding_mailto',{target:email}); setTimeout(()=>{ location.href=mailtoLink(email,`Your CareerShift access — ${S.settings.name||'workspace'}`,onboardingText(created,tempPw)); },300); }
        kitModal(created, tempPw, r);
      }
    }).then(()=>{ const s=$('#mSave'); if(s){ s.disabled=false; s.textContent=edit?'Save changes':'Create user'; } if(waWin && waWin.location.href==='about:blank') waWin.close(); });
  });
}
function kitModal(u, pw, r){ // onboarding kit: email draft with the temporary password, send / WhatsApp / copy
  // No password in hand and the member has not completed first sign-in yet -> issue a fresh temporary password automatically
  const pending = ('must_change_password' in u) && (u.must_change_password || !u.last_sign_in_at);
  if(!pw && !r && MODE!=='demo' && u.user_id && USER && u.user_id!==USER.id && pending && !u._autoIssued){
    openModal(`<div class="mhead"><b>Onboarding kit — ${esc(u.display_name||u.email)}</b></div><div class="mbody"><div class="msg info">Issuing a temporary password for ${esc(u.email)}…</div></div>`);
    guarded(async()=>{ const r2=await db.admin({action:'reset_password',user_id:u.user_id,send_email:'false',app_url:appUrl()}); S.adminUsers=null; await db.loadAdmin(); render(); kitModal({...u,_autoIssued:true},r2.temp_password,{created_account:true,emailed:false,mail_error:null,auto:true}); }).then(()=>{ if(!document.getElementById('kText')) closeModal(); });
    return;
  }
  const text=onboardingText(u,pw);
  const first=u.first_name||(u.display_name||u.email||'').split(/[ @]/)[0]||'there';
  const status = r? (r.auto? `<div class="msg ok">A fresh temporary password was issued for <b>${esc(u.email)}</b> (they had not completed sign-in yet) and is included in the message below. Send it by email or WhatsApp.</div>` : r.emailed? `<div class="msg ok">Account ${r.created_account?'created':'linked'} and the temporary password was emailed to <b>${esc(u.email)}</b>. You can still send it again below.</div>` : r.created_account? `<div class="msg info">Account created. Review the draft below, then <b>Send email</b> or <b>Share via WhatsApp</b>. The temporary password is shown only in this kit.</div>` : `<div class="msg ok">${esc(u.email)} already had an account and was added to the workspace. Their existing password still applies.</div>`)
    : (pw? '' : `<div class="msg info" id="kNoPw">This message has no temporary password because passwords are never stored in readable form. <button class="btn primary" id="kIssue" style="padding:4px 10px;font-size:12.5px;margin-left:6px">Issue a temporary password and add it</button><div class="note" style="margin-top:6px">${(u.last_sign_in_at&&!u.must_change_password)?'<b>Careful:</b> this member has already signed in with their own password — issuing a new temporary one replaces it and they will be asked to choose a new password.':'This member has not completed sign-in yet, so a fresh temporary password is safe.'}</div></div>`);
  const mail=S.mailConfig&&S.mailConfig.email_configured;
  const subj=`Your CareerShift access — ${S.settings.name||'workspace'}`;

  openModal(`<div class="mhead"><b>Onboarding kit — ${esc(u.display_name||u.email)}</b><button class="mclose" id="kClose">×</button></div><div class="mbody">${status}
    ${pw?`<div class="pwbox"><div><span>Temporary password</span><code id="kPw">${esc(pw)}</code></div><button class="btn" id="kCopyPw">Copy password</button></div>`:''}
    <div class="draft">
      <div class="draft-row"><span>From</span><div>${esc(ownerName())} ${USER?`&lt;${esc(USER.email)}&gt;`:''}</div></div>
      <div class="draft-row"><span>To</span><div><b>${esc(u.email)}</b>${u.phone?` · WhatsApp ${esc(u.phone)}`:''}</div></div>
      <div class="draft-row"><span>Subject</span><input id="kSubj" value="${esc(subj)}"></div>
      <textarea id="kText" rows="17">${esc(text)}</textarea>
    </div>
    <div class="kit-actions">
      <button class="btn primary" id="kSend" title="${mail?'Send this draft from CareerShift':'Opens the draft in your email app (automatic sending needs an email provider — see Security Audit)'}">${mail&&MODE!=='demo'?'✉ Send email':'✉ Send via my email app'}</button>
      <a class="btn wa" id="kWa" href="#" target="_blank" rel="noopener" title="Sends a short credentials message (link, email, temporary password, first steps)">💬 Send via WhatsApp${u.phone?'':' (pick contact)'}</a>
      <button class="btn" id="kCopy">Copy message</button>
      <button class="btn" id="kDl">Download .txt</button>
      <button class="btn" id="kDone">Done</button>
    </div>
    <div class="note">${u.phone?'WhatsApp opens a chat with '+esc(u.phone)+' and the message pre-filled — press send there.':'No mobile number on file, so WhatsApp will ask you to pick the contact; add a number via Edit to skip that step.'} Checklist: ① send ② confirm they can sign in ③ confirm they changed the temporary password (status turns to "Active" in Users) ④ walk them through their modules.</div></div>`);
  const m=document.getElementById('modal'); const $=s=>m.querySelector(s);
  $('#kWa').href=waLink(u.phone, waCredentialsText(u,pw));
  $('#kClose').onclick=$('#kDone').onclick=closeModal;
  $('#kCopy').onclick=()=>navigator.clipboard?.writeText($('#kText').value).then(()=>toast('Message copied')).catch(()=>toast('Select the text and copy manually'));
  const cp=$('#kCopyPw'); if(cp) cp.onclick=()=>navigator.clipboard?.writeText(pw).then(()=>toast('Password copied'));
  $('#kDl').onclick=()=>textDownload(`careershift-onboarding-${(u.email||'user').split('@')[0]}.txt`,`Subject: ${$('#kSubj').value}\n\n${$('#kText').value}`);
  $('#kWa').addEventListener('click',()=>logEvent('onboarding_whatsapp',{target:u.email,with_password:!!pw}));
  $('#kSend').onclick=()=>{
    if(mail&&MODE!=='demo'){ const btn=$('#kSend'); btn.disabled=true; btn.textContent='Sending…'; guarded(async()=>{ const r2=await db.admin({action:'send_message',to:u.email,subject:$('#kSubj').value,text:$('#kText').value}); if(!r2.emailed) throw new Error(r2.mail_error||'Not sent'); btn.textContent='✓ Sent'; },'Email sent to '+u.email).then(()=>{ if(btn.textContent!=='✓ Sent'){ btn.disabled=false; btn.textContent='✉ Send email'; } }); }
    else { logEvent('onboarding_mailto',{target:u.email}); location.href=mailtoLink(u.email,$('#kSubj').value,$('#kText').value); }
  };
  const issue=$('#kIssue'); if(issue) issue.onclick=()=>guarded(async()=>{ issue.disabled=true; issue.textContent='Issuing…'; const r2=await db.admin({action:'reset_password',user_id:u.user_id,send_email:'false',app_url:appUrl()}); S.adminUsers=null; await db.loadAdmin(); render(); closeModal(); kitModal(u,r2.temp_password,{created_account:true,emailed:false,mail_error:null}); },'Temporary password issued');
  logEvent('onboarding_kit',{target:u.email,with_password:!!pw});
}

}

function healthChecks(){
  const t=T(), wk=addDays(t,-7);
  const events=S.events||[], users=S.adminUsers||[], inv=S.invites||[];
  const daysSince=d=>d?diffDays(t,String(d).slice(0,10)):null;
  const apps7=S.apps.filter(a=>a.applied&&a.applied>wk).length;
  const net7=S.contacts.filter(c=>c.last&&c.last>wk).length + S.recruiters.filter(r=>r.last&&r.last>wk).length;
  const responded=S.apps.filter(a=>a.stage!=='Applied').length;
  const followups=[...S.recruiters.map(r=>r.next),...S.contacts.map(c=>c.next)].filter(Boolean);
  const overdueF=followups.filter(d=>d<t).length;
  const lastExport=events.find(e=>e.event==='export'||e.event==='export_json');
  const activeDays=new Set(events.filter(e=>e.created_at>new Date(Date.now()-7*DAY).toISOString()).map(e=>String(e.created_at).slice(0,10))).size;
  const pendingFirst=users.filter(u=>u.must_change_password).length, never=users.filter(u=>!u.last_sign_in_at).length, disabled=users.filter(u=>u.banned_until&&new Date(u.banned_until)>new Date()).length;
  const staleInv=inv.filter(i=>daysSince(i.created_at)>7).length;
  const exporters=users.filter(u=>u.role!=='owner'&&u.can_export).length, wideScope=users.filter(u=>u.role==='editor'&&!u.read_only&&(!u.modules||!u.modules.length)).length;
  const chk=(group,name,cls,detail,fix)=>({group,name,cls,detail,fix});
  const out=[
    chk('Security','Row-level security','good','Every table enforces workspace membership, role, read-only flag and module scope in Postgres, not just in the UI.'),
    chk('Security','Finance visibility',CFG.financeVisibility==='owner'?'good':'warn',CFG.financeVisibility==='owner'?'Budget and Cash Runway are owner-only.':'Budget and Cash Runway are visible to all members.','Settings → Finance visibility'),
    chk('Security','Invitation email delivery',(S.mailConfig&&S.mailConfig.email_configured)?'good':'warn',(S.mailConfig&&S.mailConfig.email_configured)?'Temporary passwords are emailed automatically.':'No email provider configured — the onboarding kit shows the temporary password for you to send.','Add RESEND_API_KEY to the admin-users function secrets'),
    chk('Security','App version deployed',!LATEST?'info':cmpVer(APP_VERSION,LATEST)<0?'crit':'good',!LATEST?`Running v${APP_VERSION} (build ${APP_BUILD}); latest unknown.`:cmpVer(APP_VERSION,LATEST)<0?`Running v${APP_VERSION}; latest release is v${LATEST}.`:`Running v${APP_VERSION} (build ${APP_BUILD}) — latest.`,cmpVer(APP_VERSION,LATEST||'0')<0?'Replace index.html on your host':null),
    chk('Security','Members on old versions',(S.events||[]).some(e=>e.event==='sign_in'&&e.detail&&e.detail.version&&LATEST&&cmpVer(e.detail.version,LATEST)<0&&e.created_at>new Date(Date.now()-7*DAY).toISOString())?'warn':'good',`${new Set((S.events||[]).filter(e=>e.event==='sign_in'&&e.detail&&e.detail.version&&LATEST&&cmpVer(e.detail.version,LATEST)<0&&e.created_at>new Date(Date.now()-7*DAY).toISOString()).map(e=>e.user_email)).size} member(s) signed in on an older build this week.`,'Send them the new app link / clear cache'),
    chk('Security','App link configured',CFG.appUrl?'good':'warn',CFG.appUrl?`Onboarding messages point to ${CFG.appUrl}`:'No app link set — onboarding messages fall back to the current page address.','Settings → App link'),
    chk('Security','Accounts pending first sign-in',pendingFirst?'warn':'good',`${pendingFirst} member${pendingFirst===1?'':'s'} still on a temporary password.`,pendingFirst?'Follow up or reset their temporary password':null),
    chk('Security','Members who never signed in',never?'warn':'good',`${never} member${never===1?'':'s'} have never signed in.`),
    chk('Security','Disabled accounts',disabled?'info':'good',`${disabled} disabled account${disabled===1?'':'s'}.`),
    chk('Security','Export rights granted',exporters?'info':'good',`${exporters} non-owner member(s) may export data.`,exporters?'Review in Users → Edit':null),
    chk('Security','Editors with full write scope',wideScope>2?'warn':'info',`${wideScope} editor(s) can write to every module.`,'Use Access level to narrow scope where possible'),
    chk('Security','Stale pending invites',staleInv?'warn':'good',`${staleInv} legacy invite${staleInv===1?'':'s'} older than 7 days.`),
    chk('Security','Single owner',users.filter(u=>u.role==='owner').length<=1?'info':'warn',`${users.filter(u=>u.role==='owner').length||1} owner account(s). Keep exactly one; use editors for helpers.`),
    chk('Security','Multi-factor authentication','info','Not enforced. Enable MFA in Supabase Auth → Providers if you want a second factor for owners.'),
    chk('Backup','Last data export',lastExport?(daysSince(lastExport.created_at)>7?'warn':'good'):'crit',lastExport?`Last export ${ago(lastExport.created_at)}.`:'No export recorded yet.','Export / Import → Export workspace JSON (weekly recommended)'),
    chk('Data hygiene','Tasks without a due date',S.tasks.some(x=>!x.due)?'warn':'good',`${S.tasks.filter(x=>!x.due).length} task(s) have no due date.`),
    chk('Data hygiene','Overdue tasks > 7 days',S.tasks.some(x=>x.status!=='Complete'&&x.due&&diffDays(t,x.due)>7)?'crit':'good',`${S.tasks.filter(x=>x.status!=='Complete'&&x.due&&diffDays(t,x.due)>7).length} task(s) overdue more than a week.`),
    chk('Data hygiene','Applications without a next action',S.apps.some(a=>a.status!=='Closed'&&!a.next)?'warn':'good',`${S.apps.filter(a=>a.status!=='Closed'&&!a.next).length} open application(s) missing a next action.`),
    chk('Data hygiene','Applications silent > 14 days',S.apps.some(a=>a.status==='Active'&&a.stage==='Applied'&&a.applied&&diffDays(t,a.applied)>14)?'warn':'good',`${S.apps.filter(a=>a.status==='Active'&&a.stage==='Applied'&&a.applied&&diffDays(t,a.applied)>14).length} application(s) at "Applied" for over two weeks.`,'Follow up or mark Closed'),
    chk('Data hygiene','Contacts without a follow-up date',[...S.recruiters.filter(r=>r.status!=='Closed'&&!r.next),...S.contacts.filter(c=>c.status!=='Dormant'&&!c.next)].length?'warn':'good',`${[...S.recruiters.filter(r=>r.status!=='Closed'&&!r.next),...S.contacts.filter(c=>c.status!=='Dormant'&&!c.next)].length} active recruiter/contact record(s) with no next follow-up.`),
    chk('Data hygiene','Compliance logged this week',S.compliance.some(c=>c.week>=weekEnding(t))?'good':'crit',S.compliance.some(c=>c.week>=weekEnding(t))?'Current week is logged.':'No compliance row for the current week.','Compliance → Add week'),
    chk('Momentum','Applications this week',apps7>=CFG.weeklyAppTarget?'good':apps7>=Math.ceil(CFG.weeklyAppTarget/2)?'warn':'crit',`${apps7} of ${CFG.weeklyAppTarget} target in the last 7 days.`),
    chk('Momentum','Networking touches this week',net7>=CFG.weeklyNetworkTarget?'good':net7?'warn':'crit',`${net7} recruiter/contact touches of ${CFG.weeklyNetworkTarget} target.`),
    chk('Momentum','Response rate',S.apps.length?(responded/S.apps.length>=0.3?'good':'warn'):'info',S.apps.length?`${Math.round(responded/S.apps.length*100)}% of applications moved past "Applied" (benchmark ≥ 30%).`:'No applications yet.'),
    chk('Momentum','Interview conversion',S.apps.length?(S.interviews.length/S.apps.length>=0.2?'good':'warn'):'info',S.apps.length?`${S.interviews.length} interview(s) from ${S.apps.length} application(s) — ${Math.round(S.interviews.length/S.apps.length*100)}% (benchmark ≥ 20%).`:'No applications yet.'),
    chk('Momentum','Follow-up discipline',overdueF?'warn':'good',`${overdueF} overdue follow-up(s) of ${followups.length} scheduled.`),

(async function boot(){

    if(event==='PASSWORD_RECOVERY') return showAuth('recover');
