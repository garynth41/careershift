  on('#fSetPw',async()=>{ if(val('#pw')!==val('#pw2')) return showAuth('setpw',{cls:'err',text:'Passwords do not match'}); const {error}=await sb.auth.updateUser({password:val('#pw'),data:{must_change_password:false}}); if(error) return showAuth('setpw',{cls:'err',text:error.message}); toast('Password set'); logEvent('password_set'); enterApp(); });
  on('#fRecover',async()=>{ const {error}=await sb.auth.updateUser({password:val('#pw')}); if(error) return showAuth('recover',{cls:'err',text:error.message}); toast('Password updated'); enterApp(); });
  on('#fWs',async()=>{ try{ const {data,error}=await sb.rpc('create_workspace',{p_name:val('#wsn'),p_separation:val('#sep')||null}); if(error) throw error; await enterApp(data, authBody().querySelector('#withSample').checked); }catch(e){ showAuth('workspace',{cls:'err',text:e.message}); } });
}
const val=sel=>authBody().querySelector(sel).value.trim();
/* password reveal toggle: wraps any password input in a row with an eye button */
function addEye(input){
  if(!input || input.dataset.eye) return; input.dataset.eye='1';
  const row=document.createElement('div'); row.className='pwrow'; input.parentNode.insertBefore(row,input); row.appendChild(input);
  const btn=document.createElement('button'); btn.type='button'; btn.className='btn eye'; btn.title='Show password'; btn.setAttribute('aria-label','Show password'); btn.setAttribute('aria-pressed','false');
  btn.innerHTML=EYE_ON;
  btn.addEventListener('click',()=>{ const show=input.type==='password'; input.type=show?'text':'password'; btn.innerHTML=show?EYE_OFF:EYE_ON; btn.title=btn.ariaLabel=show?'Hide password':'Show password'; btn.setAttribute('aria-pressed',String(show)); input.focus({preventScroll:true}); });
  row.appendChild(btn);
}
const EYE_ON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.8 21.8 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a21.8 21.8 0 0 1-3.17 4.19"/><line x1="1" y1="1" x2="23" y2="23"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>';
const eyeAll=root=>(root||document).querySelectorAll('input[type=password]').forEach(addEye);

let rtChannel=null, rtTimer=null, RT_PENDING=false;
const rtBusy=()=>{ const a=document.activeElement, m=document.getElementById('modal'); const typing=a&&a!==document.body&&a.matches&&a.matches('input:not([type=search]):not([type=checkbox]):not([type=radio]),textarea,select')&&!a.closest('#modal'); const modal=!document.getElementById('modalBack').hidden&&m&&m.innerHTML.trim()!==''; return typing||modal; };
function rtFire(){ if(rtBusy()){ RT_PENDING=true; return; } RT_PENDING=false; refresh(true); }
document.addEventListener('focusout',()=>{ if(RT_PENDING) setTimeout(()=>{ if(RT_PENDING) rtFire(); },250); });
setInterval(()=>{ if(RT_PENDING) rtFire(); },5000);
function subscribeRealtime(){
  if(rtChannel){ sb.removeChannel(rtChannel); rtChannel=null; }
  rtChannel = sb.channel('ws-'+WS.id);
  ['tasks','applications','interviews','recruiters','contacts','compliance_weeks','work_search_activities','expenses','debt_accounts','debt_payments','hardship_outreach','cash_events','cash_snapshots','budget_txns','cash_inputs','workspace_members','activity_log','offers','earnings','fin_items'].forEach(t=>{
    rtChannel.on('postgres_changes',{event:'*',schema:'public',table:t,filter:`workspace_id=eq.${WS.id}`},()=>{ clearTimeout(rtTimer); rtTimer=setTimeout(rtFire,350); });
  });
  rtChannel.subscribe(status=>{ const s=document.getElementById('syncState'); if(s) s.className='sync'+(status==='SUBSCRIBED'?'':' off'); });
}
async function enterApp(preferWs, withSample){
  const {data:{user}} = await sb.auth.getUser(); USER=user;
  if(!USER) return showAuth('signin');
  if(USER.user_metadata && USER.user_metadata.must_change_password) return showAuth('setpw');
  try{ await sb.rpc('accept_pending_invites'); }catch(e){ console.warn(e); }
  const {data:mems,error} = await sb.from('workspace_members').select('workspace_id, role, can_export, read_only, modules, first_name, last_name, display_name, phone, workspaces(id,name,separation_date,weekly_requirement,owner_id,settings)').eq('user_id',USER.id).order('created_at');
  if(error){ return showAuth('signin',{cls:'err',text:error.message}); }
  if(!mems || !mems.length) return showAuth('workspace');
  let pick = mems.find(m=>m.workspace_id===preferWs) || mems.find(m=>m.role==='owner') || mems[0];
  try{ const saved=localStorage.getItem('careershift.ws'); const s2=mems.find(m=>m.workspace_id===saved); if(!preferWs && s2) pick=s2; }catch(e){}
  try{ const {data:meta}=await sb.from('app_meta').select('key,value'); if(meta){ const m=Object.fromEntries(meta.map(x=>[x.key,x.value])); LATEST=m.latest_version||null; S=S||{}; S.changelog=m.changelog||''; } }catch(e){}
  const firstEntry = !WS;
  WS = pick.workspaces; ROLE = pick.role; ME = {can_export:pick.can_export, read_only:pick.read_only, modules:pick.modules, first_name:pick.first_name, last_name:pick.last_name, display_name:pick.display_name, phone:pick.phone}; applySettings(WS.settings);
  try{ localStorage.setItem('careershift.ws', WS.id); }catch(e){}
  if(firstEntry) logEvent('sign_in',{role:ROLE,version:APP_VERSION,build:APP_BUILD});
  try{ const {data:{session:se}}=await sb.auth.getSession(); ACCESS_TOKEN=se?se.access_token:null; }catch(e){}
  startSession();
  stampVersion();
  if(withSample){ try{ await db.loadSample(); }catch(e){ console.error(e); toast('Sample data failed: '+e.message); } }
  document.getElementById('authScreen').hidden=true; document.getElementById('appShell').hidden=false;
  await refresh(); subscribeRealtime();
  // workspace switcher when a member of several
  if(mems.length>1){
    const sw=document.createElement('select'); sw.className='btn'; sw.id='wsSwitch';
    mems.forEach(m=>{ const o=document.createElement('option'); o.value=m.workspace_id; o.textContent=m.workspaces.name+' ('+m.role+')'; o.selected=m.workspace_id===WS.id; sw.appendChild(o); });
    sw.addEventListener('change',()=>enterApp(sw.value));
    const old=document.getElementById('wsSwitch'); if(old) old.remove();
    document.querySelector('.asof').prepend(sw);
  }
}

/* ===================== Boot ===================== */
document.getElementById('btnSignOut').addEventListener('click',async()=>{ if(MODE==='demo'){ await endSession('sign_out'); MODE='db'; S=null; showAuth(); return; } logEvent('sign_out'); await endSession('sign_out'); await new Promise(r=>setTimeout(r,150)); await sb.auth.signOut(); });
document.getElementById('btnDemo').addEventListener('click',async()=>{ MODE='demo'; ROLE='owner'; ME={}; USER=null; WS=null; await db.loadAll(); logEvent('sign_in',{role:'owner',demo:true}); startSession(); document.getElementById('authScreen').hidden=true; document.getElementById('appShell').hidden=false; render(); });
try{ const mq=matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener('change',()=>render()); new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']}); }catch(e){}
/* ---- dark mode toggle: light <-> dark, remembered per browser; falls back to the OS setting until chosen ---- */
const SUN='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
const MOON='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
function currentTheme(){ const t=document.documentElement.dataset.theme; if(t) return t; return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'; }
function applyTheme(t){ if(t) document.documentElement.dataset.theme=t; else delete document.documentElement.dataset.theme; try{ t? localStorage.setItem('careershift.theme',t) : localStorage.removeItem('careershift.theme'); }catch(e){}
  const dark=currentTheme()==='dark';
  document.querySelectorAll('.btn.theme').forEach(btn=>{ btn.innerHTML=(dark?SUN:MOON)+`<span>${dark?'Light':'Dark'} mode</span>`; btn.setAttribute('aria-pressed',String(dark)); btn.title=dark?'Switch to light mode':'Switch to dark mode'; }); }
function toggleTheme(){ applyTheme(currentTheme()==='dark'?'light':'dark'); logEvent('theme',{theme:currentTheme()}); }
document.addEventListener('click',e=>{ if(e.target.closest('.btn.theme')) toggleTheme(); });
try{ applyTheme(localStorage.getItem('careershift.theme')||null); }catch(e){ applyTheme(null); }
function stampVersion(){
  const t=versionLabel();
  const rv=document.getElementById('railVersion'); if(rv){ rv.innerHTML=`${APP_NAME} <b>v${APP_VERSION}</b><br><span>build ${APP_BUILD}</span>${LATEST&&cmpVer(APP_VERSION,LATEST)<0?`<br><span class="pill crit" style="margin-top:4px">update available: v${LATEST}</span>`:''}`; rv.onclick=aboutModal; }
  const av=document.getElementById('authVersion'); if(av) av.textContent=t;
  document.title=`${APP_NAME} v${APP_VERSION}`;
  console.info(`%c${APP_NAME} ${t}`,'color:#2a78d6;font-weight:bold');
}
function aboutModal(){
  const cl=(S&&S.changelog)||'';
  openModal(`<div class="mhead"><b>About ${APP_NAME}</b><button class="mclose" id="aClose">×</button></div><div class="mbody">
    <div class="kit-grid"><div class="kv"><span>This copy</span><code>v${APP_VERSION}</code></div><div class="kv"><span>Build</span><code>${APP_BUILD}</code></div><div class="kv"><span>Latest released</span><code>${LATEST?'v'+LATEST:'—'}</code></div><div class="kv"><span>Status</span><code>${!LATEST?'unknown (offline)':cmpVer(APP_VERSION,LATEST)<0?'OUTDATED — replace index.html on your host':cmpVer(APP_VERSION,LATEST)>0?'newer than registry':'up to date'}</code></div>
    <div class="kv"><span>Backend</span><code>${SUPABASE_URL.replace('https://','')}</code></div><div class="kv"><span>Admin function</span><code>admin-users ${S&&S.mailConfig&&S.mailConfig.fn_version?'v'+S.mailConfig.fn_version:''}</code></div></div>
    <h3 style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);margin:6px 0">Release notes</h3>
    <ul class="alist" style="font-size:13px">${cl.split('|').map(x=>x.trim()).filter(Boolean).map(x=>`<li><span class="pill ${x.startsWith(APP_VERSION)?'info':'idle'}">${esc(x.split(' ')[0])}</span><span>${esc(x.slice(x.indexOf(' ')+1))}</span><span></span></li>`).join('')||'<li class="empty">Release notes load after sign-in.</li>'}</ul>
    <div class="mfoot"><button class="btn" id="aDone">Close</button></div></div>`);
  document.getElementById('aClose').onclick=document.getElementById('aDone').onclick=closeModal;
}
(async function boot(){
  stampVersion();
  if(window.__CS_POPUP) return; // Microsoft sign-in popup: hand the code back and close
  if(!window.supabase){ showAuth('signin',{cls:'err',text:'Could not load the Supabase client — this page must be opened from a normal web host or local file, not inside a sandboxed preview. The offline demo below still works.'}); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='PASSWORD_RECOVERY') return showAuth('recover');
    if(session) ACCESS_TOKEN=session.access_token;
    if(event==='SIGNED_OUT'){ USER=null; WS=null; S=null; SESSION=null; clearInterval(HB_TIMER); if(rtChannel){ sb.removeChannel(rtChannel); rtChannel=null; } showAuth('signin',{cls:'ok',text:'Signed out.'}); }
  });
  if(/claude(usercontent)?\.(ai|com)$/.test(location.hostname)){ // hosted preview cannot reach Supabase (CSP) — run the offline demo
    MODE='demo'; ROLE='owner'; ME={}; await db.loadAll(); logEvent('sign_in',{role:'owner',demo:true,version:APP_VERSION}); startSession(); stampVersion(); document.getElementById('authScreen').hidden=true; document.getElementById('appShell').hidden=false; render();
    document.getElementById('banner').insertAdjacentHTML('afterbegin','<div class="banner info">Preview copy — this page runs the offline demo. Download <b>CareerShift.html</b> and open or host it to sign in and collaborate with your team.</div>'); return; }
  const {data:{session}} = await sb.auth.getSession();
  if(session) enterApp(); else showAuth('signin');
})();
</script>
